# ⚠️ INTERNAL USE ONLY - Configuration for forge-ci's own releases
# This file is used by self-*.yml workflows to manage forge-ci releases.
# For templates to use in YOUR project, see examples/ directory.
artifacts:
  - name: forge-ci-meta
    project-type: meta
    working-directory: .
    build-type: application
    # A release request must be signed by a key in .forge-ci/allowed_signers.
    require-authorization: true
containers: []
