#
# GitLab CI/CD Catalog component: Gradle (JVM) release build.
#
# The GitLab counterpart of .github/workflows/build-gradle-app.yml. The whole
# sequence (gradlew chmod → metadata → tasks → SBOM → summaries) lives in the
# binary as `forge-ci build gradle run`, so this job is a single line — the
# same sequence GitHub runs. gradle runs in the job's working directory (we cd
# into it). GitLab clones the repo for the job; the runtime-java image carries a
# JDK + forge-ci. JARs land under build/libs/ and the Build SBOM under
# build/reports/, which the job publishes as artifacts.
#
# Consume (pin a released version):
#   include:
#     - component: $CI_SERVER_FQDN/diggsweden/forge-ci/build-gradle@0.90.0
#       inputs:
#         gradle-tasks: "build"
spec:
  inputs:
    stage:
      default: build
      description: Pipeline stage the build runs in.
    job-name:
      default: build-gradle
      description: Name of the generated job.
    working-directory:
      default: "."
      description: Directory containing ./gradlew and gradle.properties.
    gradle-tasks:
      default: "assemble"
      description: Whitespace-separated gradle tasks to run.
    skip-tests:
      type: boolean
      default: false
      description: Append -x test to skip the test task.
    enable-build-sbom:
      type: boolean
      default: true
      description: Generate the cyclonedx-gradle-plugin Build SBOM.
    sbom-tool-version:
      # renovate: datasource=maven depName=org.cyclonedx:cyclonedx-gradle-plugin
      default: "3.2.1"
      description: Pinned cyclonedx-gradle-plugin version.
    java-version:
      default: "25"
      description: JDK major version, reported in the build summary.
    runtime-image:
      default: "ghcr.io/diggsweden/forge-ci-runtime-java-25:v0.90.0"
      description: forge-ci runtime image carrying a JDK + gradle wrapper support (pin by @sha256).
---
"$[[ inputs.job-name ]]":
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.runtime-image ]]
  variables:
    RC_PROJECT_DIRECTORY: "$[[ inputs.working-directory ]]"
    GRADLE_TASKS: "$[[ inputs.gradle-tasks ]]"
    SKIP_TESTS: "$[[ inputs.skip-tests ]]"
    ENABLE_BUILD_SBOM: "$[[ inputs.enable-build-sbom ]]"
    CYCLONEDX_GRADLE_VERSION: "$[[ inputs.sbom-tool-version ]]"
    JAVA_VERSION: "$[[ inputs.java-version ]]"
    CI_SUMMARY_FILE: "$CI_PROJECT_DIR/gradle-build-summary.md"
  script:
    # gradle runs in the current directory, so cd into the project first.
    - cd -- "$RC_PROJECT_DIRECTORY"
    - forge-ci build gradle run
  artifacts:
    paths:
      - $[[ inputs.working-directory ]]/build/libs/
      - $[[ inputs.working-directory ]]/**/build/libs/
      - $[[ inputs.working-directory ]]/build/reports/
