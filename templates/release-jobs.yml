.forge-ci-release-version-node:
  extends: .forge-ci-release-version
  image:
    name: $[[ inputs.runtime-image-node ]]
    entrypoint: [""]
  after_script: [rc_handoff=_release-bump-node, *forge-ci-release-handoff]
