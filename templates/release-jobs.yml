.forge-ci-release-version-rust:
  extends: .forge-ci-release-version
  image:
    name: $[[ inputs.runtime-image-rust ]]
    entrypoint: [""]
  after_script: [rc_handoff=_release-bump-rust, *forge-ci-release-handoff]
  script:
    - rc_bump_version rust
  artifacts:
    expire_in: 1 day
    paths: [_release-bump-rust/]
"Prepare: release commit and tag":
  extends: .forge-ci-release
  # Never a second attempt, whatever default the including configuration sets.
  retry: 0
  stage: prepare
  before_script: [readonly rc_job_role=prepare, *forge-ci-release-start]
  resource_group: release-prepare
  environment:
    name: release/prepare
    action: prepare
  needs:
    - job: "Check: consumer checks"
      artifacts: false
    - job: "Prepare: changelog"
      artifacts: true
    - job: "Prepare: version java"
      artifacts: true
      optional: true
    - job: "Prepare: version node"
      artifacts: true
      optional: true
    - job: "Prepare: version rust"
      artifacts: true
      optional: true
  script:
    - rc_prepare_release
# The plan's build jobs, one per toolchain family it builds, named by
# "Release: plan" from these hidden jobs: the build commands in the family's
# runtime image on the release commit, with FORGE_CI_BUILD_FAMILY and
# FORGE_CI_ARTIFACTS naming what to build. They hand on dist/ and
# image-context/ without a manifest.
.forge-ci-release-build-family:
  extends: .forge-ci-release
  stage: build
  before_script: [readonly rc_job_role=build, *forge-ci-release-start]
  retry: *forge-ci-release-retry
  tags: $[[ inputs.build-runner-tags-linux-amd64 ]]
  variables:
    RC_JOB_USER: ''
  needs:
    - job: "Prepare: release commit and tag"
      artifacts: false
.forge-ci-release-build-java:
  extends: .forge-ci-release-build-family
  image:
    name: $[[ inputs.runtime-image-java ]]
    entrypoint: [""]
  after_script: [rc_handoff=_release-build-java, *forge-ci-release-handoff]
  script:
    - rc_family_checkout java
    - $[[ inputs.build ]]
    - rc_family_handoff java
  artifacts:
    expire_in: 1 day
    paths: [_release-build-java/]
.forge-ci-release-build-node:
  extends: .forge-ci-release-build-family
  image:
    name: $[[ inputs.runtime-image-node ]]
    entrypoint: [""]
  after_script: [rc_handoff=_release-build-node, *forge-ci-release-handoff]
  script:
    - rc_family_checkout node
    - $[[ inputs.build ]]
    - rc_family_handoff node
  artifacts:
    expire_in: 1 day
    paths: [_release-build-node/]
.forge-ci-release-build-go:
  extends: .forge-ci-release-build-family
  image:
    name: $[[ inputs.runtime-image-go ]]
    entrypoint: [""]
  after_script: [rc_handoff=_release-build-go, *forge-ci-release-handoff]
  script:
    - rc_family_checkout go
    - $[[ inputs.build ]]
    - rc_family_handoff go
  artifacts:
    expire_in: 1 day
    paths: [_release-build-go/]
.forge-ci-release-build-rust:
  extends: .forge-ci-release-build-family
  image:
    name: $[[ inputs.runtime-image-rust ]]
    entrypoint: [""]
  after_script: [rc_handoff=_release-build-rust, *forge-ci-release-handoff]
  script:
    - rc_family_checkout rust
    - $[[ inputs.build ]]
    - rc_family_handoff rust
  artifacts:
    expire_in: 1 day
    paths: [_release-build-rust/]
.forge-ci-release-build-android:
  extends: .forge-ci-release-build-family
  image:
    name: $[[ inputs.runtime-image-android ]]
    entrypoint: [""]
  after_script: [rc_handoff=_release-build-android, *forge-ci-release-handoff]
  script:
    - rc_family_checkout android
    - $[[ inputs.build ]]
    - rc_family_handoff android
  artifacts:
    expire_in: 1 day
    paths: [_release-build-android/]
# The release files: every family's and export job's files laid together,
# then the build commands once more, in job-image as job-user with no
# family, to write the release notes and declare the files.
"Build: release files":
  extends: .forge-ci-release
  stage: build
  before_script: [readonly rc_job_role=release-files, *forge-ci-release-start]
  retry: *forge-ci-release-retry
  after_script: [rc_handoff=_release-build, *forge-ci-release-handoff]
  tags: $[[ inputs.build-runner-tags-linux-amd64 ]]
  needs:
    - job: "Prepare: release commit and tag"
      artifacts: false
    - job: "Build: export amd64"
      artifacts: true
      optional: true
    - job: "Build: export arm64"
      artifacts: true
      optional: true
    - job: "Build: java"
      artifacts: true
      optional: true
    - job: "Build: node"
      artifacts: true
      optional: true
    - job: "Build: go"
      artifacts: true
      optional: true
    - job: "Build: rust"
      artifacts: true
      optional: true
    - job: "Build: android"
      artifacts: true
      optional: true
    # With base-stages, the files are built only after every base is promoted.
    - job: "Base: all promoted"
      artifacts: true
      optional: true
  script:
    - rc_release_checkout
    - rc_gather_bases
    - rc_gather_exports '$[[ inputs.export-files ]]'
    - rc_gather_families
    - $[[ inputs.build ]]
    - rc_build_handoff
  artifacts:
    expire_in: 1 day
    paths: [_release-build/]
# The base stage, the policy's base-stages: the jobs of one stage, named by
# "Release: plan" from these hidden jobs with the stage and its parent as
# literals, as it names the family jobs. A root is four jobs and a child
# five. "Base: plan" runs the project's planner and "Base: build" its
# Containerfiles; they hold no release secret. The others run nothing of the
# project's: "Base: parent" and "Base: publish" hold the release's registry
# credential, and "Base: sign and promote" alone the key. A child's plan
# needs the promotion of its parent's stage, so no child is planned or built
# before its parent is promoted and verified against the pinned key.
.forge-ci-release-base-plan:
  extends: .forge-ci-release
  stage: build
  before_script: [readonly rc_job_role=base-plan, *forge-ci-release-start]
  retry: *forge-ci-release-retry
  after_script: [rc_handoff=_release-base-plan, *forge-ci-release-handoff]
  artifacts:
    expire_in: 1 day
    paths: [_release-base-plan/]
.forge-ci-release-base-parent:
  extends: .forge-ci-release-signer
  stage: build
  before_script: [readonly rc_job_role=base-parent, *forge-ci-release-start]
  retry: *forge-ci-release-retry
  after_script: [rc_handoff=_release-base-parent, *forge-ci-release-handoff]
  environment:
    name: release/registry/promote
    action: prepare
  artifacts:
    expire_in: 1 day
    paths: [_release-base-parent/]
# In builder-job-image on the build runner, as the image builds. GitLab
# reads this job only when the plan names a base stage, which needs
# builder-job-image.
.forge-ci-release-base-build:
  extends: .forge-ci-release
  stage: build
  before_script: [readonly rc_job_role=base-build, *forge-ci-release-start]
  retry: *forge-ci-release-retry
  after_script: [rc_handoff=_release-base-build, *forge-ci-release-handoff]
  image:
    name: $[[ inputs.builder-job-image ]]
    entrypoint: [""]
  tags: $[[ inputs.build-runner-tags-linux-amd64 ]]
  variables:
    RC_JOB_USER: ''
  artifacts:
    expire_in: 1 day
    paths: [_release-base-build/]
# In job-image, which carries the scanners, on the signer's runner: the job
# holds the registry credential and no key.
.forge-ci-release-base-publish:
  extends: .forge-ci-release
  # Never a second attempt, whatever default the including configuration sets.
  retry: 0
  stage: build
  before_script: [readonly rc_job_role=base-publish, *forge-ci-release-start]
  after_script: [rc_handoff=_release-base-publish, *forge-ci-release-handoff]
  tags: $[[ inputs.signer-runner-tags ]]
  environment:
    name: release/registry/promote
    action: prepare
  artifacts:
    expire_in: 1 day
    paths: [_release-base-publish/]
.forge-ci-release-base-promote:
  extends: .forge-ci-release-signer
  # Never a second attempt, whatever default the including configuration sets.
  retry: 0
  stage: build
  before_script: [readonly rc_job_role=base-promote, *forge-ci-release-start]
  after_script: [rc_handoff=_release-base-promote, *forge-ci-release-handoff]
  environment:
    name: release/registry/signing
    action: prepare
  artifacts:
    expire_in: 1 day
    paths: [_release-base-promote/]
.forge-ci-release-base-gate:
  extends: .forge-ci-release
  stage: build
  before_script: [readonly rc_job_role=base-gate, *forge-ci-release-start]
  retry: *forge-ci-release-retry
  after_script: [rc_handoff=_release-bases, *forge-ci-release-handoff]
  script:
    - rc_base_gate
  artifacts:
    expire_in: 1 day
    paths: [_release-bases/]
# The export jobs, the image jobs' shape for files: one native job per
# selected architecture in builder-job-image with image-builder, running the
# consumer's export commands on the release commit with no credential of the
# job. Their dist/ is laid into the build job's before its commands run.
.forge-ci-release-exports:
  extends: .forge-ci-release
  stage: build
  retry: *forge-ci-release-retry
  rules:
    - if: '"$[[ inputs.export-files ]]" == "true"'
.forge-ci-release-export-job-true:
  image:
    name: $[[ inputs.builder-job-image ]]
.forge-ci-release-export-job-false:
  image:
    name: $[[ inputs.job-image ]]
.forge-ci-release-export-builder:
  extends: ".forge-ci-release-export-job-$[[ inputs.export-files ]]"
  tags: $[[ inputs.build-runner-tags-linux-amd64 ]]
  image:
    entrypoint: [""]
  variables:
    RC_JOB_USER: ''
.forge-ci-release-export-builder-buildah:
  extends: .forge-ci-release-export-builder
.forge-ci-release-export-builder-kaniko:
  extends: .forge-ci-release-export-builder
"Build: export amd64":
  extends: [.forge-ci-release-exports, ".forge-ci-release-export-builder-$[[ inputs.image-builder ]]"]
  retry: *forge-ci-release-retry
  before_script: [readonly rc_job_role=export, *forge-ci-release-start]
  after_script: [rc_handoff=_release-export-amd64, *forge-ci-release-handoff]
  needs:
    - job: "Prepare: release commit and tag"
      artifacts: false
  script:
    - selected=$(rc_export_selected amd64 '$[[ inputs.release-platforms ]]') || exit; if [ "$selected" = false ]; then exit 0; fi
    - rc_export_prepare amd64 '$[[ inputs.image-builder ]]' '$[[ inputs.builder-job-image ]]'
    - $[[ inputs.export ]]
    - rc_export_handoff amd64
  artifacts:
    expire_in: 1 day
    paths: [_release-export-amd64/]
"Build: export arm64":
  extends: [.forge-ci-release-exports, ".forge-ci-release-export-builder-$[[ inputs.image-builder ]]"]
  retry: *forge-ci-release-retry
  before_script: [readonly rc_job_role=export, *forge-ci-release-start]
  after_script: [rc_handoff=_release-export-arm64, *forge-ci-release-handoff]
  tags: $[[ inputs.build-runner-tags-linux-arm64 ]]
  rules:
    - if: >-
        '$[[ inputs.export-files ]]' == 'true' && '$[[ inputs.build-runner-tags-linux-arm64 ]]' != '[]'
  needs:
    - job: "Prepare: release commit and tag"
      artifacts: false
  script:
    - selected=$(rc_export_selected arm64 '$[[ inputs.release-platforms ]]') || exit; if [ "$selected" = false ]; then exit 0; fi
    - rc_export_prepare arm64 '$[[ inputs.image-builder ]]' '$[[ inputs.builder-job-image ]]'
    - $[[ inputs.export ]]
    - rc_export_handoff arm64
  artifacts:
    expire_in: 1 day
    paths: [_release-export-arm64/]
# The image stage, the Forgejo release-images workflow's jobs: the plan at the
# release commit, one native build per architecture to OCI layouts with no
# registry write, and one publishing job that scans, pushes the staging images to
# this project's registry with the job token, records the ledger and joins it
# to the build's dist. Without release-images none of them exists.
.forge-ci-release-images:
  extends: .forge-ci-release
  stage: images
  rules:
    - if: '"$[[ inputs.release-images ]]" == "true"'
# The builder is a setting, and builder-job-image its job image, as root:
# Buildah, or kaniko, admitted, both on the build runner inputs.
# GitLab refuses a job with an empty image name before it reads the job's
# rules, so without release images, when builder-job-image may be empty and
# the image jobs never run, they name job-image instead.
.forge-ci-release-image-job-true:
  image:
    name: $[[ inputs.builder-job-image ]]
.forge-ci-release-image-job-false:
  image:
    name: $[[ inputs.job-image ]]
.forge-ci-release-image-builder:
  extends: ".forge-ci-release-image-job-$[[ inputs.release-images ]]"
  tags: $[[ inputs.build-runner-tags-linux-amd64 ]]
  image:
    entrypoint: [""]
  variables:
    RC_JOB_USER: ''
.forge-ci-release-image-builder-buildah:
  extends: .forge-ci-release-image-builder
.forge-ci-release-image-builder-kaniko:
  extends: .forge-ci-release-image-builder
"Images: plan":
  extends: .forge-ci-release-images
  before_script: [readonly rc_job_role=images-plan, *forge-ci-release-start]
  retry: *forge-ci-release-retry
  after_script: [rc_handoff=_release-images-plan, *forge-ci-release-handoff]
  needs:
    - job: "Prepare: release commit and tag"
      artifacts: false
  script:
    - rc_images_plan '$[[ inputs.artifacts-config ]]' '$[[ inputs.release-platforms ]]'
  artifacts:
    expire_in: 1 day
    paths: [_release-images-plan/]
"Images: build amd64":
  extends: [.forge-ci-release-images, ".forge-ci-release-image-builder-$[[ inputs.image-builder ]]"]
  before_script: [readonly rc_job_role=image-build, *forge-ci-release-start]
  retry: *forge-ci-release-retry
  after_script: [rc_handoff=_release-images-amd64, *forge-ci-release-handoff]
  needs:
    - job: "Images: plan"
      artifacts: true
    - job: "Build: release files"
      artifacts: true
  script:
    - rc_images_build amd64 '$[[ inputs.image-builder ]]' '$[[ inputs.builder-job-image ]]'
  artifacts:
    expire_in: 1 day
    paths: [_release-images-amd64/]
"Images: build arm64":
  extends: [.forge-ci-release-images, ".forge-ci-release-image-builder-$[[ inputs.image-builder ]]"]
  before_script: [readonly rc_job_role=image-build, *forge-ci-release-start]
  retry: *forge-ci-release-retry
  after_script: [rc_handoff=_release-images-arm64, *forge-ci-release-handoff]
  tags: $[[ inputs.build-runner-tags-linux-arm64 ]]
  rules:
    - if: >-
        '$[[ inputs.release-images ]]' == 'true' && '$[[ inputs.build-runner-tags-linux-arm64 ]]' != '[]'
  needs:
    - job: "Images: plan"
      artifacts: true
    - job: "Build: release files"
      artifacts: true
  script:
    - rc_images_build arm64 '$[[ inputs.image-builder ]]' '$[[ inputs.builder-job-image ]]'
  artifacts:
    expire_in: 1 day
    paths: [_release-images-arm64/]
"Images: publish":
  extends: .forge-ci-release-images
  # Never a second attempt, whatever default the including configuration sets.
  retry: 0
  before_script: [readonly rc_job_role=images-publish, *forge-ci-release-start]
  after_script: [rc_handoff=_release-images, *forge-ci-release-handoff]
  needs:
    - job: "Images: plan"
      artifacts: true
    - job: "Build: release files"
      artifacts: true
    - job: "Images: build amd64"
      artifacts: true
    - job: "Images: build arm64"
      artifacts: true
      optional: true
  script:
    - rc_images_publish
  artifacts:
    expire_in: 1 day
    paths: [_release-images/]
# Signing reads one hand-off, chosen by the policy: the build's, or with
# release images the publishing job's, which carries the build's dist with the
# ledger joined to it and is digested again.
.forge-ci-release-sign-false:
  needs:
    - job: "Build: release files"
      artifacts: true
.forge-ci-release-sign-true:
  needs:
    - job: "Images: publish"
      artifacts: true
"Sign: files and images":
  extends: [.forge-ci-release-signer, ".forge-ci-release-sign-$[[ inputs.release-images ]]"]
  # Never a second attempt, whatever default the including configuration sets.
  retry: 0
  stage: sign
  before_script: [readonly rc_job_role=sign, *forge-ci-release-start]
  after_script: [rc_handoff=_release-sign, *forge-ci-release-handoff]
  environment:
    name: release/registry/signing
    action: prepare
  script:
    - rc_sign_release '$[[ inputs.release-images ]]'
  artifacts:
    expire_in: 1 day
    paths: [_release-sign/]
"Publish: images":
  extends: .forge-ci-release-signer
  # Never a second attempt, whatever default the including configuration sets.
  retry: 0
  stage: publish
  before_script: [readonly rc_job_role=promote, *forge-ci-release-start]
  after_script: [rc_handoff=_release-promote, *forge-ci-release-handoff]
  environment:
    name: release/registry/promote
    action: prepare
  needs:
    - job: "Sign: files and images"
      artifacts: true
  script:
    - rc_promote_release
  artifacts:
    when: always
    expire_in: 7 days
    paths: [_release-promote/]
"Publish: release":
  extends: .forge-ci-release-signer
  # Never a second attempt, whatever default the including configuration sets.
  retry: 0
  stage: publish
  before_script: [readonly rc_job_role=publish, *forge-ci-release-start]
  environment:
    name: release/publish
    action: prepare
  needs:
    - job: "Sign: files and images"
      artifacts: true
    - job: "Publish: images"
      artifacts: false
  script:
    - rc_publish_release
"Publish: tidy up":
  extends: .forge-ci-release-signer
  # Never a second attempt, whatever default the including configuration sets.
  retry: 0
  stage: publish
  before_script: [readonly rc_job_role=cleanup, *forge-ci-release-start]
  environment:
    name: release/registry/cleanup
    action: prepare
  needs:
    - job: "Sign: files and images"
      artifacts: true
    - job: "Publish: release"
      artifacts: false
  script:
    - rc_cleanup_release
# The plan's package job, named by "Release: plan" when an npm project lists
# forge-packages under publish-to: the packed packages of the signed release
# go to this project's package registry once the release is published. The
# job runs no consumer command, on the signer's runner, and holds one
# credential, RELEASE_PACKAGE_TOKEN of the release/packages environment: the
# job token writes no package, since every job that runs the project's code
# holds one. npm runs in the node family's image with lifecycle scripts off,
# on the bytes the signer handed on.
.forge-ci-release-publish-npm-packages:
  extends: .forge-ci-release
  stage: publish
  before_script: [readonly rc_job_role=packages, *forge-ci-release-start]
  # Never a second attempt, whatever default the including configuration sets.
  retry: 0
  image:
    name: $[[ inputs.runtime-image-node ]]
    entrypoint: [""]
  tags: $[[ inputs.signer-runner-tags ]]
  variables:
    RC_JOB_USER: ''
  environment:
    name: release/packages
    action: prepare
  needs:
    - job: "Sign: files and images"
      artifacts: true
    - job: "Publish: release"
      artifacts: false
  script:
    - rc_publish_packages
# The release overview, as a "Summary" section of this job's log. It needs the
# last job of the chain, so it runs only after a successful release; GitLab's
# pipeline view shows which job failed in an unsuccessful one. It plans the
# request again to list the family jobs that ran, and downloads nothing. It
# holds no release secret.
"Summary: release":
  extends: .forge-ci-release
  stage: .post
  before_script: [readonly rc_job_role=summary, *forge-ci-release-start]
  retry: *forge-ci-release-retry
  needs:
    - job: "Publish: tidy up"
      artifacts: false
    - job: "Publish: npm packages"
      artifacts: false
      optional: true
  script:
    - rc_release_summary '$[[ inputs.release-images ]]' '$[[ inputs.build-runner-tags-linux-arm64 ]]'
