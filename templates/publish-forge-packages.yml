#
# GitLab CI/CD Catalog component: publish to the forge-native package registry.
# On GitLab that is the project's GitLab Package Registry; the GitHub counterpart
# (.github/workflows/publish-maven-github.yml) publishes the same forge-packages
# target to GitHub Packages. The config target is forge-neutral (publish_to:
# forge-packages) and resolves to whichever forge the pipeline runs on.
#
# This component supports Maven and npm through --project-type. Gradle-specific
# publishing is not wired here.
#
# The deploy is binary-owned: `forge-ci publish forge-packages deploy`
# auto-detects GitLab, resolves the registry URL + Job-Token auth from the
# CI_* env, writes a 0600 settings.xml (token never on argv), and runs mvn
# deploy. The same command publishes to GitHub Packages / Forgejo on those
# forges — one sequence, no per-forge inline mvn.
#
# ARTIFACT CONTRACT: the built JARs must already be under */target/ in the
# working directory — provide them via GitLab native artifact passing
# (`needs:`/`dependencies:` on the build-maven job). The GitLab provider has no
# run-artifact API, so `forge-ci artifact download` is not used here.
#
# Consume (pin a released version):
#   include:
#     - component: $CI_SERVER_FQDN/diggsweden/forge-ci/publish-forge-packages@0.90.0
#       inputs:
#         runtime-image: ghcr.io/diggsweden/forge-ci-runtime-java-25@sha256:PIN_DIGEST
spec:
  inputs:
    stage:
      default: publish
      description: Pipeline stage the publish runs in.
    job-name:
      default: publish-forge-packages
      description: Name of the generated job.
    version:
      default: ""
      description: Release version (reported in the summary).
    project-type:
      default: maven
      options: ["maven", "npm", "gradle", "gradle-android"]
      description: Maven project, packed npm package, or exported Gradle Maven publication. Set runtime-image to match.
    working-directory:
      default: "."
      description: Directory containing the pom.xml (maven) or the packed *.tgz (npm).
    npm-tag:
      default: ""
      description: "Required for npm: release-{version} or release-<packed-version>; movable tags are forbidden."
    snapshot:
      type: boolean
      default: false
      description: Publish only Maven-format snapshots; not applicable to npm.
    cli-opts:
      default: "--batch-mode --no-transfer-progress --errors --fail-at-end -Dstyle.color=always"
      description: Extra args forwarded to mvn (maven only).
    runtime-image:
      description: forge-ci runtime image — JDK+Maven for maven, Node for npm, pinned by @sha256.
      regex: '^[^[:space:]]+@sha256:[0-9a-f]{64}$'
    runner-tags:
      type: array
      default: []
      description: Runner tags of the job, all of which one runner must carry; empty, the default, leaves it untagged. Name literal tags only, never a $VARIABLE, which a project variable could set.
---
"$[[ inputs.job-name ]]":
  # A publisher is never run a second time, whatever default the including
  # configuration sets.
  retry: 0
  stage: $[[ inputs.stage ]]
  tags: $[[ inputs.runner-tags ]]
  image: $[[ inputs.runtime-image ]]
  variables:
    RC_PROJECT_DIRECTORY: "$[[ inputs.working-directory ]]"
    MAVEN_CLI_OPTS: "$[[ inputs.cli-opts ]]"
    PACKAGE_TYPE: "$[[ inputs.project-type ]]"
    VERSION: "$[[ inputs.version ]]"
    NPM_TAG: "$[[ inputs.npm-tag ]]"
    MAVEN_SNAPSHOT: "$[[ inputs.snapshot ]]"
    CI_SUMMARY_FILE: "$CI_PROJECT_DIR/forge-packages-publish-summary.md"
  script:
    - |
      set -eu
      CI_OUTPUT=$(mktemp "${TMPDIR:-/tmp}/forge-ci-output.XXXXXXXX")
      export CI_OUTPUT
      trap 'rm -f -- "$CI_OUTPUT"' EXIT
    # Defense-in-depth: refuse MR-context triggers — CI_JOB_TOKEN is in scope.
    - forge-ci validate event-context
    - if [ "$PACKAGE_TYPE" = "npm" ]; then forge-ci publish npm validate-tag; fi
    - cd -- "$RC_PROJECT_DIRECTORY"
    # Maven metadata feeds the summary version; npm has no pom, so skip it there.
    - if [ "$PACKAGE_TYPE" = "maven" ]; then forge-ci build maven metadata; fi
    # Binary-owned: resolves the GitLab registry + credentialed settings.xml/.npmrc + deploy.
    - forge-ci publish forge-packages deploy --project-type "$PACKAGE_TYPE"
    # Read only metadata fields needed by the summary; values are never shell.
    - |
      while IFS= read -r line || [ -n "$line" ]; do
        case "$line" in
          VERSION=*) export VERSION="${line#VERSION=}" ;;
          IS_SNAPSHOT=*) export IS_SNAPSHOT="${line#IS_SNAPSHOT=}" ;;
        esac
      done < "$CI_OUTPUT"
    - forge-ci report publish forge-packages --package-type "$PACKAGE_TYPE"
