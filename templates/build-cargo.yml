#
# GitLab CI/CD Catalog component: artifact-first Cargo (Rust) release build.
#
# The GitLab counterpart of .github/workflows/build-cargo.yml. The whole sequence
# (metadata → fetch → test → SBOM → compile → status) lives in the binary as
# `forge-ci build cargo run`, so this job is a single line — the same sequence
# GitHub runs. GitLab clones the repo for the job; the runtime-rust image carries
# cargo + cargo-cyclonedx + forge-ci. Binaries land in dist/ and the Build
# SBOM as bom.json, which the job publishes as artifacts.
#
# Consume (pin a released version):
#   include:
#     - component: $CI_SERVER_FQDN/diggsweden/forge-ci/build-cargo@0.90.0
#       inputs:
#         runtime-image: ghcr.io/diggsweden/forge-ci-runtime-rust-stable@sha256:PIN_DIGEST
#         version: "$CI_COMMIT_TAG"
spec:
  inputs:
    stage:
      default: build
      description: Pipeline stage the build runs in.
    job-name:
      default: build-cargo
      description: Name of the generated job.
    working-directory:
      default: "."
      description: Directory containing Cargo.toml.
    artifact-name:
      default: ""
      description: Artifact-name override (also names the SBOM).
    platforms:
      default: "linux/amd64,linux/arm64"
      description: Comma-separated GOOS/GOARCH targets (mapped to Rust triples).
    version:
      default: ""
      description: Release version baked into the binary; defaults to the ref name.
    skip-tests:
      type: boolean
      default: false
      description: Legacy input; true is refused. Admin policy controls findings, and tests still run.
    enforce-application-tests:
      type: boolean
      default: false
      description: Enforcement setting; false lets recognized test assertion failures be reported without failing the build. Tests still run. Set it only in the administrator's entry point, since whoever writes this call can pass it; it is the administrator's only where that file is. See docs/admin-policy.md.
    enable-build-sbom:
      type: boolean
      default: true
      description: Generate the cargo-cyclonedx Build SBOM.
    runtime-image:
      description: forge-ci runtime image carrying cargo + cargo-cyclonedx, pinned by @sha256.
      regex: '^[^[:space:]]+@sha256:[0-9a-f]{64}$'
    runner-tags:
      type: array
      default: []
      description: Runner tags of the job, all of which one runner must carry; empty, the default, leaves it untagged. Name literal tags only, never a $VARIABLE, which a project variable could set.
---
"$[[ inputs.job-name ]]":
  # One more attempt when the engine found a dependency unavailable, exit
  # 69, and for no other failure.
  retry:
    max: 1
    exit_codes: 69
  stage: $[[ inputs.stage ]]
  tags: $[[ inputs.runner-tags ]]
  rules:
    - when: on_success
  needs: []
  cache: []
  image: $[[ inputs.runtime-image ]]
  variables:
    GIT_STRATEGY: fetch
    GIT_CHECKOUT: "true"
    WORKING_DIRECTORY: "$[[ inputs.working-directory ]]"
    ARTIFACT_NAME: "$[[ inputs.artifact-name ]]"
    PLATFORMS: "$[[ inputs.platforms ]]"
    VERSION: "$[[ inputs.version ]]"
    SKIP_TESTS: "$[[ inputs.skip-tests ]]"
    ENABLE_BUILD_SBOM: "$[[ inputs.enable-build-sbom ]]"
    REF_NAME: "$CI_COMMIT_REF_NAME"
    CI_SUMMARY_FILE: "$CI_PROJECT_DIR/cargo-build-summary.md"
  # Explicit gate fields replace earlier same-named values. Other keys still
  # merge; policy injection, not include ordering, is the authority boundary.
  allow_failure: false
  before_script: []
  after_script: []
  script:
    # The administrator's setting as written, a flag of the engine: no
    # project variable can supply or change it.
    - forge-ci build cargo run --enforce-application-tests='$[[ inputs.enforce-application-tests ]]'
  artifacts:
    paths:
      # Shown in the job log too; GitLab renders no summary file.
      - cargo-build-summary.md
      - $[[ inputs.working-directory ]]/dist/
      - $[[ inputs.working-directory ]]/bom.json
