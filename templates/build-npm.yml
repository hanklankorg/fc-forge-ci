#
# GitLab CI/CD Catalog component: npm release build.
#
# The GitLab counterpart of .github/workflows/build-npm.yml. The whole sequence
# (metadata → ci → test → build → SBOM → pack → summary) lives in the binary as
# `forge-ci build npm run`, so this job is a single line — the same sequence
# GitHub runs. GitLab clones the repo for the job; the runtime-node image carries
# Node + npm + forge-ci. The packed tarball and bom.json are published as
# artifacts.
#
# Consume (pin a released version):
#   include:
#     - component: $CI_SERVER_FQDN/diggsweden/forge-ci/build-npm@0.90.0
#       inputs:
#         runtime-image: ghcr.io/diggsweden/forge-ci-runtime-node-24@sha256:PIN_DIGEST
spec:
  inputs:
    stage:
      default: build
      description: Pipeline stage the build runs in.
    job-name:
      default: build-npm
      description: Name of the generated job.
    working-directory:
      default: "."
      description: Directory containing package.json.
    scope:
      default: ""
      description: Expected package scope (e.g. @examplescope); errors when package.json disagrees.
    private-dependencies:
      type: boolean
      default: false
      description: "Use the caller's read-scoped DEPENDENCY_TOKEN during npm ci only."
    dependency-registry:
      default: ""
      description: HTTPS registry to authenticate; project configuration retains registry/scope routing.
    skip-tests:
      type: boolean
      default: false
      description: Legacy input; true is refused. Admin policy controls findings, and tests still run.
    enforce-application-tests:
      type: boolean
      default: false
      description: Enforcement setting; false lets recognized test assertion failures be reported without failing the build. Tests still run. Set it only in the administrator's entry point, since whoever writes this call can pass it; it is the administrator's only where that file is. See docs/admin-policy.md.
    enable-build-sbom:
      type: boolean
      default: true
      description: Generate the CycloneDX Build SBOM with cyclonedx-npm.
    sbom-tool-version:
      # renovate: datasource=npm depName=@cyclonedx/cyclonedx-npm
      default: "6.0.1"
      description: Pinned @cyclonedx/cyclonedx-npm version run via npx.
    node-version:
      default: "24"
      description: Node major version, reported in the build summary.
    runtime-image:
      description: forge-ci runtime image carrying Node + npm, pinned by @sha256.
      regex: '^[^[:space:]]+@sha256:[0-9a-f]{64}$'
    runner-tags:
      type: array
      default: []
      description: Runner tags of the job, all of which one runner must carry; empty, the default, leaves it untagged. Name literal tags only, never a $VARIABLE, which a project variable could set.
---
"$[[ inputs.job-name ]]":
  # One more attempt when the engine found a dependency unavailable, exit
  # 69, and for no other failure.
  retry:
    max: 1
    exit_codes: 69
  stage: $[[ inputs.stage ]]
  tags: $[[ inputs.runner-tags ]]
  rules:
    - when: on_success
  needs: []
  cache: []
  image: $[[ inputs.runtime-image ]]
  variables:
    GIT_STRATEGY: fetch
    GIT_CHECKOUT: "true"
    WORKING_DIRECTORY: "$[[ inputs.working-directory ]]"
    SCOPE: "$[[ inputs.scope ]]"
    PRIVATE_DEPENDENCIES: "$[[ inputs.private-dependencies ]]"
    DEPENDENCY_REGISTRY: "$[[ inputs.dependency-registry ]]"
    SKIP_TESTS: "$[[ inputs.skip-tests ]]"
    ENABLE_BUILD_SBOM: "$[[ inputs.enable-build-sbom ]]"
    CYCLONEDX_VERSION: "$[[ inputs.sbom-tool-version ]]"
    NODE_VERSION: "$[[ inputs.node-version ]]"
    CI_SUMMARY_FILE: "$CI_PROJECT_DIR/npm-build-summary.md"
  # Explicit gate fields replace earlier same-named values. Other keys still
  # merge; policy injection, not include ordering, is the authority boundary.
  allow_failure: false
  before_script: []
  after_script: []
  script:
    # The administrator's setting as written, a flag of the engine: no
    # project variable can supply or change it.
    - forge-ci build npm run --enforce-application-tests='$[[ inputs.enforce-application-tests ]]'
  artifacts:
    paths:
      # Shown in the job log too; GitLab renders no summary file.
      - npm-build-summary.md
      - $[[ inputs.working-directory ]]/*.tgz
      - $[[ inputs.working-directory ]]/bom.json
