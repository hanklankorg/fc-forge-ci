# One npm package, published to the forge's package registry, and the
# runtime image built from it, signed keyless.
sign:
  method: sigstore
artifacts:
  - name: hello-npm-service
    project-type: npm
    working-directory: .
    publish-to: [forge-packages]
    config:
      node-version: 24
      npm-tag: release-{version}
containers:
  - name: hello-npm-service
    from: [hello-npm-service]
    container-file: Containerfile
    context: .
    # Declared platforms; RELEASE_PLATFORMS narrows them, linux/amd64 by default.
    platforms: linux/amd64,linux/arm64
