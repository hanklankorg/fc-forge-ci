#
# Example: a Go service's merge-request gate and build on GitLab CI/CD, from
# the components under templates/
# (https://$CI_SERVER_FQDN/itiquette/forge-ci/-/blob/2f4e845cee96973d1082bf00a5a18689c1482148/docs/gitlab.md).
# Copy to the project's
# .gitlab-ci.yml and replace the placeholders, all literal so that
# `git grep` finds them:
#
#   gitlab.example.com                        your instance
#   itiquette/forge-ci (forge-ci-repository)    the project on it that serves
#                                             forge-ci, including subgroups
#   2f4e845cee96973d1082bf00a5a18689c1482148                          the engine commit you authenticated:
#                                             `check` is checksum-bound and must be
#                                             included by full commit SHA
#   PIN_DIGEST, PIN_IMAGE_DIGEST              digests of the reviewed images
#   PIN_GO_IMAGE_DIGEST                       digest of the reviewed Forge CI runtime
#                                             image, or of your mirror
#
# The pipeline status is the gate: GitLab fails the pipeline, and the merge
# request, when any job fails. Require successful pipelines and refuse merging
# on skipped ones in the project settings.
#
# No component builds the container image. In a release, the image is built
# by the `build` commands of the separate, pinned policy project that
# includes the `release` component; they write the image ledger the release
# imports, signs and promotes. See
# https://$CI_SERVER_FQDN/itiquette/forge-ci/-/blob/2f4e845cee96973d1082bf00a5a18689c1482148/docs/gitlab.md#native-release-policy.
#
# Once the release policy is the project's CI configuration path, GitLab runs
# it instead of this file, so the policy includes this gate for merge
# requests; see
# https://$CI_SERVER_FQDN/itiquette/forge-ci/-/blob/2f4e845cee96973d1082bf00a5a18689c1482148/docs/gitlab.md#the-merge-request-gate-under-a-policy.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - test
  - build

include:
  # The lint gate: the project's nanolinter.toml plan in the go flavour, with
  # the secrets floor, and its findings as a SAST report.
  - component: $CI_SERVER_FQDN/itiquette/forge-ci/nanolinter@0.90.0
    inputs:
      forge-ci-repository: itiquette/forge-ci
      server-url: $CI_SERVER_URL
      nanolinter-image: $CI_LINT_IMAGE

  # The consumer's own checks at the pipeline commit, in an image that carries
  # Bash, Git, curl, sha256sum and Go.
  # check is checksum-bound: include it by the engine commit, never a version;
  # see Checksum-bound engine bootstrap in
  # https://$CI_SERVER_FQDN/itiquette/forge-ci/-/blob/2f4e845cee96973d1082bf00a5a18689c1482148/docs/gitlab.md.
  - component: $CI_SERVER_FQDN/itiquette/forge-ci/check@2f4e845cee96973d1082bf00a5a18689c1482148
    inputs:
      forge-ci-repository: itiquette/forge-ci
      server-url: $CI_SERVER_URL
      job-image: $CI_JOB_IMAGE
      commands:
        - go vet ./...
        - go test ./...

  # The service binaries for both image platforms, with the Build SBOM, kept
  # as job artifacts.
  - component: $CI_SERVER_FQDN/itiquette/forge-ci/build-go@0.90.0
    inputs:
      runtime-image: $CI_JOB_IMAGE
      artifact-name: my-service
      main-package: ./cmd/my-service # FIXME: the service's main Go package.
      platforms: "linux/amd64,linux/arm64"
