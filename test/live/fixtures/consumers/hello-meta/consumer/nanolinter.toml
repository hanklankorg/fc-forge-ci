# nanolinter verify plan of a project with no toolchain: the forge-ci lint
# gate runs `nanolinter verify` against it, with `secrets` as the floor
# whatever this file says. `nanolinter explain --all` lists more checks.
[detect]
auto = true

[verify]
checks = ["secrets", "sast", "typos", "yaml", "markdown"]

[policy]
block = ["secrets", "typos", "yaml", "markdown"]
