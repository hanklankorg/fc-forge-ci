# The same Go CLI with its release files signed with GPG on GitLab:
# `method: gpg`. The GitLab release signs the checksums and the SBOMs with
# RELEASE_GPG_PRIVATE_KEY, pinned to RELEASE_GPG_FINGERPRINT, and the
# provenance and the evidence with its Cosign key. The trial stages this
# file over .forge-ci/artifacts.yml.
artifacts:
  - name: my-cli
    project-type: go
    working-directory: .
    config:
      build-mode: artifact-first
      main-package: ./cmd/my-cli
      binary-name: my-cli
      platforms: linux/amd64,linux/arm64,darwin/amd64,darwin/arm64
      skip-tests: false

sign:
  method: gpg

git-signing:
  method: ssh
