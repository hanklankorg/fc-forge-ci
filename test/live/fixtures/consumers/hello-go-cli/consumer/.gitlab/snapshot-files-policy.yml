#
# Example: snapshot files of a Go CLI on GitLab CI/CD. The snapshot-images
# component builds the declared CLI of one branch and keeps the binaries with
# their receipt, snapshot-files.json, as the unsigned artifacts of the job
# `Snapshot: files <artifact>`, for readers of the pipeline, for 7 days
# (https://$CI_SERVER_FQDN/itiquette/forge-ci/-/blob/2f4e845cee96973d1082bf00a5a18689c1482148/docs/workflows.md#snapshot-files).
#
# This file is not the project's .gitlab-ci.yml. It belongs in the pinned
# policy project an administrator owns, as the release does: the component
# checks out the branch it is told, so whoever writes this include decides
# what is built. It reads the project's .forge-ci/artifacts.yml, publishes no
# image and needs no registry credential or protected variable. Replace the
# placeholders as in .gitlab-ci.yml; `registry` is the instance's container
# registry, or empty when it has none.
#
# The branch is named here, never taken from the pipeline's ref. The rule
# below runs the snapshot for a pipeline requested on the default branch
# through the web UI or the API; write the rule your policy wants.
include:
  - component: $CI_SERVER_FQDN/itiquette/forge-ci/snapshot-images@2f4e845cee96973d1082bf00a5a18689c1482148
    inputs:
      branch: development # FIXME: the branch to snapshot.
      publish-files: true
      forge-ci-repository: itiquette/forge-ci
      server-url: $CI_SERVER_URL
      registry: registry.gitlab.example
      job-image: $CI_JOB_IMAGE
      build-image: $CI_JOB_IMAGE
      artifact-job-image-go: $CI_JOB_IMAGE
      build-runner-tags-linux-amd64: []
      build-runner-tags-linux-arm64: []
    rules:
      - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
