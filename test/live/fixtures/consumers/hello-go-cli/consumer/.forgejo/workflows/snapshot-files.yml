# Snapshot files: builds the declared CLI of a branch and keeps the binaries
# with their receipt as an unsigned run artifact, for readers of the run, for
# 7 days. Copy beside pullrequest.yml and release.yml and replace the
# placeholders with the same authenticated, published layer pin. It reads the
# release's .forge-ci/artifacts.yml and needs no registry and no secret.
# It runs when dispatched on the branch to snapshot; to snapshot every branch
# as it is pushed, add under `on:` a `push:` with `branches-ignore: [main]`.
name: Snapshot files
on:
  workflow_dispatch:
concurrency:
  group: snapshot-files-${{ forgejo.repository }}-${{ forgejo.ref }}
  cancel-in-progress: true
jobs:
  snapshot:
    uses: itiquette/forge-ci/.forgejo/workflows/snapshot-images.yml@2f4e845cee96973d1082bf00a5a18689c1482148
    with:
      branch: ${{ forgejo.ref_name }}
      publish-files: true
      forge-ci-repository: itiquette/forge-ci
      forge-ci-sha: 2f4e845cee96973d1082bf00a5a18689c1482148
      runs-on: ${{ vars.CI_RUNNER_LABEL }}
      artifact-job-image-go: ${{ vars.CI_JOB_IMAGE }}
