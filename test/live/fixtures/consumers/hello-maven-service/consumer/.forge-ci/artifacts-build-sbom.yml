# The declaration of artifacts.yml with one policy changed: the application
# keeps its Build SBOM and requests no other, so the runtime image built from
# it gets no SBOM of its own. No workflow of this consumer names this file; a
# snapshot trial selects it (snapshot-declaration=).
sign:
  method: sigstore
artifacts:
  - name: hello-maven-service
    project-type: maven
    working-directory: .
    build-type: application
    sboms: build
    config:
      java-version: 25
containers:
  - name: hello-maven-service
    from: [hello-maven-service]
    container-file: Containerfile
    context: .
    # Declared platforms; RELEASE_PLATFORMS narrows them, linux/amd64 by default.
    platforms: linux/amd64,linux/arm64
