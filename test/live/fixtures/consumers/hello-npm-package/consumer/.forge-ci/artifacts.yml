# The root package of an npm workspace, declared once: it is packed with the
# workspace member it bundles. The release bumps the root manifest and its
# lockfile; the member keeps the version it declares.
sign:
  method: sigstore
artifacts:
  - name: hello-npm-package
    project-type: npm
    working-directory: .
    publish-to: [forge-packages]
    config:
      node-version: 24
      npm-tag: release-{version}
