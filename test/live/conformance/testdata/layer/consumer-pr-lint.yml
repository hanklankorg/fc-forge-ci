# Live-tier fixture of TestForgejoLayer_ConsumerPullRequest's lint cases. A
# template: the test renders it into a scratch repository on the lab, beside a
# small Go module and a nanolinter.toml of one check, and opens a pull request
# there. The pull request is the trigger.
name: Forgejo layer consumer pull request lint

on:
  pull_request:
    branches: [main]

# permissions: is a GitHub field Forgejo ignores (warning per run) --
# kept for Scorecard Token-Permissions and GitHub portability. Real
# restriction is Forgejo's repo-scoped read-default token.
permissions:
  contents: read

env:
  ACCEPTANCE_SERVER_URL: RENDER_ACCEPTANCE_SERVER_URL
  ACCEPTANCE_REPOSITORY: RENDER_ACCEPTANCE_REPOSITORY
  ACCEPTANCE_BASE_REF: main
  ACCEPTANCE_HEAD_REF: layer-pull-request
  # Trust the checked-out tree whoever owns the job container's workspace
  # mount: a nanolinter image runs as its own user.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: '*'

jobs:
  # The layer's lint gate as a pull-request job has it. The test names the
  # image: a nanolinter image for the finding, and for the control an image
  # without nanolinter, where the gate cannot run at all. The call passes no
  # enforce-* setting; the administrator's renderer adds them.
  # One check, the Go toolchain's own, required and offline: the verdict needs
  # no scanner database and no network beyond the forge.
  # The job is first in this file and first by name, so the run's job list has
  # one order whichever of the two the provider reports.
  consumer-lint:
    name: Lint consumer pull request
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABEL) }}
    container:
      image: RENDER_LINT_JOB_IMAGE
    timeout-minutes: 10
    env:
      # The image's Go is the toolchain; a pull request downloads no other.
      GOTOOLCHAIN: local
    steps:
      - name: Checkout pull request
        uses: https://FORGE_HOST/OWNER/forge-ci/.forgejo/actions/checkout-consumer@PIN_FORGE_CI_SHA

      - name: Lint with the layer's gate
        uses: https://FORGE_HOST/OWNER/forge-ci/.forgejo/actions/lint-nanolinter@PIN_FORGE_CI_SHA
        with:
          required-lints: go-vet
          offline: 'true'

  consumer-test:
    name: Test consumer pull request
    # A report-only finding must reach this consumer; an enforced finding and
    # a gate that cannot run must leave it skipped.
    needs: [consumer-lint]
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABEL) }}
    timeout-minutes: 10
    steps:
      - name: Set up forge-ci
        uses: https://FORGE_HOST/OWNER/forge-ci/.forgejo/actions/setup-forge-ci@PIN_FORGE_CI_SHA
        with:
          expected-sha256: RENDER_FORGE_CI_SHA256

      - name: Checkout pull request
        run: |
          set -euo pipefail
          forge-ci platform checkout --depth 1

      - name: Verify pull request identity and canary
        env:
          OBSERVED_SERVER_URL: ${{ forgejo.server_url }}
          OBSERVED_REPOSITORY: ${{ forgejo.repository }}
          OBSERVED_EVENT: ${{ forgejo.event_name }}
          OBSERVED_BASE_REF: ${{ forgejo.event.pull_request.base.ref }}
          OBSERVED_HEAD_REF: ${{ forgejo.event.pull_request.head.ref }}
          OBSERVED_HEAD_SHA: ${{ forgejo.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          observed_server_url=${OBSERVED_SERVER_URL%/}
          checkout_sha=$(git rev-parse HEAD)
          if [ "${observed_server_url}" != "${ACCEPTANCE_SERVER_URL}" ] ||
            [ "${OBSERVED_REPOSITORY}" != "${ACCEPTANCE_REPOSITORY}" ] ||
            [ "${OBSERVED_EVENT}" != pull_request ] ||
            [ "${OBSERVED_BASE_REF}" != "${ACCEPTANCE_BASE_REF}" ] ||
            [ "${OBSERVED_HEAD_REF}" != "${ACCEPTANCE_HEAD_REF}" ] ||
            [ "${checkout_sha}" != "${OBSERVED_HEAD_SHA}" ]; then
            printf 'ERROR: consumer PR acceptance identity mismatch\n' >&2
            exit 1
          fi
          test "$(cat consumer-pr-canary.txt)" = consumer-pr-feature
