# Offline fixture of the consumer planning tests in consumer_internal_test.go
# and consumerdraft_internal_test.go. It stands for the release workflow of an
# organization's Go CLI that has adopted the layer, and holds each way such a
# workflow hands the organization's facts to the layer:
#
#   - the layer's repository and commit, written out as literals;
#   - the signer image and the digest of the Cosign public key, as literals;
#   - the public key and the release Git route, from repository variables;
#   - the layer's secrets, two of them from secrets of another name.
#
# The signing logic lives in examplescope/forge-ci, the organization's copy of
# the layer, and not in this repository. Nothing runs this file.
name: Release

on:
  push:
    tags:
      - release-request/v[0-9]*.[0-9]*.[0-9]*

jobs:
  # The organization's own gate: the token that publishes packages is checked
  # before the layer prepares anything.
  preflight:
    name: Preflight
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABEL) }}
    timeout-minutes: 5
    steps:
      - name: Verify the package token
        uses: https://forge.example/examplescope/forge-ci/.forgejo/actions/verify-forgejo-token@b369db7d70af68fa93a4b404841c4ce2ddbf90c0
        with:
          token: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}

  prepare:
    name: Prepare
    needs: preflight
    if: success() && startsWith(forgejo.ref, 'refs/tags/')
    uses: examplescope/forge-ci/.forgejo/workflows/prepare-release.yml@b369db7d70af68fa93a4b404841c4ce2ddbf90c0
    with:
      runs-on: ${{ vars.CI_RUNNER_LABEL }}
      forge-ci-repository: examplescope/forge-ci
      forge-ci-sha: b369db7d70af68fa93a4b404841c4ce2ddbf90c0
      bot-name: Hello CLI Release Bot
      bot-email: hello-release-bot@lab.invalid
      release-git-url: ${{ vars.RELEASE_GIT_URL }}
      release-git-host-key-fingerprint: ${{ vars.RELEASE_GIT_HOST_KEY_FINGERPRINT }}
    secrets:
      RELEASE_SSH_SIGNING_KEY: ${{ secrets.RELEASE_SSH_SIGNING_KEY }}
      RELEASE_COSIGN_PRIVATE_KEY: ${{ secrets.RELEASE_COSIGN_PRIVATE_KEY }}
      RELEASE_COSIGN_PASSPHRASE: ${{ secrets.RELEASE_COSIGN_PASSPHRASE }}
      RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
      RELEASE_GPG_FINGERPRINT: ${{ secrets.RELEASE_GPG_FINGERPRINT }}
      RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
      # The organization keeps these two under names of its own.
      RELEASE_TOKEN: ${{ secrets.RELEASE_API_TOKEN }}
      RELEASE_REGISTRY_TOKEN: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}

  # The consumer's own job: the binary, one image, and the unsigned hand-off.
  # No signing key is named here.
  build:
    name: "Build: release files"
    needs: prepare
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABEL) }}
    timeout-minutes: 30
    env:
      ARTIFACT_NAME: hello-cli
      IMAGE_REPOSITORY: forge.example/examplescope/hello-cli
    outputs:
      dist-digest: ${{ steps.dist.outputs.digest }}
    steps:
      - name: Set up forge-ci
        uses: https://forge.example/examplescope/forge-ci/.forgejo/actions/setup-forge-ci@b369db7d70af68fa93a4b404841c4ce2ddbf90c0

      - name: Checkout prepared release
        env:
          CHECKOUT_REF: ${{ needs.prepare.outputs.release-sha }}
        run: |
          set -euo pipefail
          forge-ci platform checkout

      # The consumer's own action and secret: a pinned commit that is not the
      # layer's, and a secret the layer's release does not claim.
      - name: Restore the tool cache
        uses: https://forge.example/actions/cache@53b83947a5a98c8d113130e565377fae1a50d02f # v4.2.0
        with:
          token: ${{ secrets.TOOL_CACHE_TOKEN }}

      - name: Build
        uses: https://forge.example/examplescope/forge-ci/.forgejo/actions/build-go@b369db7d70af68fa93a4b404841c4ce2ddbf90c0
        with:
          version: ${{ needs.prepare.outputs.release-tag }}
          commit: ${{ needs.prepare.outputs.release-sha }}
          artifact-name: ${{ env.ARTIFACT_NAME }}
          main-package: ./cmd/hello-cli
          platforms: linux/amd64,linux/arm64

      - name: Log in to the registry
        uses: https://forge.example/examplescope/forge-ci/.forgejo/actions/registry-login@b369db7d70af68fa93a4b404841c4ce2ddbf90c0
        with:
          token: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}

      - name: Build and push the image
        id: image
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}
        run: |
          set -euo pipefail
          forge-ci container build-push-oci-image \
            --image "${IMAGE_REPOSITORY}" --tag "${RELEASE_TAG}" \
            --title "${ARTIFACT_NAME}" --version "${RELEASE_TAG}"

      - name: Record the image for the signer
        uses: https://forge.example/examplescope/forge-ci/.forgejo/actions/record-release-image@b369db7d70af68fa93a4b404841c4ce2ddbf90c0
        with:
          role: distroless
          image: ${{ env.IMAGE_REPOSITORY }}
          digest: ${{ steps.image.outputs.digest }}
          tag: ${{ needs.prepare.outputs.release-tag }}
          release-tag: ${{ needs.prepare.outputs.release-tag }}

      - name: Declare the release files
        run: |
          set -euo pipefail
          forge-ci release files declare --asset 'dist/*/*'

      - name: Upload dist/ with hand-off digest
        id: dist
        uses: https://forge.example/examplescope/forge-ci/.forgejo/actions/upload-dist@b369db7d70af68fa93a4b404841c4ce2ddbf90c0
        with:
          artifact-name: build-dist
          path: dist/

  sign-and-publish:
    name: Sign and publish
    needs: [prepare, build]
    if: ${{ always() && needs.build.result == 'success' }}
    uses: examplescope/forge-ci/.forgejo/workflows/sign-and-publish-release.yml@b369db7d70af68fa93a4b404841c4ce2ddbf90c0
    with:
      runs-on: ${{ vars.CI_RUNNER_LABEL }}
      signer-runs-on: ${{ vars.CI_RUNNER_LABEL }}
      release-tag: ${{ needs.prepare.outputs.release-tag }}
      release-sha: ${{ needs.prepare.outputs.release-sha }}
      release-request-sha: ${{ forgejo.sha }}
      dist-digest: ${{ needs.build.outputs.dist-digest }}
      artifact-name: build-dist
      artifact-path: dist/
      caller-workflow: release.yml
      forge-ci-repository: examplescope/forge-ci
      forge-ci-sha: b369db7d70af68fa93a4b404841c4ce2ddbf90c0
      signer-image: forge.example/examplescope/forge-ci-signer@sha256:9a51d9f761cd269cadb2066710c9d2dd293f4e1020e229ff4f47ee1e6bce6234
      # The key is a repository variable; its digest is reviewed with this file.
      cosign-public-key: ${{ vars.COSIGN_PUBLIC_KEY }}
      cosign-public-key-sha256: 0a118a651aac6f751385aeaeb4242996ecc5b1b30c272d8da4a75369abd6b630
    secrets:
      RELEASE_COSIGN_PRIVATE_KEY: ${{ secrets.RELEASE_COSIGN_PRIVATE_KEY }}
      RELEASE_COSIGN_PASSPHRASE: ${{ secrets.RELEASE_COSIGN_PASSPHRASE }}
      RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
      RELEASE_GPG_FINGERPRINT: ${{ secrets.RELEASE_GPG_FINGERPRINT }}
      RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_API_TOKEN }}
      RELEASE_REGISTRY_TOKEN: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}
