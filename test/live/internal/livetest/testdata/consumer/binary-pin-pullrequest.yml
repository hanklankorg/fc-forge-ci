# Offline fixture of the consumer planning tests in consumer_internal_test.go.
# It stands for the pull-request workflow of a consumer that pins the layer's
# binary itself: every setup passes the binary's digest as a literal, in more
# than one job, and the workflow calls no workflow of the layer. Nothing runs
# it.
name: Pull Request

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: "Check: lint"
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABEL) }}
    container:
      image: ${{ vars.CI_JOB_IMAGE }}
    timeout-minutes: 15
    steps:
      - name: Set up forge-ci
        uses: https://forge.example/examplescope/forge-ci/.forgejo/actions/setup-forge-ci@b369db7d70af68fa93a4b404841c4ce2ddbf90c0
        with:
          expected-sha256: f43d7a4ac43046a5fe3aac36259edec1f1361a3e076fa75d6aef76b61fc1227b

      - name: Checkout repository
        run: |
          set -euo pipefail
          forge-ci platform checkout --depth 1

      # A pinned action that is not the layer's: its commit is no layer pin.
      - name: Set up Node
        uses: https://forge.example/actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0

      - name: Lint
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings

  test:
    name: "Check: test"
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABEL) }}
    container:
      image: ${{ vars.CI_JOB_IMAGE }}
    timeout-minutes: 30
    steps:
      - name: Set up forge-ci
        uses: https://forge.example/examplescope/forge-ci/.forgejo/actions/setup-forge-ci@b369db7d70af68fa93a4b404841c4ce2ddbf90c0
        with:
          expected-sha256: f43d7a4ac43046a5fe3aac36259edec1f1361a3e076fa75d6aef76b61fc1227b

      - name: Checkout repository
        run: |
          set -euo pipefail
          forge-ci platform checkout --depth 1

      - name: Test
        run: |
          set -euo pipefail
          cargo test --locked --workspace

  # One fact per pin: a bump that changes the commit in one job and leaves the
  # binary digest of another behind is what this gate refuses.
  trust-boundary:
    name: "Check: release isolation"
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABEL) }}
    timeout-minutes: 10
    steps:
      - name: Set up forge-ci
        uses: https://forge.example/examplescope/forge-ci/.forgejo/actions/setup-forge-ci@b369db7d70af68fa93a4b404841c4ce2ddbf90c0
        with:
          expected-sha256: f43d7a4ac43046a5fe3aac36259edec1f1361a3e076fa75d6aef76b61fc1227b

      - name: Checkout repository
        run: |
          set -euo pipefail
          forge-ci platform checkout --depth 1

      - name: Verify release isolation boundaries
        uses: https://forge.example/examplescope/forge-ci/.forgejo/actions/check-l3-isolation@b369db7d70af68fa93a4b404841c4ce2ddbf90c0
        with:
          build-job: build
          dist-digest-output: dist-digest
