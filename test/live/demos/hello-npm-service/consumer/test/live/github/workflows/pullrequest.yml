# Forge CI owns the lint gate; the consumer's independent build job runs tests.
name: Pull Request Workflow

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build and test: npm"
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    container:
      image: ghcr.io/diggsweden/forge-ci-runtime-node-24:v0.90.0
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - run: npm ci
      - run: npm test
      - run: npm run build

  pr-checks:
    uses: diggsweden/forge-ci/.github/workflows/pullrequest-orchestrator.yml@v0.90.0
    permissions:
      actions: read
      contents: read
    with:
      forge-ci-binary-ref: v0.90.0
      project-type: npm
      lint-engine: nanolinter
      # The trial names a mirror of the javascript-typescript flavour here.
      nanolinter-image: codefloe.com/itiquette/nanolinter:javascript-typescript
      runtime-image: ghcr.io/diggsweden/forge-ci-runtime-base:v0.90.0
