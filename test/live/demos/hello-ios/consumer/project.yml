name: HelloTrial
options:
  bundleIdPrefix: org.example.trial
  deploymentTarget:
    iOS: "18.0"
configFiles:
  Debug: versions.xcconfig
  Release: versions.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: "1"
targets:
  HelloTrial:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.trial.hello-ios
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  HelloTrialTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: HelloTrial
schemes:
  HelloTrial:
    build:
      targets:
        HelloTrial: all
    test:
      targets: [HelloTrialTests]
