# The release build runs on the runner host, where the image is built too:
# setup-toolchain installs these.
[tools]
# The tests run on the host before the image build; the image compiles with
# the same Rust, pinned in the Containerfile.
rust = "1.99.0"
# build-release-image scans every platform before it publishes.
"aqua:aquasecurity/trivy" = "0.75.0"
