# Acceptance job tools match the admitted Forge CI source's .mise.toml.
# Nano itself is the separately authenticated source-built 0.8.6 artifact.
[settings]
experimental = true
pipx.uvx = true
minimum_release_age = "7d"
minimum_release_age_excludes = ["aqua:google/osv-scanner"]

[tools]
# Native NPM integration fixtures follow containers/runtime/Containerfile's pin.
node = "24.17.0"
"aqua:casey/just" = "1.58.0"
"aqua:rvben/rumdl" = "v0.2.79"
"aqua:google/yamlfmt" = "v0.21.0"
"aqua:rhysd/actionlint" = "v1.7.12"
"aqua:zricethezav/gitleaks" = "v8.30.1"
"forgejo:itiquette/gommitlint" = { version = "0.93.0", api_url = "https://codefloe.com/api/v1" }
"aqua:koalaman/shellcheck" = "v0.11.0"
"aqua:mvdan/sh" = "v3.14.1"
"aqua:hadolint/hadolint" = "v2.15.1"
"aqua:lycheeverse/lychee" = "0.24.2"
"aqua:opengrep/opengrep" = "1.30.2"
"aqua:google/osv-scanner" = "2.7.0"
"aqua:tamasfe/taplo" = "0.10.0"
"aqua:aquasecurity/trivy" = "0.76.0"
"aqua:crate-ci/typos" = "1.51.1"
"aqua:ossf/scorecard" = "5.6.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
# Use the existing source-build mechanism so this binary embeds Go 1.27.3.
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "v2.15.0"
jq = "1.8.2"
"aqua:anchore/syft" = "1.54.1"
"aqua:sigstore/cosign" = "3.1.3"
"aqua:astral-sh/uv" = "0.13.1"
"pipx:reuse" = { version = "6.2.0", uvx = "true", extras = "charset-normalizer" }
