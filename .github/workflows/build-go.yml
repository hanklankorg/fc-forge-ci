# Go Builder
#
# Builds artifact-first Go binaries and uploads them for release/container
# consumption. Output filenames include the platform suffix so GitHub Release
# assets have unique basenames. Tests remain caller-owned in pull-request
# quality flows; release tests are mandatory. An administrator may select safe
# native targets; skip-tests is always refused.
name: Build Go
on:
  workflow_call: # yamllint disable-line rule:truthy
    inputs:
      test-selection-json:
        description: "Administrator-owned native Go selection: packages and optional run regexp. Empty retains the legacy default. Never source this from consumer artifacts or dispatch inputs. Selected tests always use race detection and fresh native reports."
        type: string
        required: false
        default: ""
      enforce-application-tests:
        description: "Enforcement setting: false reports recognized test assertion failures without failing; the tests still run. Set it only in the administrator's entry point, since whoever writes this call can pass it; it is the administrator's only where that file is. See docs/admin-policy.md."
        type: boolean
        required: false
        default: false
      working-directory:
        description: "Working directory"
        required: false
        default: "."
        type: string
      branch:
        description: "Branch, tag, or SHA to checkout. Empty uses the triggering ref."
        required: false
        default: ""
        type: string
      artifact-name:
        description: "Artifact name for uploads (defaults to 'go-build-artifacts')"
        required: false
        default: ""
        type: string
      main-package:
        description: "Go package to build"
        required: false
        default: "."
        type: string
      binary-name:
        description: "Output binary name (defaults to artifact-name, then go module basename)"
        required: false
        default: ""
        type: string
      platforms:
        description: "Comma-separated GOOS/GOARCH targets"
        required: false
        default: "linux/amd64,linux/arm64,darwin/amd64,darwin/arm64"
        type: string
      build-tags:
        description: "Optional Go build tags"
        required: false
        default: ""
        type: string
      ldflags:
        description: "Additional ldflags appended after forge-ci version metadata"
        required: false
        default: ""
        type: string
      version:
        description: "Release version for ldflags (defaults to github.ref_name without leading v)"
        required: false
        default: ""
        type: string
      commit:
        description: "Prepared release commit SHA baked into the binary"
        required: false
        default: ""
        type: string
      source-date-epoch:
        description: "Prepared release commit timestamp used for deterministic build metadata"
        required: false
        default: ""
        type: string
      skip-tests:
        description: "Legacy input; true is refused. Admin policy controls findings, and tests still run."
        required: false
        default: false
        type: boolean
      enable-build-sbom:
        description: "Generate CycloneDX Build SBOM with cyclonedx-gomod"
        required: false
        default: true
        type: boolean
      runtime-image:
        description: "forge-ci runtime image carrying Go + cyclonedx-gomod., pinned by digest (image@sha256:<64 hex>); the resolver refuses anything else before the job container starts."
        required: true
        type: string
      runs-on:
        description: "JSON array of runner labels for the ordinary jobs, read with fromJSON. Signing, promotion and publication jobs stay on GitHub-hosted runners."
        required: false
        default: '["ubuntu-26.04"]'
        type: string
      forge-ci-binary-ref:
        description: "Full engine commit (40 hex) the workflow ref names; a tag or branch is refused"
        required: true
        type: string
permissions:
  contents: read
jobs:
  resolve-bootstrap:
    permissions:
      contents: read
    uses: ./.github/workflows/resolve-forge-ci-bootstrap.yml
    with:
      forge-ci-binary-ref: ${{ inputs['forge-ci-binary-ref'] }}
      images: |
        runtime-image=${{ inputs['runtime-image'] }}
  build-go:
    needs: [resolve-bootstrap]
    name: Build Go Project
    runs-on: ${{ fromJSON(inputs['runs-on']) }}
    timeout-minutes: 30
    container:
      image: ${{ inputs['runtime-image'] }}
    permissions:
      contents: read
    steps:
      - name: Guard working-directory stays inside the workspace
        # Every upload below is rooted at this caller-supplied value. An
        # absolute path or a parent step would take the artifact from outside
        # the workspace, so it is refused here, before any step consumes it.
        env:
          WORKING_DIRECTORY: ${{ inputs['working-directory'] }}
        run: |
          case "$WORKING_DIRECTORY" in
            "") echo "working-directory must not be empty" >&2; exit 1 ;;
            /*) echo "working-directory must be workspace-relative: $WORKING_DIRECTORY" >&2; exit 1 ;;
          esac
          case "/$WORKING_DIRECTORY/" in
            */../*) echo "working-directory must not contain parent-directory steps: $WORKING_DIRECTORY" >&2; exit 1 ;;
          esac
      - name: Checkout repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECKOUT_REF: ${{ inputs.branch }}
          CHECKOUT_FETCH_ALL_REFS: "true"
        run: forge-ci platform checkout
      # The image's Go decides where its caches are; an image older or newer
      # than this workflow then still restores them.
      - name: Locate Go caches
        id: go-cache
        run: |
          printf 'modules=%s\n' "$(go env GOMODCACHE)" >>"$GITHUB_OUTPUT"
          printf 'build=%s\n' "$(go env GOCACHE)" >>"$GITHUB_OUTPUT"
      - name: Cache Go modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: go-${{ runner.os }}-${{ hashFiles(format('{0}/go.sum', inputs['working-directory']), format('{0}/go.mod', inputs['working-directory'])) }}
          restore-keys: |
            go-${{ runner.os }}-
      - name: Build Go project
        # One step owns the whole build sequence (metadata → deps → test → SBOM
        # → compile → summary); the binary threads resolved metadata internally,
        # so the same `build go run` runs identically on GitLab. This job keeps
        # only the platform-transport steps around it (checkout, cache, upload).
        env:
          ADMIN_APPLICATION_TESTS: ${{ inputs['enforce-application-tests'] }}
          ADMIN_TEST_SELECTION_JSON: ${{ inputs['test-selection-json'] }}
          WORKING_DIRECTORY: ${{ inputs['working-directory'] }}
          ARTIFACT_NAME: ${{ inputs['artifact-name'] }}
          BINARY_NAME: ${{ inputs['binary-name'] }}
          VERSION: ${{ inputs.version }}
          CI_COMMIT: ${{ inputs.commit }}
          SOURCE_DATE_EPOCH: ${{ inputs['source-date-epoch'] }}
          REF_NAME: ${{ github.ref_name }}
          PLATFORMS: ${{ inputs.platforms }}
          BUILD_TAGS: ${{ inputs['build-tags'] }}
          LD_FLAGS: ${{ inputs.ldflags }}
          MAIN_PACKAGE: ${{ inputs['main-package'] }}
          SKIP_TESTS: ${{ inputs['skip-tests'] }}
          ENABLE_BUILD_SBOM: ${{ inputs['enable-build-sbom'] }}
        run: forge-ci build go run --enforce-application-tests="$ADMIN_APPLICATION_TESTS" --test-selection-json="$ADMIN_TEST_SELECTION_JSON"
      - name: Upload Go artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs['artifact-name'] != '' && format('{0}-go-build-artifacts', inputs['artifact-name']) || 'go-build-artifacts' }}
          path: ${{ inputs['working-directory'] }}/dist/**
          retention-days: "7"
          if-no-files-found: error
      - name: Upload Go Build SBOM
        if: ${{ inputs['enable-build-sbom'] }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs['artifact-name'] != '' && format('{0}-go-build-sbom', inputs['artifact-name']) || 'go-build-sbom' }}
          path: ${{ inputs['working-directory'] }}/.forge-ci/go-build-sbom/**/bom.json
          retention-days: "7"
          if-no-files-found: error
