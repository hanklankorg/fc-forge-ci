# Xcode iOS Builder
# 
# Purpose: Builds iOS/macOS applications with Xcode, creating IPA files for
# distribution to TestFlight or App Store.
#
# Build Process:
#   1. Set up Xcode environment and select version
#   2. Configure code signing (certificates and provisioning profiles)
#   3. Archive application using xcodebuild
#   4. Export IPA with specified export method
#   5. Upload IPA artifacts with custom naming
#
# Features:
#   - Multiple Xcode versions support
#   - Configurable schemes and configurations
#   - iOS code signing with certificates and provisioning profiles
#   - IPA export with custom options
#   - Configurable artifact base name with an optional git-ref suffix
#   - Support for workspace or project files
#
# Outputs:
#   - IPA and archive artifacts named from artifact-name (or the repository)
#     plus `-<ref>` when include-tag is enabled
#
# Required Secrets (for signing):
#   IOS_SIGNING_CERTIFICATE_BASE64: Base64-encoded distribution certificate (.p12)
#   IOS_SIGNING_CERTIFICATE_PASSPHRASE: Certificate passphrase
#   PROVISIONING_PROFILE_BASE64: Base64-encoded provisioning profile
#   EXPORT_OPTIONS_BASE64: Base64-encoded exportOptions.plist (optional, can use vars)
#   XCCONFIG_BASE64: Base64-encoded xcconfig file with build settings overrides (optional)
#
# Required Permissions:
#   contents: read  # Checkout code
#
name: Build Xcode iOS
on:
  workflow_call:
    inputs:
      # === REQUIRED ===
      xcode-version:
        description: "Xcode version (e.g., 16.1, 15.4)"
        required: true
        type: string
      scheme:
        description: "Xcode scheme to build (e.g., 'DemoApp', 'MyApp')"
        required: true
        type: string
      # === XCODE PROJECT CONFIGURATION ===
      workspace:
        description: "Xcode workspace file (e.g., App.xcworkspace). Mutually exclusive with project."
        required: false
        type: string
      project:
        description: "Xcode project file (e.g., App.xcodeproj). Mutually exclusive with workspace."
        required: false
        type: string
      configuration:
        description: "Build configuration (Debug, Release)"
        required: false
        default: "Release"
        type: string
      # === CODE SIGNING ===
      enable-code-signing:
        description: "Enable iOS code signing with certificates and provisioning profiles"
        required: false
        default: true
        type: boolean
      # === EXPORT OPTIONS ===
      export-options-var:
        description: "Name of GitHub variable containing base64-encoded exportOptions.plist"
        required: false
        default: "EXPORT_OPTIONS_BASE64"
        type: string
      # === ARTIFACT NAMING ===
      artifact-name:
        description: "Exact artifact name (overrides auto-generated name if set)"
        required: false
        default: ""
        type: string
      include-tag:
        description: "Include git tag/ref in artifact name"
        required: false
        default: true
        type: boolean
      build-number:
        description: "Build number to set as CURRENT_PROJECT_VERSION"
        required: false
        default: ""
        type: string
      # === XCODEGEN ===
      use-xcodegen:
        description: "Run xcodegen to generate Xcode project before building"
        required: false
        default: false
        type: boolean
      xcodegen-spec:
        description: "Path to xcodegen spec file, relative to working-directory"
        required: false
        default: "project.yml"
        type: string
      # === BUILD CONFIGURATION ===
      working-directory:
        description: "Working directory"
        required: false
        default: "."
        type: string
      branch:
        description: "Branch, tag, or SHA to checkout. Empty uses the triggering ref."
        required: false
        default: ""
        type: string
      destination:
        description: "Build destination (default: generic/platform=iOS)"
        required: false
        default: "generic/platform=iOS"
        type: string
      runs-on-darwin-arm64:
        description: "JSON array of runner labels for the macOS arm64 jobs, read with fromJSON."
        required: false
        default: '["macos-26"]'
        type: string
      forge-ci-binary-ref:
        description: "Full approved engine commit; the macOS job builds forge-ci from the engine checkout at it (canonical delivery serves Linux only). The release route passes its own."
        required: true
        type: string
    # All `required: false` — `secrets: inherit` callers unchanged.
    secrets:
      IOS_SIGNING_CERTIFICATE_BASE64:
        description: "Base64-encoded .p12 code-signing certificate"
        required: false
      IOS_SIGNING_CERTIFICATE_PASSPHRASE:
        description: "Passphrase for IOS_SIGNING_CERTIFICATE_BASE64"
        required: false
      PROVISIONING_PROFILE_BASE64:
        description: "Base64-encoded provisioning profile (.mobileprovision)"
        required: false
      XCCONFIG_BASE64:
        description: "Base64-encoded xcconfig file (signing team ID, bundle ID, etc.)"
        required: false
permissions:
  contents: read
jobs:
  resolve-bootstrap:
    permissions:
      contents: read
    uses: ./.github/workflows/resolve-forge-ci-bootstrap.yml
    with:
      forge-ci-binary-ref: ${{ inputs['forge-ci-binary-ref'] }}
  build-variants:
    needs: [resolve-bootstrap]
    if: ${{ !inputs['enable-code-signing'] }}
    name: Build Xcode iOS
    runs-on: ${{ fromJSON(inputs['runs-on-darwin-arm64']) }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - &xcode-guard-working-directory-stays-inside-the-workspace
        name: Guard working-directory stays inside the workspace
        # Every upload below is rooted at this caller-supplied value. An
        # absolute path or a parent step would take the artifact from outside
        # the workspace, so it is refused here, before any step consumes it.
        env:
          WORKING_DIRECTORY: ${{ inputs['working-directory'] }}
        run: |
          case "$WORKING_DIRECTORY" in
            "") echo "working-directory must not be empty" >&2; exit 1 ;;
            /*) echo "working-directory must be workspace-relative: $WORKING_DIRECTORY" >&2; exit 1 ;;
          esac
          case "/$WORKING_DIRECTORY/" in
            */../*) echo "working-directory must not contain parent-directory steps: $WORKING_DIRECTORY" >&2; exit 1 ;;
          esac
      - &xcode-checkout-repository
        name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1
      - &xcode-checkout-the-approved-engine
        # macOS: canonical delivery builds Linux files only, so this lane builds
        # forge-ci from the approved engine commit with the engine's own darwin
        # build action, run from that same checkout.
        name: Checkout the approved engine
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ needs.resolve-bootstrap.outputs.forge-ci-repository }}
          ref: ${{ inputs['forge-ci-binary-ref'] }}
          path: _forge_ci_engine
          persist-credentials: false
      - &xcode-build-forge-ci-for-macos-from-the-approved-engine
        name: Build forge-ci for macOS from the approved engine
        uses: ./_forge_ci_engine/.github/actions/build-darwin-cli
        with:
          engine-commit: ${{ inputs['forge-ci-binary-ref'] }}

      - &xcode-refuse-pr-context-trigger-publish-release-secrets-in-scope
        # Defense-in-depth: refuse PR-context triggers. IOS_SIGNING_*
        # and PROVISIONING_PROFILE_BASE64 land in env for this job;
        # must never run with PR-HEAD code.
        name: Refuse PR-context trigger (publish/release secrets in scope)
        run: forge-ci validate event-context

      - &xcode-select-xcode-version
        name: Select Xcode version
        env:
          XCODE_VERSION: ${{ inputs.xcode-version }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - &xcode-install-build-dependencies
        name: Install build dependencies
        run: |
          if ! command -v xcbeautify &> /dev/null; then
            brew install xcbeautify
          fi
          printf "✓ xcbeautify installed\n"

      - &xcode-generate-xcode-project-with-xcodegen
        name: Generate Xcode project with XcodeGen
        if: ${{ inputs['use-xcodegen'] }}
        working-directory: ${{ inputs['working-directory'] }}
        env:
          XCODEGEN_SPEC: ${{ inputs['xcodegen-spec'] }}
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate --spec "$XCODEGEN_SPEC"
          printf "✓ Xcode project generated from %s\n" "$XCODEGEN_SPEC"

      - name: Build iOS app
        id: build
        # One step owns the forge-ci build-logic core (artifact-name →
        # signing → metadata → xcconfig → archive → export → list); the binary
        # threads the xcconfig path internally and branches on
        # --enable-code-signing. The macOS host setup (xcode-select, brew,
        # xcodegen) stays above; only upload wraps this below.
        working-directory: ${{ inputs['working-directory'] }}
        env:
          ARTIFACT_NAME: ${{ inputs['artifact-name'] }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          INCLUDE_TAG: ${{ inputs['include-tag'] }}
          REF_NAME: ${{ github.ref_name }}
          WORKSPACE: ${{ inputs.workspace }}
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
          CONFIGURATION: ${{ inputs.configuration }}
          DESTINATION: ${{ inputs.destination }}
          BUILD_NUMBER: ${{ inputs['build-number'] }}
          ENABLE_CODE_SIGNING: "false"
          XCCONFIG_BASE64: ${{ secrets.XCCONFIG_BASE64 }}
          EXPORT_OPTIONS_BASE64: ${{ vars[inputs.export-options-var] }}
          EXPORT_OPTIONS_VAR: ${{ inputs.export-options-var }}
        run: forge-ci build xcode-ios run

      - &xcode-upload-ipa-artifact
        name: Upload IPA artifact
        if: ${{ inputs['enable-code-signing'] }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build.outputs.ipa-name }}
          path: |
            ${{ inputs['working-directory'] }}/build/export/*.ipa
          retention-days: "7"
          if-no-files-found: error

      - &xcode-upload-archive-unsigned-builds
        name: Upload archive (unsigned builds)
        if: ${{ !inputs['enable-code-signing'] }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build.outputs.ipa-name }}-archive
          path: |
            ${{ inputs['working-directory'] }}/build/app.xcarchive
          retention-days: "7"
          if-no-files-found: error

      - &xcode-generate-build-summary
        name: Generate build summary
        env:
          XCODE_VERSION: ${{ inputs.xcode-version }}
          SCHEME: ${{ inputs.scheme }}
          CONFIGURATION: ${{ inputs.configuration }}
          DESTINATION: ${{ inputs.destination }}
          SIGNING: ${{ inputs['enable-code-signing'] }}
          VERSION: ${{ steps.build.outputs.version }}
          BUILD_NUMBER: ${{ steps.build.outputs.build }}
          IPA_NAME: ${{ steps.build.outputs.ipa-name }}
        run: forge-ci report build xcode
  build-variants-signed:
    needs: [resolve-bootstrap]
    if: ${{ inputs['enable-code-signing'] }}
    name: Build Xcode iOS (signed)
    # Holds the signing credentials: the hosted runner, never the caller's.
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - *xcode-guard-working-directory-stays-inside-the-workspace
      - *xcode-checkout-repository
      - *xcode-checkout-the-approved-engine
      - *xcode-build-forge-ci-for-macos-from-the-approved-engine
      - *xcode-refuse-pr-context-trigger-publish-release-secrets-in-scope
      - *xcode-select-xcode-version
      - *xcode-install-build-dependencies
      - *xcode-generate-xcode-project-with-xcodegen

      - name: Build iOS app
        id: build
        # One step owns the forge-ci build-logic core (artifact-name →
        # signing → metadata → xcconfig → archive → export → list); the binary
        # threads the xcconfig path internally and branches on
        # --enable-code-signing. The macOS host setup (xcode-select, brew,
        # xcodegen) stays above; only upload wraps this below.
        working-directory: ${{ inputs['working-directory'] }}
        env:
          ARTIFACT_NAME: ${{ inputs['artifact-name'] }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          INCLUDE_TAG: ${{ inputs['include-tag'] }}
          REF_NAME: ${{ github.ref_name }}
          WORKSPACE: ${{ inputs.workspace }}
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
          CONFIGURATION: ${{ inputs.configuration }}
          DESTINATION: ${{ inputs.destination }}
          BUILD_NUMBER: ${{ inputs['build-number'] }}
          ENABLE_CODE_SIGNING: "true"
          IOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.IOS_SIGNING_CERTIFICATE_BASE64 }}
          IOS_SIGNING_CERTIFICATE_PASSPHRASE: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSPHRASE }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          XCCONFIG_BASE64: ${{ secrets.XCCONFIG_BASE64 }}
          EXPORT_OPTIONS_BASE64: ${{ vars[inputs.export-options-var] }}
          EXPORT_OPTIONS_VAR: ${{ inputs.export-options-var }}
        run: forge-ci build xcode-ios run
      - *xcode-upload-ipa-artifact
      - *xcode-upload-archive-unsigned-builds
      - *xcode-generate-build-summary
