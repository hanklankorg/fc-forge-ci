# ⚠️ INTERNAL USE ONLY - Release workflow for forge-ci itself
# This workflow manages forge-ci's own releases using release-orchestrator.
# For templates to use in YOUR project, see examples/ directory.
#
# Nothing here depends on the repository's default branch or a fixed branch
# name: the release branch is the branch whose head the request tag names
# (override with the RELEASE_BRANCH variable), the companion suite repository
# can be overridden with FORGE_CI_TESTSUITE_REPOSITORY, and runtime images
# come from ghcr.io/<owner> (or FORGE_CI_IMAGE_NAMESPACE) at this commit's
# sha-<short> tags, which Self Runtime Container publishes when the commit lands
# on the pre-release branch. A fork can therefore release from any branch.
name: Self Release
on:
  push:
    tags:
      - "release-request/v*"
concurrency:
  group: self-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  resolve-branch:
    name: Resolve release branch and images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      branch: ${{ steps.branch.outputs.branch }}
      image-tag: ${{ steps.branch.outputs.image-tag }}
    steps:
      - name: Find the branch whose head is the release request
        id: branch
        # The prepare stage re-checks that the request commit is this branch's
        # head; this step only chooses the branch without assuming one.
        env:
          GIT_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          SHA: ${{ github.sha }}
          RELEASE_BRANCH: ${{ vars.RELEASE_BRANCH }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_BRANCH" ]]; then
            branch="$RELEASE_BRANCH"
          else
            hdr="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 | tr -d '\n')"
            mapfile -t heads < <(git -c http.extraheader="$hdr" ls-remote --heads "${SERVER_URL}/${REPO}.git" |
              awk -v sha="$SHA" '$1 == sha { sub("^refs/heads/", "", $2); print $2 }')
            if [[ "${#heads[@]}" -ne 1 ]]; then
              printf 'Expected exactly one branch head at %s, found %d; set the RELEASE_BRANCH variable\n' "$SHA" "${#heads[@]}" >&2
              exit 1
            fi
            branch="${heads[0]}"
          fi
          if [[ ! "$branch" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            printf 'Release branch is not a plain branch name: %s\n' "$branch" >&2
            exit 1
          fi
          printf 'Release branch: %s\n' "$branch"
          printf 'branch=%s\n' "$branch" >>"$GITHUB_OUTPUT"
          printf 'image-tag=sha-%s\n' "${SHA:0:7}" >>"$GITHUB_OUTPUT"
      - name: Require this commit's runtime images
        # The release runs on the images built from this commit. Fail here, before
        # the black-box gate and the release, when they are not public yet.
        # Check anonymously so a token cannot hide a private package.
        env:
          NAMESPACE: ${{ vars.FORGE_CI_IMAGE_NAMESPACE || format('ghcr.io/{0}', github.repository_owner) }}
          IMAGE_TAG: ${{ steps.branch.outputs.image-tag }}
        run: |
          set -euo pipefail
          missing=0
          for name in base "" java-25 node-24 rust-stable go-1.27 android-35; do
            image="${NAMESPACE}/forge-ci-runtime${name:+-$name}:${IMAGE_TAG}"
            if ! docker manifest inspect "$image" >/dev/null 2>&1; then
              printf 'Runtime image %s is not publicly readable; check package visibility and wait for Self Runtime Container to publish this commit\n' "$image" >&2
              missing=1
            fi
          done
          exit "$missing"

  blackbox:
    name: Strict companion black-box gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: forge-ci
          persist-credentials: false
      - name: Checkout companion testsuite (pinned)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ vars.FORGE_CI_TESTSUITE_REPOSITORY || 'diggsweden/forge-ci-blackbox-tests' }}
          ref: fc8c13fc4b948c3c8928d4181be3dfa78e5d1944
          path: forge-ci-blackbox-tests
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: forge-ci/go.mod
          check-latest: true
          # The checkouts sit in subdirectories, so the cache key needs
          # their paths; setup-go looks for go.sum at the workspace root.
          cache-dependency-path: |
            forge-ci/go.sum
            forge-ci-blackbox-tests/go.sum
      - name: Validate strict companion behavioral contract
        working-directory: forge-ci-blackbox-tests
        run: ./scripts/validate-strict-profile-contract.sh
      - name: Ensure distro toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq buildah
      - name: Install the companion's pinned Maven
        # Not Ubuntu's maven package: it is 3.8, which ignores MAVEN_ARGS
        # (3.9+), so the harness's settings isolation and reproducible-build
        # checks fail. Only Maven's own bin directory goes on PATH, so the
        # companion's other mise pins do not shadow setup-go.
        working-directory: forge-ci-blackbox-tests
        run: |
          source ../forge-ci/scripts/bootstrap/install-mise.sh
          install_mise
          mise trust .mise.toml
          mise install maven
          mise bin-paths maven >>"$GITHUB_PATH"
      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx --version 0.5.9
      - name: Install cyclonedx-gomod
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
      - name: Install syft and cosign
        working-directory: forge-ci
        run: |
          set -euo pipefail
          source scripts/bootstrap/install-syft.sh
          install_syft
          source scripts/bootstrap/install-cosign.sh
          install_cosign
      - name: Run strict black-box release gate
        working-directory: forge-ci-blackbox-tests
        env:
          FORGE_CI_BLACKBOX_PROFILE: strict
          FORGE_CI_PROC_SWAPS: "/dev/null"
        run: go test -tags=blackbox -count=1 -timeout 45m ./tests/blackbox/...

  evidence:
    # The release-time shape of `just test`. The pull-request gate runs the
    # integration tier in its default profile on purpose — a contributor
    # without buildah or trivy still gets a useful run, and what their machine
    # could not prove is tallied rather than hidden. That allowance has no
    # place here: at release time "we proved it" has to mean the evidence
    # actually ran, so FORGE_CI_TEST_PROFILE=strict turns every skipped
    # prerequisite into an error and a runner missing a tool fails the release
    # instead of quietly proving less.
    #
    # Which is why the tools are installed rather than assumed. mise brings
    # the pinned trivy and jq, install-buildah.sh brings buildah and podman;
    # ssh-keygen, gpg, git and coreutils come with the runner image. Under
    # strict any of them going missing is a failure, so this step list is the
    # gate's real prerequisite list, not a convenience.
    name: Strict integration tier
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Install mise and project tools
        env:
          # mise verifies attestations and resolves releases through the
          # GitHub API; anonymous requests share the runner address's small
          # quota, and running out of it failed the v0.90.0 release gate.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          source ./scripts/bootstrap/install-mise.sh
          install_mise
          mise install
          # Expose mise-managed binaries to subsequent steps.
          printf '%s\n' "${MISE_DATA_DIR:-$HOME/.local/share/mise}/shims" >>"$GITHUB_PATH"
          dirname "$(command -v mise)" >>"$GITHUB_PATH"
      - name: Install buildah and podman
        run: bash scripts/bootstrap/install-buildah.sh
      - name: Run the integration tier, refusing to skip evidence
        run: just test-integration-strict

  release:
    needs: [resolve-branch, blackbox, evidence]
    uses: ./.github/workflows/release-orchestrator.yml
    permissions:
      contents: write
      packages: write
      id-token: write
      actions: read
    # Own-repo orchestrator call (dogfooding the release flow). The
    # .forge-ci/artifacts.yml release keeps the GPG defaults for artifact
    # and Git-object signing, so it needs the release token and the GPG key.
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
      RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
      RELEASE_GPG_PUBLIC_KEY: ${{ secrets.RELEASE_GPG_PUBLIC_KEY }}
    with:
      branch: ${{ needs.resolve-branch.outputs.branch }}
      runtime-image: ${{ vars.FORGE_CI_IMAGE_NAMESPACE || format('ghcr.io/{0}', github.repository_owner) }}/forge-ci-runtime-base:${{ needs.resolve-branch.outputs.image-tag }}
      runtime-image-full: ${{ vars.FORGE_CI_IMAGE_NAMESPACE || format('ghcr.io/{0}', github.repository_owner) }}/forge-ci-runtime:${{ needs.resolve-branch.outputs.image-tag }}
      runtime-image-java: ${{ vars.FORGE_CI_IMAGE_NAMESPACE || format('ghcr.io/{0}', github.repository_owner) }}/forge-ci-runtime-java-25:${{ needs.resolve-branch.outputs.image-tag }}
      runtime-image-node: ${{ vars.FORGE_CI_IMAGE_NAMESPACE || format('ghcr.io/{0}', github.repository_owner) }}/forge-ci-runtime-node-24:${{ needs.resolve-branch.outputs.image-tag }}
      runtime-image-rust: ${{ vars.FORGE_CI_IMAGE_NAMESPACE || format('ghcr.io/{0}', github.repository_owner) }}/forge-ci-runtime-rust-stable:${{ needs.resolve-branch.outputs.image-tag }}
      runtime-image-go: ${{ vars.FORGE_CI_IMAGE_NAMESPACE || format('ghcr.io/{0}', github.repository_owner) }}/forge-ci-runtime-go-1.27:${{ needs.resolve-branch.outputs.image-tag }}
      runtime-image-android: ${{ vars.FORGE_CI_IMAGE_NAMESPACE || format('ghcr.io/{0}', github.repository_owner) }}/forge-ci-runtime-android-35:${{ needs.resolve-branch.outputs.image-tag }}
      artifacts-config: .forge-ci/artifacts.yml
      forge-ci-binary-ref: ${{ github.sha }}
      changelog-creator: git-cliff
      changelog.config: templates/gitcliff/default.toml
      release-publisher: github-cli

  binary:
    # Builds, signs and attaches the release binaries once the final tag and
    # GitHub Release exist. Called rather than chained with workflow_run, which
    # only fires from the default branch.
    needs: release
    uses: ./.github/workflows/release-binary.yml
    permissions:
      contents: write
      id-token: write
    with:
      release-ref: ${{ github.ref_name }}
