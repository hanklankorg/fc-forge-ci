#
# release-binary
#
# Called by Self Release after the orchestrator has created the final tag and
# GitHub Release, or run manually for an explicit final tag. The two-workflow
# split is intentional: Self Release drives the orchestrator (changelog,
# release notes, GitHub Release creation) while this workflow
# produces the multi-arch binary tarballs and uploads them to the
# already-existing release.
#
# Builds linux/darwin × amd64/arm64 archives via goreleaser and
# uploads them as a GitHub release with checksums.txt plus a Sigstore
# v3 bundle (checksums.txt.bundle). The bundle is produced by cosign
# keyless signing — no long-lived key — and is verified by
# scripts/bootstrap/install-forge-ci.sh using its pinned cosign bootstrap.
#
# Reproducibility: SOURCE_DATE_EPOCH and goreleaser's {{.CommitDate}} normalize
# payload timestamps. Byte identity also requires equal toolchain, version and
# resolved build inputs; newly signed bundles are separate evidence.
name: Release binary
# workflow_call keeps the chain independent of the repository's default branch
# (workflow_run only fires from it), so a fork can release from any branch.
# Authorisation comes from the caller: Self Release only runs on release-request
# tag pushes and calls this after its release job succeeded. The keyless
# signing identity is therefore release-binary.yml@refs/tags/release-request/vX.Y.Z,
# which is exactly what installers trust.
on:
  workflow_call:
    inputs:
      release-ref:
        description: "Release-request tag (release-request/vX.Y.Z) whose final release to build"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release-ref:
        description: "Final release tag (vX.Y.Z) or its release-request tag. Run from refs/tags/release-request/vX.Y.Z so installers can verify the signature."
        required: true
        type: string
permissions:
  contents: read
jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write # release upload
      id-token: write # Sigstore keyless OIDC (cosign sign-blob: checksums + provenance)
    steps:
      - name: Harden runner (egress=block, explicit allowlist)
        # release-binary is the highest-trust job in the project —
        # the binary uploaded here is what consumers download. Egress
        # is fully knowable in advance: github + goproxy + sigstore +
        # the goreleaser-action's curl download. Block everything else
        # so a compromised dependency in the Go module graph can't
        # quietly exfiltrate during the build.
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443 github.com:443 objects.githubusercontent.com:443 release-assets.githubusercontent.com:443 uploads.github.com:443 proxy.golang.org:443 sum.golang.org:443 storage.googleapis.com:443 fulcio.sigstore.dev:443 rekor.sigstore.dev:443 timestamp.sigstore.dev:443 tuf-repo-cdn.sigstore.dev:443 ghcr.io:443
      # This first checkout is used only to run the trusted ref parser; the
      # build checkout below is the final tag created by Self Release.
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs['release-ref'] }}
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Install forge-ci binary
        # Built from the checked-out request (or final tag) commit, the same
        # trusted source the ref parser used to run from.
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/forge-ci-bin/forge-ci" ./cmd/forge-ci
          printf '%s\n' "$RUNNER_TEMP/forge-ci-bin" >>"$GITHUB_PATH"
      # Defense-in-depth gate: refuse to run when the trigger exposes
      # contributor-controlled commit context to the release token.
      - name: Refuse PR-context trigger (release secrets in scope)
        run: forge-ci validate event-context
      - name: Resolve final release tag
        id: release-context
        env:
          RELEASE_REF: ${{ inputs['release-ref'] }}
        run: forge-ci version derive-release --ref-name "$RELEASE_REF"
      - name: Require the release-request signing identity
        # Installers trust this workflow only when it signs at the exact
        # refs/tags/release-request/vX.Y.Z ref. A called run inherits that ref
        # from Self Release; a manual rerun must be started from the same tag.
        env:
          RELEASE_TAG: ${{ steps.release-context.outputs.release-tag }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          want="refs/tags/release-request/${RELEASE_TAG}"
          if [[ "$WORKFLOW_REF" != "$want" ]]; then
            printf 'Refusing to sign %s from %s; run from %s so installers can verify it\n' "$RELEASE_TAG" "$WORKFLOW_REF" "$want" >&2
            exit 1
          fi
      - name: Checkout created final release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ steps.release-context.outputs.release-tag }}
          fetch-depth: 0
          fetch-tags: true
      - name: Install cosign and syft
        # GoReleaser signs through forge-ci's cosign adapter and uses syft for SBOMs.
        # The repository's installers pin each version and SHA-256 (Renovate
        # keeps them current), retry transient download failures, and fetch
        # only from github.com release downloads, which the egress allowlist
        # above admits.
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source scripts/bootstrap/install-cosign.sh
          install_cosign
          # shellcheck source=/dev/null
          source scripts/bootstrap/install-syft.sh
          install_syft
      - name: Set SOURCE_DATE_EPOCH from commit
        # Pins the binary's embedded date and the tarball mtimes to
        # the commit timestamp. Without this, two builds of the same
        # tag minutes apart would differ — sabotaging reproducibility
        # before any consumer can verify it.
        run: |
          source_date_epoch="$(git log -1 --format=%ct HEAD)"
          printf 'SOURCE_DATE_EPOCH=%s\n' "$source_date_epoch" >> "$GITHUB_ENV"
      - name: Verify release tag is still pinned to this commit
        env:
          RELEASE_TAG: ${{ steps.release-context.outputs.release-tag }}
        run: |
          set -euo pipefail
          direct="$(git ls-remote --exit-code origin "refs/tags/${RELEASE_TAG}" | awk 'NR == 1 { print $1 }')"
          peeled="$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" | awk 'NR == 1 { print $1 }')"
          remote_sha="${peeled:-$direct}"
          local_sha="$(git rev-parse HEAD)"
          if [[ "$remote_sha" != "$local_sha" ]]; then
            printf 'Refusing stale release publication: %s resolves to %s, checkout is %s\n' "$RELEASE_TAG" "$remote_sha" "$local_sha" >&2
            exit 1
          fi
      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          # An exact version: the binaries are reproducible only from a known
          # GoReleaser, and a range makes the action resolve it through
          # goreleaser.com, which the release job's egress allowlist refuses.
          version: 'v2.18.2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate + sign SLSA provenance (cosign sign-blob, keyless)
        # Portable, forge-neutral replacement for actions/attest-build-provenance.
        # forge-ci generates the in-toto / SLSA-v1.0 statement from goreleaser's
        # checksums (its subjects cover every tarball + SBOM) and signs it keyless
        # with cosign sign-blob → a Sigstore bundle. No GitHub attestation API; the
        # provenance verifies on any forge:
        #   cosign verify-blob --bundle forge-ci.intoto.jsonl \
        #     --certificate-identity-regexp '^https://github.com/diggsweden/forge-ci/\.github/workflows/release-binary\.yml@refs/tags/release-request/vX\.Y\.Z$' \
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
        #     forge-ci.intoto.json
        # Uses the binary goreleaser just built (self-consistent), then attaches
        # the statement + bundle to the release.
        env:
          SIGN_METHOD: sigstore
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          archive="$(find dist -name 'forge-ci_*_linux_amd64.tar.gz' | head -1)"
          tar -xzf "$archive" -C "$RUNNER_TEMP" forge-ci
          "$RUNNER_TEMP/forge-ci" release provenance \
            --checksums-file dist/checksums.txt \
            --output dist/forge-ci.intoto.json \
            --bundle dist/forge-ci.intoto.jsonl
          tag="$(git describe --tags --exact-match HEAD)"
          "$RUNNER_TEMP/forge-ci" release attachments upload \
            --tag "$tag" \
            --pattern "dist/forge-ci.intoto.json,dist/forge-ci.intoto.jsonl"
