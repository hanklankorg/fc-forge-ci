# Gradle Android Builder
# 
# Purpose: Builds Android applications with multiple product flavors and build types,
# creating separate artifacts for debug/release APKs and AABs with custom naming.
#
# Build Process:
#   1. Set up JDK and Android SDK
#   2. Build specified product flavors and build types
#   3. Optional: Sign release builds
#   4. Upload separate artifacts for each variant with custom names
#
# Features:
#   - Multiple product flavors (demo, prod, staging, etc.)
#   - Multiple build types (debug, release)
#   - AAB (Android App Bundle) generation
#   - Date-stamped artifact names
#   - Custom artifact naming (playstore names, prefixes)
#   - Runtime image with pinned JDK, Gradle, and Android SDK tooling
#   - Android app signing
#
# Outputs:
#   - Separate artifacts per variant with custom names
#   - Examples: "2025-01-15 - testing_store - android-app - demo - APK debug"
#
# Required Secrets (for signing):
#   ANDROID_KEYSTORE: Base64-encoded keystore file
#   ANDROID_KEYSTORE_PASSWORD: Keystore password
#   ANDROID_KEY_ALIAS: Key alias
#   ANDROID_KEY_PASSWORD: Key password
#
# Required Permissions:
#   contents: read  # Checkout code
#
name: Build Gradle Android
on:
  workflow_call:
    inputs:
      enforce-application-tests:
        description: "Enforcement setting: false reports recognized test assertion failures without failing; the tests still run. Set it only in the administrator's entry point, since whoever writes this call can pass it; it is the administrator's only where that file is. See docs/admin-policy.md."
        type: boolean
        required: false
        default: false
      library:
        description: "Build an Android library AAR; application signing and APK/AAB variants do not apply."
        required: false
        default: false
        type: boolean
      publication-artifact-name:
        description: "Separate workflow artifact for exported Maven publications."
        required: false
        default: ""
        type: string
      version:
        description: "Expected immutable publication version; optional for snapshots."
        required: false
        default: ""
        type: string
      central-publication:
        description: "Require Central release metadata and sources/javadoc."
        required: false
        default: false
        type: boolean
      snapshot-publication:
        description: "Export resolved Maven snapshot publications."
        required: false
        default: false
        type: boolean
      # === REQUIRED ===
      build-module:
        description: "Gradle module to build (e.g., app)"
        required: true
        type: string
      # === VARIANT CONFIGURATION ===
      product-flavor:
        description: "Product flavor to build (e.g., demo, prod, staging). Leave empty for no flavor."
        required: false
        default: ""
        type: string
      build-types:
        description: "Build types to create (comma-separated: debug,release)"
        required: false
        default: "debug,release"
        type: string
      include-aab:
        description: "Also build AAB (Android App Bundle)"
        required: false
        default: true
        type: boolean
      gradle-tasks:
        description: "Override the derived gradle task list (e.g., 'assembleDemoRelease app:bundleDemoRelease'). When set, takes precedence over product-flavor/build-types/include-aab. Leave empty to derive tasks from those inputs."
        required: false
        default: ""
        type: string
      # === ARTIFACT NAMING ===
      artifact-name:
        description: "Override the derived artifact-name format. When set, the AAB is uploaded under this exact name and APK/SBOM variants get -debug/-release/-sbom suffixes. Used by the orchestrator (release-build-stage.yml) to align uploads with the artifacts.yml `name:` that release-publish-stage forwards to publish-google-play. Leave empty for date/prefix/repo/flavor-derived naming."
        required: false
        default: ""
        type: string
      artifact-name-prefix:
        description: "Prefix for derived artifact names (e.g., testing_store, production). Ignored when artifact-name is set."
        required: false
        default: ""
        type: string
      include-date-stamp:
        description: "Include date in derived artifact names. Ignored when artifact-name is set."
        required: false
        default: true
        type: boolean
      # === BUILD CONFIGURATION ===
      enable-signing:
        description: "Enable Android app signing"
        required: false
        default: false
        type: boolean
      working-directory:
        description: "Working directory"
        required: false
        default: "."
        type: string
      branch:
        description: "Branch, tag, or SHA to checkout. Empty uses the triggering ref."
        required: false
        default: ""
        type: string
      skip-tests:
        description: "Legacy input; true is refused. Admin policy controls findings, and tests still run."
        required: false
        default: false
        type: boolean
      enable-build-sbom:
        description: "Run the cyclonedx plugin step (false skips Build SBOM generation entirely; derived from per-artefact 'sboms' when called from release-build-stage)"
        required: false
        default: true
        type: boolean
      runtime-image:
        description: "forge-ci runtime image carrying JDK + Gradle + Android SDK., pinned by digest (image@sha256:<64 hex>); the resolver refuses anything else before the job container starts."
        required: true
        type: string
      runs-on:
        description: "JSON array of runner labels for the ordinary jobs, read with fromJSON. Signing, promotion and publication jobs stay on GitHub-hosted runners."
        required: false
        default: '["ubuntu-26.04"]'
        type: string
      forge-ci-binary-ref:
        description: "Full engine commit (40 hex) the workflow ref names; a tag or branch is refused"
        required: true
        type: string
    # All `required: false` — `secrets: inherit` callers unchanged.
    secrets:
      ANDROID_KEYSTORE:
        description: "Base64-encoded Android signing keystore (.jks/.keystore)"
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        description: "Password for ANDROID_KEYSTORE"
        required: false
      ANDROID_KEY_ALIAS:
        description: "Alias of the signing key inside ANDROID_KEYSTORE"
        required: false
      ANDROID_KEY_PASSWORD:
        description: "Password for the key referenced by ANDROID_KEY_ALIAS"
        required: false
      SECRETS_PROPERTIES_BASE64:
        description: "Base64-encoded secrets.properties file (Google Maps API keys, etc.)"
        required: false
    outputs:
      aar-name:
        description: "Uploaded Android library AAR artifact name"
        value: ${{ jobs.build-variants.outputs.aar-name || jobs.build-variants-signed.outputs.aar-name }}
      debug-name:
        description: "Uploaded artefact name for the debug APK"
        value: ${{ jobs.build-variants.outputs.debug-name || jobs.build-variants-signed.outputs.debug-name }}
      release-name:
        description: "Uploaded artefact name for the release APK"
        value: ${{ jobs.build-variants.outputs.release-name || jobs.build-variants-signed.outputs.release-name }}
      aab-name:
        description: "Uploaded artefact name for the release AAB"
        value: ${{ jobs.build-variants.outputs.aab-name || jobs.build-variants-signed.outputs.aab-name }}
      sbom-name:
        description: "Uploaded artefact name for the build SBOM"
        value: ${{ jobs.build-variants.outputs.sbom-name || jobs.build-variants-signed.outputs.sbom-name }}
permissions:
  contents: read
jobs:
  resolve-bootstrap:
    permissions:
      contents: read
    uses: ./.github/workflows/resolve-forge-ci-bootstrap.yml
    with:
      forge-ci-binary-ref: ${{ inputs['forge-ci-binary-ref'] }}
      images: |
        runtime-image=${{ inputs['runtime-image'] }}
  build-variants:
    needs: [resolve-bootstrap]
    if: ${{ inputs.library || !inputs['enable-signing'] }}
    name: Build Gradle Android
    runs-on: ${{ fromJSON(inputs['runs-on']) }}
    timeout-minutes: 60
    container:
      image: ${{ inputs['runtime-image'] }}
    permissions:
      contents: read
    outputs:
      aar-name: ${{ steps.build.outputs.aar-name }}
      debug-name: ${{ steps.build.outputs.debug-name }}
      release-name: ${{ steps.build.outputs.release-name }}
      aab-name: ${{ steps.build.outputs.aab-name }}
      sbom-name: ${{ steps.build.outputs.sbom-name }}
    steps:
      - &android-guard-working-directory-stays-inside-the-workspace
        name: Guard working-directory stays inside the workspace
        # Every upload below is rooted at this caller-supplied value. An
        # absolute path or a parent step would take the artifact from outside
        # the workspace, so it is refused here, before any step consumes it.
        env:
          WORKING_DIRECTORY: ${{ inputs['working-directory'] }}
        run: |
          case "$WORKING_DIRECTORY" in
            "") echo "working-directory must not be empty" >&2; exit 1 ;;
            /*) echo "working-directory must be workspace-relative: $WORKING_DIRECTORY" >&2; exit 1 ;;
          esac
          case "/$WORKING_DIRECTORY/" in
            */../*) echo "working-directory must not contain parent-directory steps: $WORKING_DIRECTORY" >&2; exit 1 ;;
          esac
      - &android-refuse-pr-context-trigger-publish-release-secrets-in-scope
        # Defense-in-depth: refuse PR-context triggers. ANDROID_KEYSTORE +
        # SECRETS_PROPERTIES_BASE64 land in env for this job; must never
        # run with PR-HEAD code. forge-ci is pre-baked.
        name: Refuse PR-context trigger (publish/release secrets in scope)
        run: forge-ci validate event-context
      - &android-checkout-repository
        name: Checkout repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECKOUT_REF: ${{ inputs.branch }}
          # All branch refs + tags needed: many Android build.gradle.kts files
          # read git history to derive versionCode (e.g.
          # `git rev-list --count origin/main`), which needs refs/remotes/origin/*.
          CHECKOUT_FETCH_ALL_REFS: "true"
        run: forge-ci platform checkout
      - &android-validate-publication-export-before-building
        name: Validate publication export before building
        if: ${{ inputs['publication-artifact-name'] != '' }}
        working-directory: ${{ inputs['working-directory'] }}
        env:
          VERSION: ${{ inputs.version }}
          SNAPSHOT_PUBLICATION: ${{ inputs['snapshot-publication'] }}
          BUILD_MODULE: ${{ inputs['build-module'] }}
        run: forge-ci build gradle export-publications --project "$BUILD_MODULE" --output .forge-ci/maven-publication --snapshot="$SNAPSHOT_PUBLICATION" --validate-only
      - &android-locate-the-gradle-home
        # The image decides where Gradle keeps its caches; an image older or
        # newer than this workflow then still restores them.
        name: Locate the Gradle home
        id: gradle-home
        run: printf 'path=%s\n' "${GRADLE_USER_HOME:-$HOME/.gradle}" >>"$GITHUB_OUTPUT"
      - &android-cache-gradle
        name: Cache Gradle
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ steps.gradle-home.outputs.path }}/caches
            ${{ steps.gradle-home.outputs.path }}/wrapper
          key: gradle-android-${{ hashFiles(format('{0}/gradle/wrapper/gradle-wrapper.properties', inputs['working-directory']), format('{0}/**/*.gradle*', inputs['working-directory']), format('{0}/**/gradle.properties', inputs['working-directory'])) }}
          restore-keys: gradle-android-
      - name: Build Android project
        id: build
        # One step owns the whole build sequence (artifact-names → keystore →
        # metadata → tasks → secrets.properties → build → SBOM → status); the
        # binary threads the keystore path + tasks internally and branches on
        # --enable-signing, so the same `build gradle-android run` runs on
        # GitLab. Signing passwords stay env vars the gradle build reads; only
        # platform-transport (checkout, cache, upload) wraps it.
        working-directory: ${{ inputs['working-directory'] }}
        env:
          ADMIN_APPLICATION_TESTS: ${{ inputs['enforce-application-tests'] }}
          INCLUDE_DATE_STAMP: ${{ inputs['include-date-stamp'] }}
          ANDROID_LIBRARY: ${{ inputs.library }}
          ARTIFACT_NAME_PREFIX: ${{ inputs['artifact-name-prefix'] }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          PRODUCT_FLAVOR: ${{ inputs['product-flavor'] }}
          ARTIFACT_NAME: ${{ inputs['artifact-name'] }}
          ENABLE_SIGNING: "false"
          SECRETS_PROPERTIES_BASE64: ${{ secrets.SECRETS_PROPERTIES_BASE64 }}
          GRADLE_TASKS_OVERRIDE: ${{ inputs['gradle-tasks'] }}
          BUILD_TYPES: ${{ inputs['build-types'] }}
          INCLUDE_AAB: ${{ inputs['include-aab'] }}
          BUILD_MODULE: ${{ inputs['build-module'] }}
          SKIP_TESTS: ${{ inputs['skip-tests'] }}
          ENABLE_BUILD_SBOM: ${{ inputs['enable-build-sbom'] }}
          # renovate: datasource=maven depName=org.cyclonedx:cyclonedx-gradle-plugin registryUrl=https://plugins.gradle.org/m2/
          CYCLONEDX_GRADLE_VERSION: "3.5.1"
        run: forge-ci build gradle-android run --enforce-application-tests="$ADMIN_APPLICATION_TESTS"
      - &android-export-android-library-publications
        name: Export Android library publications
        if: ${{ inputs.library && inputs['publication-artifact-name'] != '' }}
        working-directory: ${{ inputs['working-directory'] }}
        env:
          VERSION: ${{ inputs.version }}
          SNAPSHOT_PUBLICATION: ${{ inputs['snapshot-publication'] }}
          CENTRAL_PUBLICATION: ${{ inputs['central-publication'] }}
          BUILD_MODULE: ${{ inputs['build-module'] }}
        run: forge-ci build gradle export-publications --project "$BUILD_MODULE" --output .forge-ci/maven-publication --snapshot="$SNAPSHOT_PUBLICATION" --central="$CENTRAL_PUBLICATION"
      - &android-upload-android-library-publications
        name: Upload Android library publications
        if: ${{ inputs.library && inputs['publication-artifact-name'] != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs['publication-artifact-name'] }}
          path: ${{ inputs['working-directory'] }}/.forge-ci/maven-publication/
          include-hidden-files: true
          if-no-files-found: error
      - &android-upload-library-aar
        name: Upload library AAR
        if: ${{ inputs.library }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build.outputs.aar-name }}
          path: ${{ inputs['working-directory'] }}/${{ inputs['build-module'] }}/build/outputs/aar/*.aar
          if-no-files-found: error
      - &android-upload-build-sbom
        name: Upload Build SBOM
        if: ${{ inputs['enable-build-sbom'] }}
        # Variant-scoped name (from generate-artifact-names.sh) so matrix
        # dispatch in release-build-stage.yml doesn't collide when multiple
        # flavors/modules build in parallel. Distinct from APK/AAB names so
        # the SBOM survives independently of app uploads.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build.outputs.sbom-name }}
          path: |
            ${{ inputs['working-directory'] }}/build/reports/bom.json
            ${{ inputs['working-directory'] }}/**/build/reports/bom.json
            ${{ inputs['working-directory'] }}/build/reports/cyclonedx/bom.json
            ${{ inputs['working-directory'] }}/**/build/reports/cyclonedx/bom.json
          retention-days: "7"
          if-no-files-found: error
      - &android-list-built-artifacts
        name: List built artifacts
        if: ${{ !inputs.library }}
        working-directory: ${{ inputs['working-directory'] }}
        env:
          BUILD_MODULE: ${{ inputs['build-module'] }}
        run: forge-ci build gradle-android list-artifacts
      - &android-upload-debug-apk
        name: Upload Debug APK
        if: ${{ !inputs.library && contains(inputs['build-types'], 'debug') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build.outputs.debug-name }}
          path: |
            ${{ inputs['working-directory'] }}/${{ inputs['build-module'] }}/build/outputs/apk/**/debug/*.apk
          retention-days: "7"
          if-no-files-found: warn
      - &android-upload-release-apk
        name: Upload Release APK
        if: ${{ !inputs.library && contains(inputs['build-types'], 'release') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build.outputs.release-name }}
          path: |
            ${{ inputs['working-directory'] }}/${{ inputs['build-module'] }}/build/outputs/apk/**/release/*.apk
          retention-days: "7"
          if-no-files-found: warn
      - &android-upload-aab
        name: Upload AAB
        if: ${{ !inputs.library && inputs['include-aab'] && contains(inputs['build-types'], 'release') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build.outputs.aab-name }}
          path: |
            ${{ inputs['working-directory'] }}/${{ inputs['build-module'] }}/build/outputs/bundle/**/*.aab
          retention-days: "7"
          if-no-files-found: error
      - &android-generate-build-summary
        name: Generate build summary
        env:
          ANDROID_LIBRARY: ${{ inputs.library }}
          AAR_NAME: ${{ steps.build.outputs.aar-name }}
          BUILD_MODULE: ${{ inputs['build-module'] }}
          FLAVOR: ${{ inputs['product-flavor'] }}
          BUILD_TYPES: ${{ inputs['build-types'] }}
          INCLUDE_AAB: ${{ inputs['include-aab'] }}
          SIGNING: ${{ inputs['enable-signing'] }}
          SKIP_TESTS: ${{ inputs['skip-tests'] }}
          VERSION: ${{ steps.build.outputs.version }}
          VERSION_CODE: ${{ steps.build.outputs.version-code }}
          DEBUG_NAME: ${{ steps.build.outputs.debug-name }}
          RELEASE_NAME: ${{ steps.build.outputs.release-name }}
          AAB_NAME: ${{ steps.build.outputs.aab-name }}
          JAVA_VERSION: "25"
          JDK_DIST: "Temurin"
        run: forge-ci report build android
  build-variants-signed:
    needs: [resolve-bootstrap]
    if: ${{ !inputs.library && inputs['enable-signing'] }}
    name: Build Gradle Android (signed)
    # Holds the signing credentials: the hosted runner, never the caller's.
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    container:
      image: ${{ inputs['runtime-image'] }}
    permissions:
      contents: read
    outputs:
      aar-name: ${{ steps.build.outputs.aar-name }}
      debug-name: ${{ steps.build.outputs.debug-name }}
      release-name: ${{ steps.build.outputs.release-name }}
      aab-name: ${{ steps.build.outputs.aab-name }}
      sbom-name: ${{ steps.build.outputs.sbom-name }}
    steps:
      - *android-guard-working-directory-stays-inside-the-workspace
      - *android-refuse-pr-context-trigger-publish-release-secrets-in-scope
      - *android-checkout-repository
      - *android-validate-publication-export-before-building
      - *android-locate-the-gradle-home
      - *android-cache-gradle
      - name: Build Android project
        id: build
        # One step owns the whole build sequence (artifact-names → keystore →
        # metadata → tasks → secrets.properties → build → SBOM → status); the
        # binary threads the keystore path + tasks internally and branches on
        # --enable-signing, so the same `build gradle-android run` runs on
        # GitLab. Signing passwords stay env vars the gradle build reads; only
        # platform-transport (checkout, cache, upload) wraps it.
        working-directory: ${{ inputs['working-directory'] }}
        env:
          ADMIN_APPLICATION_TESTS: ${{ inputs['enforce-application-tests'] }}
          INCLUDE_DATE_STAMP: ${{ inputs['include-date-stamp'] }}
          ANDROID_LIBRARY: ${{ inputs.library }}
          ARTIFACT_NAME_PREFIX: ${{ inputs['artifact-name-prefix'] }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          PRODUCT_FLAVOR: ${{ inputs['product-flavor'] }}
          ARTIFACT_NAME: ${{ inputs['artifact-name'] }}
          ENABLE_SIGNING: "true"
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE }}
          SECRETS_PROPERTIES_BASE64: ${{ secrets.SECRETS_PROPERTIES_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GRADLE_TASKS_OVERRIDE: ${{ inputs['gradle-tasks'] }}
          BUILD_TYPES: ${{ inputs['build-types'] }}
          INCLUDE_AAB: ${{ inputs['include-aab'] }}
          BUILD_MODULE: ${{ inputs['build-module'] }}
          SKIP_TESTS: ${{ inputs['skip-tests'] }}
          ENABLE_BUILD_SBOM: ${{ inputs['enable-build-sbom'] }}
          # renovate: datasource=maven depName=org.cyclonedx:cyclonedx-gradle-plugin registryUrl=https://plugins.gradle.org/m2/
          CYCLONEDX_GRADLE_VERSION: "3.5.1"
        run: forge-ci build gradle-android run --enforce-application-tests="$ADMIN_APPLICATION_TESTS"
      - *android-export-android-library-publications
      - *android-upload-android-library-publications
      - *android-upload-library-aar
      - *android-upload-build-sbom
      - *android-list-built-artifacts
      - *android-upload-debug-apk
      - *android-upload-release-apk
      - *android-upload-aab
      - *android-generate-build-summary
