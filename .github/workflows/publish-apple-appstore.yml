# Apple App Store / TestFlight Publisher
#
# Purpose: Publishes iOS applications to Apple App Store Connect (TestFlight) using
# the App Store Connect API.
#
# How it works:
# 1. Downloads IPA artifact from previous build job
# 2. Sets up App Store Connect API authentication
# 3. Validates IPA file
# 4. Uploads to App Store Connect (TestFlight)
# 5. Records external testing/review intent; manual submission happens in App Store Connect
#
# Features:
#   - TestFlight distribution
#   - App Store Connect API v2 authentication
#   - IPA validation before upload
#   - Configurable submission options
#   - Detailed upload reporting
#
# Outputs:
#   - Upload status and build information
#   - TestFlight availability notifications
#
# Required Secrets:
#   APP_STORE_CONNECT_ISSUER_ID: App Store Connect API issuer ID
#   APP_STORE_CONNECT_API_KEY_ID: App Store Connect API key ID
#   APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: Base64-encoded API private key (.p8)
#
# Required Permissions:
#   actions: read   # Download workflow artifacts
#   contents: read  # Checkout source
#
name: Publish Apple App Store
on:
  workflow_call:
    inputs:
      # === IPA SOURCE ===
      ipa-artifact-name:
        description: "Name of artifact containing IPA file"
        required: true
        type: string
      enabled:
        description: "Run App Store Connect upload. The release orchestrator disables this for unsigned Xcode builds."
        required: false
        default: true
        type: boolean
      branch:
        description: "Explicit branch, tag, or SHA whose application is published"
        required: true
        type: string
      # === APP STORE CONFIGURATION ===
      platform:
        description: "Platform (ios, macos, tvos)"
        required: false
        default: "ios"
        type: string
      # === SUBMISSION OPTIONS ===
      submit-for-review:
        description: "Record App Store review intent in the upload summary. Automatic review submission is not implemented."
        required: false
        default: false
        type: boolean
      skip-validation:
        description: "Skip IPA validation before upload"
        required: false
        default: false
        type: boolean
      # === SYSTEM ===
      forge-ci-binary-ref:
        description: "Full approved engine commit; the macOS job builds forge-ci from the engine checkout at it (canonical delivery serves Linux only). The release route passes its own."
        required: true
        type: string
    # All `required: false` — `secrets: inherit` callers unchanged.
    secrets:
      APP_STORE_CONNECT_API_KEY_ID:
        description: "App Store Connect API key ID (10-char alphanumeric)"
        required: false
      APP_STORE_CONNECT_ISSUER_ID:
        description: "App Store Connect API issuer ID (UUID)"
        required: false
      APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64:
        description: "Base64-encoded App Store Connect API .p8 private key"
        required: false
permissions:
  contents: read
jobs:
  resolve-bootstrap:
    permissions:
      contents: read
    uses: ./.github/workflows/resolve-forge-ci-bootstrap.yml
    with:
      forge-ci-binary-ref: ${{ inputs['forge-ci-binary-ref'] }}
  publish:
    needs: [resolve-bootstrap]
    name: Publish to App Store Connect
    if: ${{ inputs.enabled }}
    # Publication stays on the GitHub-hosted runner; docs/runners.md says why.
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1
      # macOS: canonical delivery builds Linux files only, so this lane builds
      # forge-ci from the approved engine commit with the engine's own darwin
      # build action, run from that same checkout.
      - name: Checkout the approved engine
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ needs.resolve-bootstrap.outputs.forge-ci-repository }}
          ref: ${{ inputs['forge-ci-binary-ref'] }}
          path: _forge_ci_engine
          persist-credentials: false
      - name: Build forge-ci for macOS from the approved engine
        uses: ./_forge_ci_engine/.github/actions/build-darwin-cli
        with:
          engine-commit: ${{ inputs['forge-ci-binary-ref'] }}

      # Defense-in-depth: refuse PR-context triggers — App Store Connect
      # credentials in env this job uses must never run with PR-HEAD code.
      - name: Refuse PR-context trigger (publish/release secrets in scope)
        run: forge-ci validate event-context

      - name: Download IPA artifact
        env:
          GH_TOKEN: ${{ github.token }}
          DOWNLOAD_NAME: ${{ inputs['ipa-artifact-name'] }}
        run: forge-ci artifact download --name "$DOWNLOAD_NAME" --dir artifacts/

      - name: Find IPA file
        id: find-ipa
        run: forge-ci publish appstore find-ipa

      - name: Setup App Store Connect API
        env:
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: forge-ci publish appstore prepare-credentials

      - name: Validate IPA
        if: ${{ !inputs['skip-validation'] }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          IPA_FILE: ${{ steps.find-ipa.outputs.ipa-file }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          printf "Validating IPA...\n"

          xcrun altool \
            --validate-app \
            --file "$IPA_FILE" \
            --type "$PLATFORM" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --output-format json

          printf "✓ IPA validation passed\n"

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          IPA_FILE: ${{ steps.find-ipa.outputs.ipa-file }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -eo pipefail

          printf "Uploading IPA to App Store Connect...\n"

          xcrun altool \
            --output-format json \
            --upload-app \
            --file "$IPA_FILE" \
            --type "$PLATFORM" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
          | tee upload-result.json

          printf "✓ Upload successful\n"

      - name: Parse upload results
        id: upload-info
        run: forge-ci publish appstore parse-upload-result

      - name: Generate upload summary
        env:
          IPA_FILE: ${{ steps.find-ipa.outputs.ipa-file }}
          PLATFORM: ${{ inputs.platform }}
          SKIP_VALIDATION: ${{ inputs['skip-validation'] }}
          SUBMIT_REVIEW: ${{ inputs['submit-for-review'] }}
          REQUEST_ID: ${{ steps.upload-info.outputs.request-id }}
        run: forge-ci report publish appstore

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appstore-upload-result
          path: upload-result.json
          retention-days: "30"
          if-no-files-found: warn
