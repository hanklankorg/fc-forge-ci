#
# Gradle JVM Builder
#
# Purpose: Builds Gradle JVM projects — libraries, applications, plugins —
# and uploads their JAR artifacts for subsequent publishing steps (Maven
# Central, container images, etc.).
#
# Android builds are handled by build-gradle-android.yml, which supports
# product flavors, AABs, Google Play artifact naming, and signing. This
# workflow is intentionally Android-free: no Android SDK setup, no APK/AAB
# globbing, no keystore decoding. Routing from artifacts.yml is by
# `project-type: gradle` (here) vs `project-type: gradle-android` (there).
#
# Build Process:
#   1. Set up JDK
#   2. Run the requested Gradle tasks
#   3. Generate a CycloneDX Build SBOM
#   4. Upload JAR artifacts and the build SBOM
#
# Required Permissions:
#   contents: read  # Checkout code
#
name: Build Gradle
on:
  workflow_call:
    inputs:
      enforce-application-tests:
        description: "Enforcement setting: false reports recognized test assertion failures without failing; the tests still run. Set it only in the administrator's entry point, since whoever writes this call can pass it; it is the administrator's only where that file is. See docs/admin-policy.md."
        type: boolean
        required: false
        default: false
      working-directory:
        description: "Working directory"
        required: false
        default: "."
        type: string
      private-dependencies:
        description: "Allow Gradle to read DEPENDENCY_TOKEN/DEPENDENCY_USERNAME; no daemon, no fork pull requests."
        required: false
        default: false
        type: boolean
      gradle-tasks:
        description: "Gradle tasks to run"
        required: false
        default: "test assemble"
        type: string
      skip-tests:
        description: "Legacy input; true is refused. Admin policy controls findings, and tests still run."
        required: false
        default: false
        type: boolean
      branch:
        description: "Branch, tag, or SHA to checkout. Empty uses the triggering ref."
        required: false
        default: ""
        type: string
      artifact-name:
        description: "Logical artifact name for upload naming (defaults to 'gradle-build-artifacts' when empty)"
        required: false
        default: ""
        type: string
      publication-artifact-name:
        description: "When nonempty, export JVM Maven publications into this separate workflow artifact."
        required: false
        default: ""
        type: string
      version:
        description: "Expected immutable publication version; required when exporting publications."
        required: false
        default: ""
        type: string
      central-publication:
        description: "Require Central publication metadata, sources and javadoc during export."
        required: false
        default: false
        type: boolean
      snapshot-publication:
        description: "Export resolved Maven snapshots instead of an immutable release."
        required: false
        default: false
        type: boolean
      enable-build-sbom:
        description: "Run the cyclonedx plugin step (false skips Build SBOM generation entirely; derived from per-artefact 'sboms' when called from release-build-stage)"
        required: false
        default: true
        type: boolean
      runtime-image:
        description: "forge-ci runtime image carrying JDK + Gradle., pinned by digest (image@sha256:<64 hex>); the resolver refuses anything else before the job container starts."
        required: true
        type: string
      runs-on:
        description: "JSON array of runner labels for the ordinary jobs, read with fromJSON. Signing, promotion and publication jobs stay on GitHub-hosted runners."
        required: false
        default: '["ubuntu-26.04"]'
        type: string
      forge-ci-binary-ref:
        description: "Full engine commit (40 hex) the workflow ref names; a tag or branch is refused"
        required: true
        type: string
permissions:
  contents: read
jobs:
  resolve-bootstrap:
    permissions:
      contents: read
    uses: ./.github/workflows/resolve-forge-ci-bootstrap.yml
    with:
      forge-ci-binary-ref: ${{ inputs['forge-ci-binary-ref'] }}
      images: |
        runtime-image=${{ inputs['runtime-image'] }}
  build-gradle:
    needs: [resolve-bootstrap]
    name: Build Gradle Project
    runs-on: ${{ fromJSON(inputs['runs-on']) }}
    timeout-minutes: 15
    container:
      image: ${{ inputs['runtime-image'] }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Refuse private dependency access from fork pull requests
        if: ${{ inputs['private-dependencies'] && startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository }}
        run: forge-ci validate event-context
      - name: Guard working-directory stays inside the workspace
        # Every upload below is rooted at this caller-supplied value. An
        # absolute path or a parent step would take the artifact from outside
        # the workspace, so it is refused here, before any step consumes it.
        env:
          WORKING_DIRECTORY: ${{ inputs['working-directory'] }}
        run: |
          case "$WORKING_DIRECTORY" in
            "") echo "working-directory must not be empty" >&2; exit 1 ;;
            /*) echo "working-directory must be workspace-relative: $WORKING_DIRECTORY" >&2; exit 1 ;;
          esac
          case "/$WORKING_DIRECTORY/" in
            */../*) echo "working-directory must not contain parent-directory steps: $WORKING_DIRECTORY" >&2; exit 1 ;;
          esac
      - name: Checkout repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECKOUT_REF: ${{ inputs.branch }}
          CHECKOUT_FETCH_ALL_REFS: "true"
        run: forge-ci platform checkout
      - name: Validate publication inputs before build
        if: ${{ inputs['publication-artifact-name'] != '' }}
        working-directory: ${{ inputs['working-directory'] }}
        env:
          VERSION: ${{ inputs.version }}
          SNAPSHOT_PUBLICATION: ${{ inputs['snapshot-publication'] }}
        run: forge-ci build gradle export-publications --output .forge-ci/maven-publication --validate-only --snapshot="$SNAPSHOT_PUBLICATION"
      # The image decides where Gradle keeps its caches; an image older or
      # newer than this workflow then still restores them.
      - name: Locate the Gradle home
        id: gradle-home
        run: printf 'path=%s\n' "${GRADLE_USER_HOME:-$HOME/.gradle}" >>"$GITHUB_OUTPUT"
      - name: Cache Gradle
        if: ${{ !inputs['private-dependencies'] }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ steps.gradle-home.outputs.path }}/caches
            ${{ steps.gradle-home.outputs.path }}/wrapper
          key: gradle-${{ hashFiles(format('{0}/gradle/wrapper/gradle-wrapper.properties', inputs['working-directory']), format('{0}/**/*.gradle*', inputs['working-directory']), format('{0}/**/gradle.properties', inputs['working-directory'])) }}
          restore-keys: gradle-
      - name: Build Gradle project
        # One step owns the whole build sequence (gradlew chmod → metadata →
        # tasks → SBOM → summaries); the binary threads metadata internally, so
        # the same `build gradle run` runs identically on GitLab. The per-step
        # variations (tasks, SBOM plugin version, skip-tests) are configuration
        # here. gradle runs in this step's working-directory; only checkout,
        # cache, and upload wrap it.
        working-directory: ${{ inputs['working-directory'] }}
        env:
          ADMIN_APPLICATION_TESTS: ${{ inputs['enforce-application-tests'] }}
          GRADLE_TASKS: ${{ inputs['gradle-tasks'] }}
          SKIP_TESTS: ${{ inputs['skip-tests'] }}
          ENABLE_BUILD_SBOM: ${{ inputs['enable-build-sbom'] }}
          JAVA_VERSION: "25"
          PRIVATE_DEPENDENCIES: ${{ inputs['private-dependencies'] }}
          DEPENDENCY_USERNAME: ${{ github.actor }}
          DEPENDENCY_TOKEN: ${{ inputs['private-dependencies'] && github.token || '' }}
          # renovate: datasource=maven depName=org.cyclonedx:cyclonedx-gradle-plugin registryUrl=https://plugins.gradle.org/m2/
          CYCLONEDX_GRADLE_VERSION: "3.5.1"
        run: forge-ci build gradle run --enforce-application-tests="$ADMIN_APPLICATION_TESTS"
      - name: Export Maven publications without release credentials
        if: ${{ inputs['publication-artifact-name'] != '' }}
        working-directory: ${{ inputs['working-directory'] }}
        env:
          VERSION: ${{ inputs.version }}
          CENTRAL_PUBLICATION: ${{ inputs['central-publication'] }}
          SNAPSHOT_PUBLICATION: ${{ inputs['snapshot-publication'] }}
          PRIVATE_DEPENDENCIES: ${{ inputs['private-dependencies'] }}
          DEPENDENCY_USERNAME: ${{ github.actor }}
          DEPENDENCY_TOKEN: ${{ inputs['private-dependencies'] && github.token || '' }}
        run: forge-ci build gradle export-publications --output .forge-ci/maven-publication --central="$CENTRAL_PUBLICATION" --snapshot="$SNAPSHOT_PUBLICATION"
      - name: Upload Maven publications
        if: ${{ inputs['publication-artifact-name'] != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs['publication-artifact-name'] }}
          path: ${{ inputs['working-directory'] }}/.forge-ci/maven-publication/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload Gradle artifacts
        # Root and subproject JARs. Single-module projects put jars under
        # `build/libs/`; multi-module projects put them under
        # `<subproject>/build/libs/`. Both globs cover the common layouts.
        # `buildSrc` builds the build itself and is no module of the
        # product, so its jar is left out, as the snapshot leaves it out.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs['artifact-name'] && format('{0}-build-artifacts', inputs['artifact-name']) || 'gradle-build-artifacts' }}
          path: |
            ${{ inputs['working-directory'] }}/build/libs/*.jar
            ${{ inputs['working-directory'] }}/**/build/libs/*.jar
            !${{ inputs['working-directory'] }}/**/buildSrc/**
          retention-days: "7"
          if-no-files-found: error
      # SBOM artifact is paired with the build artifact name so parallel
      # matrix uploads (release-build-stage dispatches build-gradle per
      # artifact) don't collide on a single fixed SBOM name. Default falls
      # back to `gradle-build-sbom` when `artifact-name` is not overridden.
      # cyclonedx-gradle-plugin 3.x writes to build/reports/cyclonedx/bom.json;
      # build/reports/bom.json is retained for older plugin versions.
      - name: Upload Gradle Build SBOM
        if: ${{ inputs['enable-build-sbom'] }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs['artifact-name'] && format('{0}-build-sbom', inputs['artifact-name']) || 'gradle-build-sbom' }}
          path: |
            ${{ inputs['working-directory'] }}/build/reports/bom.json
            ${{ inputs['working-directory'] }}/**/build/reports/bom.json
            ${{ inputs['working-directory'] }}/build/reports/cyclonedx/bom.json
            ${{ inputs['working-directory'] }}/**/build/reports/cyclonedx/bom.json
          retention-days: "7"
          if-no-files-found: error
