name: Release Build Stage
on:
  workflow_call: # yamllint disable-line rule:truthy
    inputs:
      go-test-selections-json:
        description: "Administrator-owned JSON object mapping artifact names to native Go selections. Do not derive from the consumer build plan. See docs/admin-policy.md."
        type: string
        required: false
        default: ""
      cargo-test-selections-json:
        description: "Administrator-owned JSON object mapping artifact names to finite native Cargo selections. Do not derive from the consumer build plan. See docs/admin-policy.md."
        type: string
        required: false
        default: ""
      enforce-application-tests:
        description: "Enforcement setting: false reports recognized test assertion failures without failing; the tests still run. Set it only in the administrator's entry point, since whoever writes this call can pass it; it is the administrator's only where that file is. See docs/admin-policy.md."
        type: boolean
        required: false
        default: false
      branch:
        required: true
        type: string
      release-tag:
        required: true
        type: string
      release-sha:
        required: true
        type: string
      source-date-epoch:
        required: true
        type: string
      build-stage-plan-json:
        required: true
        type: string
      runs-on:
        description: "JSON array of runner labels for the ordinary jobs, read with fromJSON. Signing, promotion and publication jobs stay on GitHub-hosted runners."
        required: false
        default: '["ubuntu-26.04"]'
        type: string
      runs-on-darwin-arm64:
        description: "JSON array of runner labels for the macOS arm64 jobs, read with fromJSON."
        required: false
        default: '["macos-26"]'
        type: string
      xcode-build-number:
        description: "Build number of the Xcode builds, in place of config.build-number of the declaration."
        required: false
        default: ""
        type: string
      forge-ci-binary-ref:
        required: true
        type: string
      runtime-image:
        description: "forge-ci runtime image for the summarize job (base is sufficient)"
        required: true
        type: string
      runtime-image-java:
        description: "forge-ci runtime image for Maven/Gradle jobs"
        required: false
        default: ""
        type: string
      runtime-image-node:
        description: "forge-ci runtime image for NPM jobs"
        required: false
        default: ""
        type: string
      runtime-image-go:
        description: "forge-ci runtime image for Go jobs"
        required: false
        default: ""
        type: string
      runtime-image-android:
        description: "forge-ci runtime image for Gradle Android jobs"
        required: false
        default: ""
        type: string
      runtime-image-rust:
        description: "forge-ci runtime image for Cargo jobs"
        required: false
        default: ""
        type: string
    # Aggregator: forwards to build-{maven,npm,gradle-app,gradle-android,
    # go,xcode-ios}.yml. The Android + iOS leaves are the only ones with
    # specific secrets; the others use only the auto-provided GITHUB_TOKEN.
    secrets:
      ANDROID_KEYSTORE:
        description: "Base64-encoded Android signing keystore (.jks/.keystore)"
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        description: "Password for ANDROID_KEYSTORE"
        required: false
      ANDROID_KEY_ALIAS:
        description: "Alias of the signing key inside ANDROID_KEYSTORE"
        required: false
      ANDROID_KEY_PASSWORD:
        description: "Password for the key referenced by ANDROID_KEY_ALIAS"
        required: false
      SECRETS_PROPERTIES_BASE64:
        description: "Base64-encoded Android secrets.properties"
        required: false
      IOS_SIGNING_CERTIFICATE_BASE64:
        description: "Base64-encoded .p12 code-signing certificate"
        required: false
      IOS_SIGNING_CERTIFICATE_PASSPHRASE:
        description: "Passphrase for IOS_SIGNING_CERTIFICATE_BASE64"
        required: false
      PROVISIONING_PROFILE_BASE64:
        description: "Base64-encoded provisioning profile (.mobileprovision)"
        required: false
      XCCONFIG_BASE64:
        description: "Base64-encoded xcconfig file"
        required: false
    outputs:
      stage-ran:
        description: Build stage ran at least one ecosystem path
        value: ${{ jobs.summarize-build-stage.outputs.stage-ran }}
      stage-result:
        description: Normalized build stage result
        value: ${{ jobs.summarize-build-stage.outputs.stage-result }}
      result-json:
        description: Build stage result payload
        value: ${{ jobs.summarize-build-stage.outputs.result-json }}
permissions:
  contents: read
jobs:
  resolve-bootstrap:
    permissions:
      contents: read
    uses: ./.github/workflows/resolve-forge-ci-bootstrap.yml
    with:
      forge-ci-binary-ref: ${{ inputs['forge-ci-binary-ref'] }}
      images: |
        runtime-image=${{ inputs['runtime-image'] }}
  validate-test-selections:
    needs: [resolve-bootstrap]
    runs-on: ${{ fromJSON(inputs['runs-on']) }}
    container:
      image: ${{ inputs['runtime-image'] }}
    permissions:
      contents: read
    outputs:
      go-test-selections-json: ${{ steps.validate.outputs.go-test-selections-json }}
      cargo-test-selections-json: ${{ steps.validate.outputs.cargo-test-selections-json }}
    steps:
      - name: Validate whole administrator selections before build fanout
        id: validate
        env:
          BUILD_STAGE_PLAN_JSON: ${{ inputs['build-stage-plan-json'] }}
          ADMIN_GO_SELECTIONS_JSON: ${{ inputs['go-test-selections-json'] }}
          ADMIN_CARGO_SELECTIONS_JSON: ${{ inputs['cargo-test-selections-json'] }}
        run: |
          forge-ci plan validate-test-selections \
            --build-stage-plan-json="$BUILD_STAGE_PLAN_JSON" \
            --go-test-selections-json="$ADMIN_GO_SELECTIONS_JSON" \
            --cargo-test-selections-json="$ADMIN_CARGO_SELECTIONS_JSON"
  maven:
    needs: [resolve-bootstrap, validate-test-selections]
    name: "Build: ${{ matrix.artifact.name }} (Maven)"
    if: ${{ fromJson(inputs['build-stage-plan-json']).targets.maven.runs }}
    strategy:
      matrix:
        artifact: ${{ fromJson(inputs['build-stage-plan-json']).targets.maven.items }}
      fail-fast: false
    permissions:
      contents: read
      packages: read
    # build-maven uses only auto-provided GITHUB_TOKEN.
    uses: ./.github/workflows/build-maven.yml
    with:
      runs-on: ${{ inputs['runs-on'] }}
      enforce-application-tests: ${{ inputs['enforce-application-tests'] }}
      forge-ci-binary-ref: ${{ inputs['forge-ci-binary-ref'] }}
      working-directory: ${{ matrix.artifact.working_directory }}
      private-dependencies: ${{ matrix.artifact.maven.private_dependencies || false }}
      settings-path: ${{ matrix.artifact.maven.settings_path || '' }}
      branch: ${{ inputs.branch }}
      build-type: ${{ matrix.artifact.build_type == 'library' && 'lib' || 'app' }}
      profile: ${{ matrix.artifact.build_type == 'library' && (matrix.artifact.maven.maven_profile || 'central-release') || '' }}
      artifact-name: ${{ matrix.artifact.name }}
      enable-build-sbom: ${{ contains(matrix.artifact.effective_sboms, 'build') }}
      runtime-image: ${{ inputs['runtime-image-java'] }}
  npm:
    needs: [resolve-bootstrap, validate-test-selections]
    name: "Build: ${{ matrix.artifact.name }} (npm)"
    if: ${{ fromJson(inputs['build-stage-plan-json']).targets.npm.runs }}
    strategy:
      matrix:
        artifact: ${{ fromJson(inputs['build-stage-plan-json']).targets.npm.items }}
      fail-fast: false
    permissions:
      contents: read
      packages: read
    # build-npm uses only auto-provided GITHUB_TOKEN.
    uses: ./.github/workflows/build-npm.yml
    with:
      runs-on: ${{ inputs['runs-on'] }}
      enforce-application-tests: ${{ inputs['enforce-application-tests'] }}
      forge-ci-binary-ref: ${{ inputs['forge-ci-binary-ref'] }}
      working-directory: ${{ matrix.artifact.working_directory }}
      private-dependencies: ${{ matrix.artifact.npm.private_dependencies || false }}
      dependency-registry: ${{ matrix.artifact.npm.dependency_registry || '' }}
      branch: ${{ inputs.branch }}
      artifact-name: ${{ matrix.artifact.name }}
      enable-build-sbom: ${{ contains(matrix.artifact.effective_sboms, 'build') }}
      runtime-image: ${{ inputs['runtime-image-node'] }}
      node-version: ${{ matrix.artifact.npm.node_version || '' }}
      expect-version: ${{ inputs['release-tag'] }}
  gradle:
    needs: [resolve-bootstrap, validate-test-selections]
    name: "Build: ${{ matrix.artifact.name }} (Gradle)"
    if: ${{ fromJson(inputs['build-stage-plan-json']).targets.gradle.runs }}
    strategy:
      matrix:
        artifact: ${{ fromJson(inputs['build-stage-plan-json']).targets.gradle.items }}
      fail-fast: false
    permissions:
      contents: read
      packages: read
    # build-gradle-app uses only auto-provided GITHUB_TOKEN.
    uses: ./.github/workflows/build-gradle-app.yml
    with:
      runs-on: ${{ inputs['runs-on'] }}
      enforce-application-tests: ${{ inputs['enforce-application-tests'] }}
      forge-ci-binary-ref: ${{ inputs['forge-ci-binary-ref'] }}
      working-directory: ${{ matrix.artifact.working_directory }}
      private-dependencies: ${{ matrix.artifact.gradle.private_dependencies || false }}
      branch: ${{ inputs.branch }}
      artifact-name: ${{ matrix.artifact.name }}
      publication-artifact-name: ${{ matrix.artifact.publication_artifact_name || '' }}
      version: ${{ inputs['release-tag'] }}
      central-publication: ${{ contains(matrix.artifact.publish_to, 'maven-central') }}
      gradle-tasks: ${{ matrix.artifact.gradle.gradle_tasks }}
      enable-build-sbom: ${{ contains(matrix.artifact.effective_sboms, 'build') }}
      runtime-image: ${{ inputs['runtime-image-java'] }}
  go:
    needs: [resolve-bootstrap, validate-test-selections]
    name: "Build: ${{ matrix.artifact.name }} (Go)"
    if: ${{ fromJson(inputs['build-stage-plan-json']).targets.go.runs }}
    strategy:
      matrix:
        artifact: ${{ fromJson(inputs['build-stage-plan-json']).targets.go.items }}
      fail-fast: false
    permissions:
      contents: read
    # build-go uses only auto-provided GITHUB_TOKEN.
    uses: ./.github/workflows/build-go.yml
    with:
      runs-on: ${{ inputs['runs-on'] }}
      test-selection-json: ${{ needs.validate-test-selections.outputs.go-test-selections-json != '{}' && toJson(fromJson(needs.validate-test-selections.outputs.go-test-selections-json)[matrix.artifact.name]) || '' }}
      enforce-application-tests: ${{ inputs['enforce-application-tests'] }}
      forge-ci-binary-ref: ${{ inputs['forge-ci-binary-ref'] }}
      working-directory: ${{ matrix.artifact.working_directory }}
      branch: ${{ inputs.branch }}
      artifact-name: ${{ matrix.artifact.name }}
      version: ${{ inputs['release-tag'] }}
      commit: ${{ inputs['release-sha'] }}
      source-date-epoch: ${{ inputs['source-date-epoch'] }}
      main-package: ${{ matrix.artifact.go.main_package || '.' }}
      binary-name: ${{ matrix.artifact.go.binary_name || '' }}
      platforms: ${{ matrix.artifact.go.platforms || 'linux/amd64,linux/arm64,darwin/amd64,darwin/arm64' }}
      build-tags: ${{ matrix.artifact.go.build_tags || '' }}
      ldflags: ${{ matrix.artifact.go.ldflags || '' }}
      skip-tests: ${{ matrix.artifact.go.skip_tests || false }}
      enable-build-sbom: ${{ contains(matrix.artifact.effective_sboms, 'build') }}
      runtime-image: ${{ inputs['runtime-image-go'] }}
  cargo:
    needs: [resolve-bootstrap, validate-test-selections]
    name: "Build: ${{ matrix.artifact.name }} (Cargo)"
    if: ${{ fromJson(inputs['build-stage-plan-json']).targets.cargo.runs }}
    strategy:
      matrix:
        artifact: ${{ fromJson(inputs['build-stage-plan-json']).targets.cargo.items }}
      fail-fast: false
    permissions:
      contents: read
    # build-cargo uses only auto-provided GITHUB_TOKEN.
    uses: ./.github/workflows/build-cargo.yml
    with:
      runs-on: ${{ inputs['runs-on'] }}
      test-selection-json: ${{ needs.validate-test-selections.outputs.cargo-test-selections-json != '{}' && toJson(fromJson(needs.validate-test-selections.outputs.cargo-test-selections-json)[matrix.artifact.name]) || '' }}
      enforce-application-tests: ${{ inputs['enforce-application-tests'] }}
      forge-ci-binary-ref: ${{ inputs['forge-ci-binary-ref'] }}
      working-directory: ${{ matrix.artifact.working_directory }}
      branch: ${{ inputs.branch }}
      artifact-name: ${{ matrix.artifact.name }}
      version: ${{ inputs['release-tag'] }}
      commit: ${{ inputs['release-sha'] }}
      source-date-epoch: ${{ inputs['source-date-epoch'] }}
      binary-name: ${{ matrix.artifact.cargo.binary_name || '' }}
      platforms: ${{ matrix.artifact.cargo.platforms || 'linux/amd64' }}
      skip-tests: ${{ matrix.artifact.cargo.skip_tests || false }}
      enable-build-sbom: ${{ contains(matrix.artifact.effective_sboms, 'build') }}
      runtime-image: ${{ inputs['runtime-image-rust'] }}
  gradle-android:
    needs: [resolve-bootstrap, validate-test-selections]
    name: "Build: ${{ matrix.artifact.name }} (Android)"
    if: ${{ fromJson(inputs['build-stage-plan-json']).targets.gradle_android.runs }}
    strategy:
      matrix:
        artifact: ${{ fromJson(inputs['build-stage-plan-json']).targets.gradle_android.items }}
      fail-fast: false
    permissions:
      contents: read
    secrets:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SECRETS_PROPERTIES_BASE64: ${{ secrets.SECRETS_PROPERTIES_BASE64 }}
    uses: ./.github/workflows/build-gradle-android.yml
    with:
      runs-on: ${{ inputs['runs-on'] }}
      enforce-application-tests: ${{ inputs['enforce-application-tests'] }}
      forge-ci-binary-ref: ${{ inputs['forge-ci-binary-ref'] }}
      library: ${{ matrix.artifact.build_type == 'library' }}
      publication-artifact-name: ${{ matrix.artifact.publication_artifact_name || '' }}
      version: ${{ inputs['release-tag'] }}
      central-publication: ${{ contains(matrix.artifact.publish_to, 'maven-central') }}
      working-directory: ${{ matrix.artifact.working_directory }}
      build-module: ${{ matrix.artifact.gradle_android.build_module }}
      branch: ${{ inputs.branch }}
      product-flavor: ${{ matrix.artifact.gradle_android.product_flavor || '' }}
      build-types: ${{ matrix.artifact.gradle_android.build_types || 'debug,release' }}
      include-aab: ${{ matrix.artifact.gradle_android.include_aab != false }}
      # Forward artifacts.yml `name:` as the upload identifier so the AAB
      # lands under the exact string release-publish-stage.yml forwards to
      # publish-google-play.yml as `aab-artifact-name`. Without this override
      # the build's date/prefix-derived name and publish's expected name
      # diverge and the download step fails. Direct callers leave it empty
      # and get derived naming.
      artifact-name: ${{ matrix.artifact.name }}
      enable-signing: ${{ matrix.artifact.gradle_android.enable_android_signing || false }}
      enable-build-sbom: ${{ contains(matrix.artifact.effective_sboms, 'build') }}
      runtime-image: ${{ inputs['runtime-image-android'] }}
  xcode-ios:
    needs: [resolve-bootstrap, validate-test-selections]
    name: "Build: ${{ matrix.artifact.name }} (Xcode)"
    if: ${{ fromJson(inputs['build-stage-plan-json']).targets.xcode_ios.runs }}
    strategy:
      matrix:
        artifact: ${{ fromJson(inputs['build-stage-plan-json']).targets.xcode_ios.items }}
      fail-fast: false
    permissions:
      contents: read
    secrets:
      IOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.IOS_SIGNING_CERTIFICATE_BASE64 }}
      IOS_SIGNING_CERTIFICATE_PASSPHRASE: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSPHRASE }}
      PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
      XCCONFIG_BASE64: ${{ secrets.XCCONFIG_BASE64 }}
    uses: ./.github/workflows/build-xcode-ios.yml
    with:
      runs-on-darwin-arm64: ${{ inputs['runs-on-darwin-arm64'] }}
      xcode-version: ${{ matrix.artifact.xcode_ios.xcode_version }}
      scheme: ${{ matrix.artifact.xcode_ios.scheme }}
      workspace: ${{ matrix.artifact.xcode_ios.workspace }}
      project: ${{ matrix.artifact.xcode_ios.project }}
      branch: ${{ inputs.branch }}
      configuration: ${{ matrix.artifact.xcode_ios.configuration || 'Release' }}
      enable-code-signing: ${{ matrix.artifact.xcode_ios.enable_code_signing != false }}
      export-options-var: ${{ matrix.artifact.xcode_ios.export_options_var || 'EXPORT_OPTIONS_BASE64' }}
      use-xcodegen: ${{ matrix.artifact.xcode_ios.use_xcodegen || false }}
      xcodegen-spec: ${{ matrix.artifact.xcode_ios.xcodegen_spec || 'project.yml' }}
      artifact-name: ${{ matrix.artifact.name }}
      include-tag: false
      build-number: ${{ inputs['xcode-build-number'] || matrix.artifact.xcode_ios.build_number }}
      working-directory: ${{ matrix.artifact.working_directory }}
      forge-ci-binary-ref: ${{ inputs['forge-ci-binary-ref'] }}
  # Container-first cargo and container-first Go produce nothing at the
  # build-stage level. Their manifest-derived Build SBOMs and actual
  # compiles (inside the Containerfile) both run in release-publish-stage,
  # alongside the container build. Pure container-first projects run zero
  # build jobs by design. Artifact-first cargo + go run here.
  summarize-build-stage:
    name: Summary
    needs: [resolve-bootstrap, validate-test-selections, maven, npm, gradle, go, cargo, gradle-android, xcode-ios]
    if: always() && needs.resolve-bootstrap.result == 'success' && needs.validate-test-selections.result == 'success'
    runs-on: ${{ fromJSON(inputs['runs-on']) }}
    container:
      image: ${{ inputs['runtime-image'] }}
    permissions:
      contents: read
    outputs:
      stage-ran: ${{ steps.summary.outputs.stage-ran }}
      stage-result: ${{ steps.summary.outputs.stage-result }}
      result-json: ${{ steps.summary.outputs.result-json }}
    steps:
      - name: Normalize build stage result
        id: summary
        env:
          STAGE_PLAN_JSON: ${{ inputs['build-stage-plan-json'] }}
          JOB_RESULTS: ${{ toJson(needs) }}
        run: forge-ci report stage-result
      - name: Upload build stage manifests
        if: always() && hashFiles('.ci-results/*.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-results-build
          path: .ci-results/*.json
          include-hidden-files: "true"
          retention-days: "5"
          if-no-files-found: ignore
