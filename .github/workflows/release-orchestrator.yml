# Release Orchestrator
# 
# Purpose: Main orchestrator workflow that coordinates the complete release process for
# production releases. It handles version management, artifact publishing, container 
# building, security attestations, and GitHub release creation in a single workflow.
#
# How it works:
# 1. Validates release prerequisites (version match, credentials, permissions)
# 2. Bumps version and generates changelog using git-cliff
# 3. Publishes artifacts to configured registries (Maven Central, NPM, GitHub Packages)
# 4. Builds and publishes container images with SLSA/SBOM if configured
# 5. Creates GitHub release with changelog, artifacts, and signatures
#
# Security controls:
# - Configured artifact signing via GPG, Sigstore, or KMS
# - SLSA provenance attestation for supply chain security
# - SBOM generation in multiple formats (CycloneDX, SPDX)
# - Container vulnerability scanning with Trivy
#
# Required Secrets (depending on configuration):
#   GITHUB_TOKEN: Automatically provided for GitHub operations
#   RELEASE_TOKEN: For version bump, tag move, and GitHub release creation
#   RELEASE_GPG_PRIVATE_KEY: For release validation, version bump signing, and artifact signing
#   RELEASE_GPG_PASSPHRASE: For release GPG key use
#   RELEASE_GPG_PUBLIC_KEY: For tag/signature verification
#   MAVEN_CENTRAL_USERNAME: For Maven Central publishing (when publish-to includes maven-central)
#   MAVEN_CENTRAL_PASSWORD: For Maven Central publishing (when publish-to includes maven-central)
#   NPM_TOKEN: Reserved for future npmjs.org support; current NPM publishing uses GITHUB_TOKEN
#   CODE_SCANNING_TOKEN: Optional — uploads scan results to Code Scanning
#                      (requires code_scanning_alerts:write — GitHub App or fine-grained PAT)
#   The caller passes the secrets its release uses by name in an explicit
#   `secrets:` mapping.
#
# Required Permissions:
#   contents: write       # Create releases and tags
#   packages: write       # Publish packages and containers
#   id-token: write       # Keyless cosign OIDC (sign + attest, no GitHub attestation API)
#   actions: read         # Download workflow artifacts
#
# Forge CI workflow design
# - Removed single-artifact inline mode
# - Only supports artifacts-config file
# - Separate artifacts[] and containers[] sections
# - Container configuration moved to containers[] section
#
# Build Types: application (default), library
# Publishing: Controlled via build-type, require-authorization, publish-to fields
# Containers: Separate section with explicit dependencies
name: Orchestrate Release
on:
  workflow_call: # yamllint disable-line rule:truthy
    inputs:
      # === artifacts.yml LOCATION ===
      artifacts-config:
        description: "Path to the artifacts config file. Defaults to .forge-ci/artifacts.yml. If the file is absent AND the repo has exactly one ecosystem manifest at root (pom.xml, package.json, Cargo.toml, go.mod), forge-ci auto-derives the equivalent plan in-memory."
        required: false
        default: ".forge-ci/artifacts.yml"
        type: string
      # === SHARED CONFIGURATION ===
      release-type:
        description: "Release type override. Production releases are stable-only; omit this or set stable. Prerelease request tags are rejected before planning."
        required: false
        type: string
      branch:
        description: "Explicit branch or ref to prepare and release"
        required: true
        type: string
      # Changelog creator configuration
      changelog-creator:
        description: "Changelog creator type (e.g., git-cliff). Leave empty to skip"
        required: false
        default: "git-cliff"
        type: string
      changelog.config:
        description: "Changelog configuration file (default: uses generate-changelog default)"
        required: false
        default: ""
        type: string
      changelog.skipversionbump:
        description: "Skip version bump (default: false)"
        required: false
        default: false
        type: boolean
      # Release publisher configuration  
      release-publisher:
        description: "Release publisher type (github-cli). Leave empty to skip GitHub release"
        required: false
        type: string
      release.sboms:
        description: "SBOMs to generate for the release: all | none | comma-list of build,analyzed-artifact,analyzed-container (default: all). Intersected with per-artefact `sboms` to compute the effective set."
        required: false
        default: "all"
        type: string
      release.attachartifacts:
        description: "Glob patterns for artifacts to attach to GitHub release (comma/newline separated)"
        required: false
        default: ""
        type: string
      release.signartifacts:
        description: "Sign release artifacts with the configured backend (default: true)"
        required: false
        default: true
        type: boolean
      release.requireallowlistedsigner:
        description: "Require the tag signer to be allowlisted: .forge-ci/allowed_signers (SSH) or .forge-ci/allowed_gpg_keys.asc (GPG). Org policy sets this true in the shared release-workflow template; the engine default stays false as an auditable per-repo escape hatch for genuinely-private repos."
        required: false
        default: false
        type: boolean
      release.draft:
        description: "Create as draft release (default: false)"
        required: false
        default: false
        type: boolean
      # Advanced configuration
      file-pattern:
        description: "Files to commit in version bump (auto-detected by project type if not specified)"
        required: false
        type: string
        default: ""
        # Auto-detected patterns by project type:
        # - Maven: CHANGELOG.md pom.xml
        # - NPM: CHANGELOG.md package.json package-lock.json
        # - Gradle: CHANGELOG.md build.gradle settings.gradle
        # - Gradle Android: CHANGELOG.md build.gradle settings.gradle gradle.properties
        # - Xcode iOS: CHANGELOG.md project.pbxproj
      forge-ci-binary-ref:
        description: "forge-ci ref/version passed to downstream plain-runner jobs (defaults to v0.90.0)"
        required: false
        default: "v0.90.0"
        type: string
      runtime-image:
        description: "forge-ci base runtime image for control-plane jobs. Optional override; default uses the matching v0.90.0 runtime image."
        required: false
        default: "ghcr.io/diggsweden/forge-ci-runtime-base:v0.90.0"
        type: string
      runtime-image-full:
        description: "forge-ci full runtime image for SBOM/security-capable release jobs. Optional override; default uses the matching v0.90.0 runtime image."
        required: false
        default: "ghcr.io/diggsweden/forge-ci-runtime:v0.90.0"
        type: string
      runtime-image-java:
        description: "forge-ci Java runtime image for Maven/Gradle jobs. Optional override; default uses the matching v0.90.0 runtime image."
        required: false
        default: "ghcr.io/diggsweden/forge-ci-runtime-java-25:v0.90.0"
        type: string
      runtime-image-node:
        description: "forge-ci Node runtime image for NPM jobs. Optional override; default uses the matching v0.90.0 runtime image."
        required: false
        default: "ghcr.io/diggsweden/forge-ci-runtime-node-24:v0.90.0"
        type: string
      runtime-image-rust:
        description: "forge-ci Rust runtime image for Cargo build + SBOM jobs (build-cargo.yml for artefact-first, sbom-cargo.yml for container-first). Optional override; default uses the matching v0.90.0 runtime image."
        required: false
        default: "ghcr.io/diggsweden/forge-ci-runtime-rust-stable:v0.90.0"
        type: string
      runtime-image-go:
        description: "forge-ci Go runtime image for Go build/SBOM jobs. Optional override; default uses the matching v0.90.0 runtime image."
        required: false
        default: "ghcr.io/diggsweden/forge-ci-runtime-go-1.27:v0.90.0"
        type: string
      runtime-image-android:
        description: "forge-ci Android runtime image for Gradle Android jobs. Optional override; default uses the matching v0.90.0 runtime image."
        required: false
        default: "ghcr.io/diggsweden/forge-ci-runtime-android-35:v0.90.0"
        type: string
      # === IMAGE PROMOTION LADDER (build-once / promote-many) ===
      # When the release builds a container, the same immutable digest is
      # promoted dev → staging → release by verified tag-moves (no rebuild).
      # These name the GitHub Environments whose protection rules gate the
      # staging and release promotions; the dev promotion is automatic.
      # Fork-friendly: a fork can point these at its own environments.
      promote-staging-environment:
        description: "GitHub Environment gating the staging image promotion (its protection rules / reviewers pause the job). Empty = no gate."
        required: false
        default: "staging"
        type: string
      promote-release-environment:
        description: "GitHub Environment gating the release image promotion (production reviewers). Empty = no gate."
        required: false
        default: "production"
        type: string
      # Optional digital-sovereignty target for the RELEASE promotion: copy the
      # released digest (with its signature, via cosign) to a registry you own
      # (Forgejo, Harbor). Empty = release stays on the build registry.
      promote-release-repo:
        description: "Destination PREFIX (typically the registry host, optionally + a namespace) for the release promotion. Each image's source path is preserved beneath it (<prefix>/<source-path-after-host>, e.g. forgejo.example.com + ghcr.io/org/app → forgejo.example.com/org/app), so a monorepo's containers map to distinct paths by construction. Empty = no cross-registry copy."
        required: false
        default: ""
        type: string
      promote-release-registry:
        description: "Destination registry host to authenticate to for promote-release-repo (e.g. forgejo.example.com). Required when promote-release-repo is on a different registry."
        required: false
        default: ""
        type: string
      promote-release-registry-username:
        description: "Username for the destination registry login (sovereignty release promotion)."
        required: false
        default: ""
        type: string
      committer-name:
        description: "Committer display name for the version-bump commit when artifacts.yml sets git-signing.method=ssh (cosmetic). SSH keys carry no UID, so the release-bot display name is supplied here. Unused for gpg, which derives it from the key UID."
        required: false
        default: ""
        type: string
      committer-email:
        description: "Committer email for the version-bump commit when git-signing.method=ssh. This is the SSH signing PRINCIPAL: it must match an entry in .forge-ci/allowed_signers, because that is what `validate tag signature` checks the SSH-signed release tag against. Pick the release-bot identity you listed in allowed_signers. Unused for gpg (which verifies by key fingerprint, not email)."
        required: false
        default: ""
        type: string
      cosign-public-key:
        description: "The trusted Cosign public key, PEM, when artifacts.yml signs with sign.key env://COSIGN_KEY. Pass the COSIGN_PUBLIC_KEY repository or organization variable: each job that receives the key secret refuses to sign unless the key derives this public key."
        required: false
        default: ""
        type: string
      cosign-public-key-sha256:
        description: "SHA-256 of cosign-public-key as `sha256sum cosign.pub` prints it, written out in the calling workflow, so a changed variable alone cannot swap the trusted key."
        required: false
        default: ""
        type: string
      release-asset-retention:
        description: "How many of the newest published releases keep every file. After publishing, each older release keeps its checksums, signatures and SBOMs and loses its archives, binaries and packages; the releases and tags stay, and an immutable release is kept whole. Empty, the default, deletes nothing."
        required: false
        default: ""
        type: string
    # Top-level orchestrator: the canonical union of every secret any
    # downstream stage may need. All `required: false`, so a caller
    # passes by name only the secrets its release uses, in an explicit
    # `secrets:` mapping. Older callers using `secrets: inherit` still
    # work, but it hands every secret to the release. The declaration
    # is also what `forge-ci doctor`-style tooling validates.
    secrets:
      # Release-time signing + tag pushing
      RELEASE_GPG_PRIVATE_KEY:
        description: "Armored OpenPGP private key (sign.method=gpg path)"
        required: false
      RELEASE_GPG_PASSPHRASE:
        description: "Passphrase for RELEASE_GPG_PRIVATE_KEY"
        required: false
      RELEASE_GPG_PUBLIC_KEY:
        description: "Public half of RELEASE_GPG_PRIVATE_KEY (validation only)"
        required: false
      RELEASE_TOKEN:
        description: "Token with contents:write for release creation + version-bump push"
        required: false
      RELEASE_SSH_SIGNING_KEY:
        description: "OpenSSH private key for the version-bump commit + tag (git-signing.method=ssh path)"
        required: false
      RELEASE_COSIGN_PRIVATE_KEY:
        description: "Cosign private key, when artifacts.yml signs with sign.key env://COSIGN_KEY. Reaches only the steps that sign with it."
        required: false
      RELEASE_COSIGN_PASSPHRASE:
        description: "Passphrase for RELEASE_COSIGN_PRIVATE_KEY"
        required: false
      # Maven Central publishing
      MAVEN_CENTRAL_USERNAME:
        description: "Sonatype OSSRH portal username"
        required: false
      MAVEN_CENTRAL_PASSWORD:
        description: "Sonatype OSSRH portal token"
        required: false
      # npm publishing
      NPM_TOKEN:
        description: "npm registry publish token"
        required: false
      # Container security scanning (SARIF upload)
      CODE_SCANNING_TOKEN:
        description: "Token with security-events:write for SARIF upload"
        required: false
      # Android signing + secrets injection
      ANDROID_KEYSTORE:
        description: "Base64-encoded Android signing keystore (.jks/.keystore)"
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        description: "Password for ANDROID_KEYSTORE"
        required: false
      ANDROID_KEY_ALIAS:
        description: "Alias of the signing key inside ANDROID_KEYSTORE"
        required: false
      ANDROID_KEY_PASSWORD:
        description: "Password for the key referenced by ANDROID_KEY_ALIAS"
        required: false
      SECRETS_PROPERTIES_BASE64:
        description: "Base64-encoded Android secrets.properties"
        required: false
      # Google Play publishing
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:
        description: "Google Play Console service-account JSON"
        required: false
      # iOS signing + provisioning
      IOS_SIGNING_CERTIFICATE_BASE64:
        description: "Base64-encoded .p12 code-signing certificate"
        required: false
      IOS_SIGNING_CERTIFICATE_PASSPHRASE:
        description: "Passphrase for IOS_SIGNING_CERTIFICATE_BASE64"
        required: false
      PROVISIONING_PROFILE_BASE64:
        description: "Base64-encoded provisioning profile (.mobileprovision)"
        required: false
      KEYCHAIN_PASSWORD:
        description: "Ephemeral macOS keychain password generated for the build"
        required: false
      XCCONFIG_BASE64:
        description: "Base64-encoded xcconfig file"
        required: false
      # App Store Connect publishing
      APP_STORE_CONNECT_API_KEY_ID:
        description: "App Store Connect API key ID"
        required: false
      APP_STORE_CONNECT_ISSUER_ID:
        description: "App Store Connect API issuer ID"
        required: false
      APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64:
        description: "Base64-encoded App Store Connect API .p8 private key"
        required: false
      # Container build-time secret envelope
      FORGE_CI_BUILD_SECRETS_JSON:
        description: |
          JSON envelope of {name: value} for every name listed in
          containers[].build-secrets across the repo's artifacts.yml.
          Stored as a single pre-packed repo/org secret by the
          adopter so the value stays inside the secrets channel
          end-to-end. Forwarded to publish-container.yml where it
          is unpacked into mode-0600 tmpfiles and mounted via
          Buildah --mount=type=secret — never recorded in SLSA
          provenance, step inputs, or workflow logs. Recipe:
          docs/artifacts-reference.md `build-secrets`.
        required: false
      # Sovereignty release promotion: destination-registry push token. Only
      # needed when promote-release-repo targets a different registry; cosign
      # copy authenticates the cross-registry push with it.
      PROMOTE_RELEASE_REGISTRY_PASSWORD:
        description: "Push token for promote-release-registry (digital-sovereignty release promotion)."
        required: false
concurrency:
  # GitHub retains only one pending run per group, so branch-wide groups can
  # silently replace a different pending request. Serialize reruns of this
  # request only; branch mutation is guarded by the authorized-source SHA CAS.
  group: reusable-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read # Default permission; individual jobs declare additions.
jobs:
  # ===== Stage 0: Configuration And Policy =====
  parse-config:
    name: "Check: plan"
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs['runtime-image'] }}
    permissions:
      contents: read
    outputs:
      # Typed setup contracts used by the next escape-bash stages.
      config-plan-json: ${{ steps.parse.outputs.config-plan-json }}
      release-plan-json: ${{ steps.plan.outputs.release-plan-json }}
      prepare-stage-plan-json: ${{ steps.plan.outputs.prepare-stage-plan-json }}
      build-stage-plan-json: ${{ steps.plan.outputs.build-stage-plan-json }}
      publish-stage-plan-json: ${{ steps.plan.outputs.publish-stage-plan-json }}
      artifact-transfer-plan-json: ${{ steps.plan.outputs.artifact-transfer-plan-json }}

      # Commit SHA for forge-ci-binary-ref, resolved against the canonical forge-ci remote
      # before any tag movement. Downstream plain-runner jobs use this so
      # they install the same forge-ci commit the runtime image was built
      # from, surviving version-bump tag moves.
      forge-ci-binary-ref: ${{ steps.resolve-ref.outputs.sha }}

      # Final release tag (vX.Y.Z) derived from the pushed request ref
      # (release-request/vX.Y.Z). Downstream jobs key off this, not
      # github.ref_name, so the request prefix never leaks into release
      # names, image tags or stable/draft classification.
      release-tag: ${{ steps.relctx.outputs.release-tag }}
    steps:
      - name: Validate release workflow provider
        run: forge-ci validate release-provider
      # Defense-in-depth gate at the top of the release pipeline:
      # refuse triggers that would attach signing/package/API secrets
      # to PR-HEAD code. Every downstream job depends on parse-config
      # via `needs:`, so refusal here aborts the whole release.
      # forge-ci is pre-baked in the runtime image; no install
      # step needed.
      - name: Refuse PR-context trigger (publish/release secrets in scope)
        run: forge-ci validate event-context
      - name: Checkout caller repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECKOUT_REF: ${{ github.sha }}
          CHECKOUT_FETCH_ALL_REFS: "true"
        run: forge-ci platform checkout
      - name: Resolve forge-ci ref to commit SHA
        id: resolve-ref
        env:
          REMOTE_URL: ${{ github.server_url }}/${{ vars.FORGE_CI_REPOSITORY || 'diggsweden/forge-ci' }}
          REF: ${{ inputs['forge-ci-binary-ref'] }}
        run: forge-ci platform resolve-ref
      - name: Derive release tag from request ref
        id: relctx
        # release-request/vX.Y.Z → vX.Y.Z (the final release tag). The CLI
        # owns the parsing; bash never strips refs.
        env:
          RELEASE_CONTEXT_REQUIRE_REQUEST: "true"
          RELEASE_CONTEXT_REQUIRE_STABLE: "true"
        run: forge-ci version derive-release
      - name: Parse artifacts.yml
        id: parse
        run: forge-ci config parse-artifacts
        env:
          ARTIFACTS_CONFIG: ${{ inputs['artifacts-config'] }}
      - name: Plan release
        id: plan
        env:
          CONFIG_PLAN_JSON: ${{ steps.parse.outputs.config-plan-json }}

          # Explicit workflow-call inputs.
          BRANCH: ${{ inputs.branch }}
          FILE_PATTERN: ${{ inputs['file-pattern'] }}
          RELEASE_TYPE: ${{ inputs['release-type'] }}
          RELEASE_PUBLISHER: ${{ inputs['release-publisher'] }}
          RELEASE_REQUIRE_ALLOWLISTED_SIGNER: ${{ inputs['release.requireallowlistedsigner'] }}
          RELEASE_DRAFT: ${{ inputs['release.draft'] }}
          RELEASE_SBOMS: ${{ inputs['release.sboms'] }}
          RELEASE_SIGN_ARTIFACTS: ${{ inputs['release.signartifacts'] }}
          CHANGELOG_CREATOR: ${{ inputs['changelog-creator'] }}
          CHANGELOG_SKIP_VERSION_BUMP: ${{ inputs['changelog.skipversionbump'] }}

          # The DERIVED release tag, so stable/draft classification keys off
          # vX.Y.Z, not the release-request/ prefix. TAG_NAME, not
          # GITHUB_REF_NAME: Actions ignores a step's value for its own
          # GITHUB_* variables, so that override never reached the planner,
          # which saw release-request/vX.Y.Z and planned a draft that was not
          # the latest release.
          TAG_NAME: ${{ steps.relctx.outputs.release-tag }}
        run: forge-ci plan release
  # ===== Stage 1: Validation =====
  validate-prerequisites:
    name: "Check: release request"
    needs: [parse-config]
    secrets:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
      RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
      RELEASE_GPG_PUBLIC_KEY: ${{ secrets.RELEASE_GPG_PUBLIC_KEY }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      CODE_SCANNING_TOKEN: ${{ secrets.CODE_SCANNING_TOKEN }}
    uses: ./.github/workflows/validate-release-prerequisites.yml
    with:
      config-plan-json: ${{ needs.parse-config.outputs.config-plan-json }}
      has-cargo-publish-target: ${{ fromJson(needs.parse-config.outputs['publish-stage-plan-json']).targets.cargo_container_first.runs || fromJson(needs.parse-config.outputs['build-stage-plan-json']).targets.cargo.runs }}
      publish-stage-plan-json: ${{ needs.parse-config.outputs.publish-stage-plan-json }}
      has-maven-central-publish-target: ${{ fromJson(needs.parse-config.outputs['publish-stage-plan-json']).targets.maven_central.runs }}
      # Enable the JVM reproducibility validator when any Maven/Gradle/
      # Gradle-Android artefact is planned in the build stage.
      has-jvm-artefact: ${{ fromJson(needs.parse-config.outputs['build-stage-plan-json']).targets.maven.runs || fromJson(needs.parse-config.outputs['build-stage-plan-json']).targets.gradle.runs || fromJson(needs.parse-config.outputs['build-stage-plan-json']).targets.gradle_android.runs }}
      container-registry: ghcr.io
      sign-artifacts: ${{ fromJson(needs.parse-config.outputs['release-plan-json']).policy.sign_artifacts }}
      require-allowlisted-signer: ${{ fromJson(needs.parse-config.outputs['release-plan-json']).policy.require_allowlisted_signer }}
      branch: ${{ inputs.branch }}
      authorized-source-sha: ${{ github.sha }}
      # Cargo prerequisite validation checks Cargo.lock and `cargo --version`,
      # so use the Rust runtime whenever Cargo artifacts (either mode) are present.
      runtime-image: ${{ (fromJson(needs.parse-config.outputs['publish-stage-plan-json']).targets.cargo_container_first.runs || fromJson(needs.parse-config.outputs['build-stage-plan-json']).targets.cargo.runs) && inputs['runtime-image-rust'] || inputs['runtime-image'] }}
  # ===== Stage 2: Release Preparation =====
  # Release preparation now lives below this control-plane stage call.
  execute-prepare-stage:
    name: Prepare
    needs: [parse-config, validate-prerequisites]
    if: ${{ !failure() && !cancelled() }}
    permissions:
      actions: read
      contents: write
      packages: read
    secrets:
      RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
      RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      RELEASE_SSH_SIGNING_KEY: ${{ secrets.RELEASE_SSH_SIGNING_KEY }}
    uses: ./.github/workflows/release-prepare-stage.yml
    with:
      branch: ${{ inputs.branch }}
      authorized-source-sha: ${{ github.sha }}
      existing-release-sha: ${{ needs.validate-prerequisites.outputs.existing-release-sha }}
      prepare-stage-plan-json: ${{ needs.parse-config.outputs.prepare-stage-plan-json }}
      forge-ci-binary-ref: ${{ needs.parse-config.outputs.forge-ci-binary-ref }}
      # git_signing.method comes from artifacts.yml via the parsed config plan;
      # defaults to gpg, so repos that never set git-signing are unchanged.
      git-signing-method: ${{ fromJson(needs.parse-config.outputs.config-plan-json).git_signing.method }}
      committer-name: ${{ inputs['committer-name'] }}
      committer-email: ${{ inputs['committer-email'] }}
      runtime-image: ${{ inputs['runtime-image'] }}
      runtime-image-java: ${{ inputs['runtime-image-java'] }}
      runtime-image-node: ${{ inputs['runtime-image-node'] }}
      runtime-image-rust: ${{ inputs['runtime-image-rust'] }}
  validate-release-tag:
    name: "Prepare: check the release tag"
    needs: [parse-config, execute-prepare-stage]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs['runtime-image'] }}
    permissions:
      contents: read
    steps:
      - name: Checkout immutable release commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECKOUT_REF: ${{ needs.execute-prepare-stage.outputs.release-sha }}
          CHECKOUT_FETCH_ALL_REFS: "true"
        run: forge-ci platform checkout
      - name: Validate remote final tag object and commit
        # The remote tag is read with the job's own read-only token, as the
        # runner's token is on GitLab and Forgejo: validate-tag takes the
        # ambient forge credential, so without it a private repository's
        # ls-remote asks for a username and fails. No write token is needed.
        env:
          RELEASE_SHA: ${{ needs.execute-prepare-stage.outputs.release-sha }}
          TAG_NAME: ${{ needs.parse-config.outputs.release-tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: forge-ci release validate-tag
      - name: Validate final tag signature
        env:
          TAG_NAME: ${{ needs.parse-config.outputs.release-tag }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_GPG_PUBLIC_KEY: ${{ secrets.RELEASE_GPG_PUBLIC_KEY }}
          REQUIRE_VALID_SIGNATURE: "true"
        run: forge-ci validate tag signature
  # ===== Stage 3: Build =====
  # Build fanout now lives below this control-plane stage call.
  execute-build-stage:
    name: Build
    needs: [parse-config, execute-prepare-stage, validate-release-tag]
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: read
    secrets:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SECRETS_PROPERTIES_BASE64: ${{ secrets.SECRETS_PROPERTIES_BASE64 }}
      IOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.IOS_SIGNING_CERTIFICATE_BASE64 }}
      IOS_SIGNING_CERTIFICATE_PASSPHRASE: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSPHRASE }}
      PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      XCCONFIG_BASE64: ${{ secrets.XCCONFIG_BASE64 }}
    uses: ./.github/workflows/release-build-stage.yml
    with:
      branch: ${{ needs.execute-prepare-stage.outputs.release-sha }}
      release-tag: ${{ needs.parse-config.outputs.release-tag }}
      release-sha: ${{ needs.execute-prepare-stage.outputs.release-sha }}
      source-date-epoch: ${{ needs.execute-prepare-stage.outputs.source-date-epoch }}
      build-stage-plan-json: ${{ needs.parse-config.outputs.build-stage-plan-json }}
      forge-ci-binary-ref: ${{ needs.parse-config.outputs.forge-ci-binary-ref }}
      runtime-image: ${{ inputs['runtime-image'] }}
      runtime-image-java: ${{ inputs['runtime-image-java'] }}
      runtime-image-node: ${{ inputs['runtime-image-node'] }}
      runtime-image-go: ${{ inputs['runtime-image-go'] }}
      runtime-image-android: ${{ inputs['runtime-image-android'] }}
      runtime-image-rust: ${{ inputs['runtime-image-rust'] }}
  # ===== Stage 4: Publish =====
  # Publish fanout now lives below this control-plane stage call.
  # Container-first cargo publishes here: lockfile-derived SBOM and the
  # actual container build (which is where cargo compiles) belong with
  # publish-stage's sibling jobs. Artefact-first cargo has already run
  # in execute-build-stage above and lands in publish via the same
  # release-artifact transfer plumbing the Go path uses.
  execute-publish-stage:
    name: Publish
    needs: [parse-config, execute-prepare-stage, execute-build-stage]
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: write
      packages: write
      id-token: write
      actions: read
    secrets:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
      RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
      RELEASE_COSIGN_PRIVATE_KEY: ${{ secrets.RELEASE_COSIGN_PRIVATE_KEY }}
      RELEASE_COSIGN_PASSPHRASE: ${{ secrets.RELEASE_COSIGN_PASSPHRASE }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
      CODE_SCANNING_TOKEN: ${{ secrets.CODE_SCANNING_TOKEN }}
      FORGE_CI_BUILD_SECRETS_JSON: ${{ secrets.FORGE_CI_BUILD_SECRETS_JSON }}
    uses: ./.github/workflows/release-publish-stage.yml
    with:
      branch: ${{ needs.execute-prepare-stage.outputs.release-sha }}
      release-tag: ${{ needs.parse-config.outputs.release-tag }}
      release-sha: ${{ needs.execute-prepare-stage.outputs.release-sha }}
      source-date-epoch: ${{ needs.execute-prepare-stage.outputs.source-date-epoch }}
      publish-stage-plan-json: ${{ needs.parse-config.outputs.publish-stage-plan-json }}
      forge-ci-binary-ref: ${{ needs.parse-config.outputs.forge-ci-binary-ref }}
      runtime-image: ${{ inputs['runtime-image'] }}
      runtime-image-java: ${{ inputs['runtime-image-java'] }}
      runtime-image-rust: ${{ inputs['runtime-image-rust'] }}
      runtime-image-go: ${{ inputs['runtime-image-go'] }}
      build-result-json: ${{ needs.execute-build-stage.outputs.result-json }}
      # Carry the config-plan + sign-artifacts policy through so the
      # publish stage can dispatch container image signing per
      # sign.method (sigstore | kms; gpg is skipped).
      config-plan-json: ${{ needs.parse-config.outputs.config-plan-json }}
      sign-artifacts: ${{ fromJson(needs.parse-config.outputs['release-plan-json']).policy.sign_artifacts }}
      cosign-public-key: ${{ inputs['cosign-public-key'] }}
      cosign-public-key-sha256: ${{ inputs['cosign-public-key-sha256'] }}
  # ===== Stage 4b: Image promotion ladder (build-once / promote-many) =====
  # Only runs when the release built a container. The publish stage already
  # pushed the immutable digest + its staging candidate tag and uploaded the
  # release-image ledger as a run-scoped artifact; each job below promotes that
  # SAME digest to the next stage pointer (:dev → :staging → :release) by a
  # verified tag-move, never a rebuild. dev is automatic; staging and release
  # pause on their GitHub Environment's protection rules. Kept parallel to
  # create-release (not a dependency of it) so non-container releases — and the
  # GitHub release itself, which attaches to the already-immutable :<version>
  # tag — are never gated on the ladder.
  promote-dev:
    name: "Publish: images to dev"
    needs: [parse-config, execute-publish-stage]
    if: ${{ !failure() && !cancelled() && fromJson(needs.parse-config.outputs['publish-stage-plan-json']).targets.containers.runs }}
    permissions:
      actions: read
      contents: read
      packages: write
    uses: ./.github/workflows/promote-stage.yml
    with:
      stage: dev
      release-tag: ${{ needs.parse-config.outputs.release-tag }}
      forge-ci-binary-ref: ${{ needs.parse-config.outputs.forge-ci-binary-ref }}
  promote-staging:
    name: "Publish: images to staging"
    needs: [parse-config, execute-publish-stage, promote-dev]
    if: ${{ !failure() && !cancelled() && fromJson(needs.parse-config.outputs['publish-stage-plan-json']).targets.containers.runs }}
    permissions:
      actions: read
      contents: read
      packages: write
    uses: ./.github/workflows/promote-stage.yml
    with:
      stage: staging
      environment: ${{ inputs['promote-staging-environment'] }}
      release-tag: ${{ needs.parse-config.outputs.release-tag }}
      forge-ci-binary-ref: ${{ needs.parse-config.outputs.forge-ci-binary-ref }}
  promote-release:
    name: "Publish: images to release"
    needs: [parse-config, execute-publish-stage, promote-staging]
    if: ${{ !failure() && !cancelled() && fromJson(needs.parse-config.outputs['publish-stage-plan-json']).targets.containers.runs }}
    permissions:
      actions: read
      contents: read
      packages: write
    uses: ./.github/workflows/promote-stage.yml
    with:
      stage: release
      environment: ${{ inputs['promote-release-environment'] }}
      release-tag: ${{ needs.parse-config.outputs.release-tag }}
      forge-ci-binary-ref: ${{ needs.parse-config.outputs.forge-ci-binary-ref }}
      # Optional digital-sovereignty target — empty inputs keep release on the
      # build registry (same-registry tag-move, no cosign/dest login).
      stage-repo: ${{ inputs['promote-release-repo'] }}
      stage-registry: ${{ inputs['promote-release-registry'] }}
      stage-registry-username: ${{ inputs['promote-release-registry-username'] }}
    secrets:
      stage-registry-password: ${{ secrets.PROMOTE_RELEASE_REGISTRY_PASSWORD }}
  # ===== Stage 5: Release =====
  # Release creation stays top-level because it is the public end of the pipeline.
  create-release:
    name: "Publish: release"
    needs: [parse-config, execute-prepare-stage, validate-release-tag, execute-publish-stage]
    # Run even if previous jobs were skipped but at least one succeeded
    if: ${{ fromJson(needs.parse-config.outputs['release-plan-json']).policy.create_release }}
    permissions:
      actions: read
      contents: write
      packages: read
      id-token: write
    secrets:
      RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
      RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      RELEASE_COSIGN_PRIVATE_KEY: ${{ secrets.RELEASE_COSIGN_PRIVATE_KEY }}
      RELEASE_COSIGN_PASSPHRASE: ${{ secrets.RELEASE_COSIGN_PASSPHRASE }}
    uses: ./.github/workflows/release-create-github.yml
    with:
      release-name: "${{ needs.parse-config.outputs.release-tag }}"
      checkout-ref: ${{ needs.execute-prepare-stage.outputs.release-sha }}
      attach-artifacts: ${{ inputs['release.attachartifacts'] }}
      sboms: ${{ fromJson(needs.parse-config.outputs['release-plan-json']).policy.sboms }}
      sign-artifacts: ${{ fromJson(needs.parse-config.outputs['release-plan-json']).policy.sign_artifacts }}
      draft: ${{ fromJson(needs.parse-config.outputs['release-plan-json']).policy.create_draft_release }}
      config-plan-json: ${{ needs.parse-config.outputs.config-plan-json }}
      artifact-transfer-plan-json: ${{ needs.parse-config.outputs.artifact-transfer-plan-json }}
      changelog-config: ${{ inputs['changelog.config'] }}
      make-latest: ${{ fromJson(needs.parse-config.outputs['release-plan-json']).policy.make_latest }}
      runtime-image: ${{ inputs['runtime-image-full'] }}
      cosign-public-key: ${{ inputs['cosign-public-key'] }}
      cosign-public-key-sha256: ${{ inputs['cosign-public-key-sha256'] }}
      release-asset-retention: ${{ inputs['release-asset-retention'] }}
      forge-ci-binary-ref: ${{ needs.parse-config.outputs.forge-ci-binary-ref }}
  # ===== Stage 6: Summary =====
  release-summary:
    name: Summary
    needs:
      - parse-config
      - execute-prepare-stage
      - execute-build-stage
      - execute-publish-stage
      - promote-dev
      - promote-staging
      - promote-release
      - create-release
    if: always()
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs['runtime-image'] }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Generate Release Summary
        env:
          # Release context.
          RELEASE_VERSION: ${{ needs.parse-config.outputs.release-tag }}
          RELEASE_BRANCH: ${{ inputs.branch }}
          RELEASE_COMMIT: ${{ needs.execute-prepare-stage.outputs.release-sha || github.sha }}
          RELEASE_ACTOR: ${{ github.actor }}

          # Release preparation result.
          PREPARE_STAGE_RESULT_JSON: ${{ needs.execute-prepare-stage.outputs.result-json }}

          # Build-stage results.
          BUILD_STAGE_RESULT_JSON: ${{ needs.execute-build-stage.outputs.result-json }}

          # Publish-stage results.
          PUBLISH_STAGE_RESULT_JSON: ${{ needs.execute-publish-stage.outputs.result-json }}

          # Image-promotion ladder results (skipped when no container).
          PROMOTE_DEV_RESULT: ${{ needs.promote-dev.result }}
          PROMOTE_STAGING_RESULT: ${{ needs.promote-staging.result }}
          PROMOTE_RELEASE_RESULT: ${{ needs.promote-release.result }}

          # Release-stage result.
          CREATE_RELEASE_RESULT: ${{ needs.create-release.result }}
        run: forge-ci report release
