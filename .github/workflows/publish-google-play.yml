# Google Play Store Publisher
# 
# Purpose: Publishes Android applications to the Google Play Store using
# the Google Play Developer API.
#
# How it works:
# 1. Downloads AAB/APK artifact from previous build job
# 2. Uploads to Google Play Console using service account credentials
# 3. Targets specified track (internal, alpha, beta, production)
# 4. Optionally includes release notes from whats-new files
#
# Features:
#   - Multiple track support (internal, alpha, beta, production)
#   - Staged rollouts with userFraction
#   - In-app update priority
#   - ProGuard mapping file upload for crash reporting
#   - Debug symbols upload
#   - Localized release notes (what's new)
#
# Outputs:
#   - Upload status and build information
#   - Play Store availability notifications
#
# Required Secrets:
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: Service account JSON key (plain text)
#
# Required Permissions:
#   actions: read   # Download workflow artifacts
#   contents: read  # Checkout source
#
name: Publish Google Play
on:
  workflow_call:
    inputs:
      # === ARTIFACT SOURCE ===
      aab-artifact-name:
        description: "Name of artifact containing AAB file"
        required: true
        type: string
      branch:
        description: "Explicit branch, tag, or SHA whose application is published"
        required: true
        type: string
      # === GOOGLE PLAY CONFIGURATION ===
      package-name:
        description: "Android package name (e.g., com.example.app)"
        required: true
        type: string
      track:
        description: "Target track (internal, alpha, beta, production)"
        required: false
        default: "internal"
        type: string
      release-name:
        description: "Release name (defaults to version from AAB)"
        required: false
        default: ""
        type: string
      # === RELEASE OPTIONS ===
      status:
        description: "Release status (completed, inProgress, halted, draft)"
        required: false
        default: "completed"
        type: string
      user-fraction:
        description: "Staged rollout percentage (0.0-1.0, only for inProgress status)"
        required: false
        default: ""
        type: string
      in-app-update-priority:
        description: "In-app update priority (0-5, 5 is highest)"
        required: false
        default: "0"
        type: string
      changes-not-sent-for-review:
        description: "Hold changes for manual review in Play Console"
        required: false
        default: false
        type: boolean
      # === OPTIONAL FILES ===
      whats-new-directory:
        description: "Directory containing localized what's new files (whatsnew-en-US, etc.)"
        required: false
        default: ""
        type: string
      mapping-file:
        description: "Path to ProGuard mapping.txt file"
        required: false
        default: ""
        type: string
      debug-symbols:
        description: "Path to native debug symbols (zip file or folder)"
        required: false
        default: ""
        type: string
      # === SYSTEM ===
      runtime-image:
        description: "forge-ci runtime image., pinned by digest (image@sha256:<64 hex>); the resolver refuses anything else before the job container starts. (publish-google-play only needs base — the upload action is a JS action that doesn't need Android tooling.)"
        required: true
        type: string
      forge-ci-binary-ref:
        description: "Full engine commit (40 hex) the workflow ref names; a tag or branch is refused"
        required: true
        type: string
    # All `required: false` — `secrets: inherit` callers unchanged.
    secrets:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:
        description: "Google Play Console service-account JSON (full contents, not base64)"
        required: false
permissions:
  contents: read
jobs:
  resolve-bootstrap:
    permissions:
      contents: read
    uses: ./.github/workflows/resolve-forge-ci-bootstrap.yml
    with:
      forge-ci-binary-ref: ${{ inputs['forge-ci-binary-ref'] }}
      images: |
        runtime-image=${{ inputs['runtime-image'] }}
  publish:
    needs: [resolve-bootstrap]
    name: Publish to Google Play
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container:
      image: ${{ inputs['runtime-image'] }}
    permissions:
      actions: read
      contents: read
    steps:
      # Defense-in-depth: refuse PR-context triggers. The Google Play
      # service-account JSON lives in env on this job and must never
      # run with PR-HEAD code. forge-ci is pre-baked.
      - name: Refuse PR-context trigger (publish/release secrets in scope)
        run: forge-ci validate event-context
      - name: Checkout repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECKOUT_REF: ${{ inputs.branch }}
        run: forge-ci platform checkout

      - name: Download AAB artifact
        env:
          GH_TOKEN: ${{ github.token }}
          DOWNLOAD_NAME: ${{ inputs['aab-artifact-name'] }}
        run: forge-ci artifact download --name "$DOWNLOAD_NAME" --dir artifacts/

      - name: Find AAB file
        id: find-aab
        run: forge-ci publish google-play find-aab

      - name: Validate service account secret
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: forge-ci publish google-play validate-credentials

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ inputs['package-name'] }}
          releaseFiles: ${{ steps.find-aab.outputs.aab-file }}
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
          releaseName: ${{ inputs['release-name'] }}
          userFraction: ${{ inputs['user-fraction'] }}
          inAppUpdatePriority: ${{ inputs['in-app-update-priority'] }}
          changesNotSentForReview: ${{ inputs['changes-not-sent-for-review'] }}
          whatsNewDirectory: ${{ inputs['whats-new-directory'] }}
          mappingFile: ${{ inputs['mapping-file'] }}
          debugSymbols: ${{ inputs['debug-symbols'] }}

      - name: Generate upload summary
        env:
          AAB_FILE: ${{ steps.find-aab.outputs.aab-file }}
          ANDROID_PACKAGE_NAME: ${{ inputs['package-name'] }}
          TRACK: ${{ inputs.track }}
          STATUS: ${{ inputs.status }}
          RELEASE_NAME: ${{ inputs['release-name'] }}
          USER_FRACTION: ${{ inputs['user-fraction'] }}
          PRIORITY: ${{ inputs['in-app-update-priority'] }}
        run: forge-ci report publish google-play
