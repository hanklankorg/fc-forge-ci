#
# Cargo SBOM
#
# Generates a CycloneDX Build SBOM for a Rust project or workspace using
# cargo-cyclonedx, and uploads it as `cargo-build-sbom` by default.
# Workspaces get one bom.json per crate; forge-ci sbom assemble --plan
# picks the aggregate (root crate) BOM, the one with the smallest path depth,
# when consolidating.
#
# This workflow targets container-first cargo artefacts (build-mode:
# container-first). It deliberately does not invoke `cargo build` or
# `cargo test`: in container-first the compile happens inside the
# Containerfile during publish-container.yml's matrix dispatch.
# cargo-cyclonedx resolves the dependency graph from Cargo.lock, so the
# SBOM is accurate without compiling.
#
# Artefact-first cargo (build-mode: artifact-first) does not use this
# workflow — `build-cargo.yml` runs `cargo cyclonedx` inline alongside
# the cross-compile, mirroring `build-go.yml`'s shape. See docs/sbom.md.
#
# Runs inside the forge-ci-runtime-rust image — Rust toolchain and
# cargo-cyclonedx are baked in, so no `cargo install` happens per run.
#
name: Cargo SBOM
on:
  workflow_call:
    inputs:
      working-directory:
        description: "Working directory"
        required: false
        default: "."
        type: string
      branch:
        description: "Branch, tag, or SHA to checkout. Empty uses the triggering ref."
        required: false
        default: ""
        type: string
      artifact-name:
        description: "Artifact name for uploads (defaults to 'cargo-build-sbom')"
        required: false
        default: ""
        type: string
      enable-build-sbom:
        description: "Generate CycloneDX Build SBOM (default true)"
        required: false
        default: true
        type: boolean
      runtime-image:
        description: "forge-ci runtime image carrying the Rust toolchain., pinned by digest (image@sha256:<64 hex>); the resolver refuses anything else before the job container starts."
        required: true
        type: string
      runs-on:
        description: "JSON array of runner labels for the ordinary jobs, read with fromJSON. Signing, promotion and publication jobs stay on GitHub-hosted runners."
        required: false
        default: '["ubuntu-26.04"]'
        type: string
      forge-ci-binary-ref:
        description: "Full engine commit (40 hex) the workflow ref names; a tag or branch is refused"
        required: true
        type: string
permissions:
  contents: read
jobs:
  resolve-bootstrap:
    permissions:
      contents: read
    uses: ./.github/workflows/resolve-forge-ci-bootstrap.yml
    with:
      forge-ci-binary-ref: ${{ inputs['forge-ci-binary-ref'] }}
      images: |
        runtime-image=${{ inputs['runtime-image'] }}
  sbom-cargo:
    needs: [resolve-bootstrap]
    name: Cargo SBOM
    runs-on: ${{ fromJSON(inputs['runs-on']) }}
    timeout-minutes: 15
    container:
      image: ${{ inputs['runtime-image'] }}
    permissions:
      contents: read
    steps:
      - name: Guard working-directory stays inside the workspace
        # Every upload below is rooted at this caller-supplied value. An
        # absolute path or a parent step would take the artifact from outside
        # the workspace, so it is refused here, before any step consumes it.
        env:
          WORKING_DIRECTORY: ${{ inputs['working-directory'] }}
        run: |
          case "$WORKING_DIRECTORY" in
            "") echo "working-directory must not be empty" >&2; exit 1 ;;
            /*) echo "working-directory must be workspace-relative: $WORKING_DIRECTORY" >&2; exit 1 ;;
          esac
          case "/$WORKING_DIRECTORY/" in
            */../*) echo "working-directory must not contain parent-directory steps: $WORKING_DIRECTORY" >&2; exit 1 ;;
          esac
      - name: Checkout repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECKOUT_REF: ${{ inputs.branch }}
        run: forge-ci platform checkout
      # The image decides where cargo keeps crates; an image older or newer
      # than this workflow then still restores them.
      - name: Locate the cargo home
        id: cargo-home
        run: printf 'path=%s\n' "${CARGO_HOME:-$HOME/.cargo}" >>"$GITHUB_OUTPUT"
      # Cache only what cargo-cyclonedx actually consults: the crates.io
      # registry index/cache and the git db (for git-source dependencies).
      # No target/ — this workflow doesn't compile. Cargo keeps them in the
      # cargo home located above; the image's toolchain is read-only.
      - name: Cache cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ steps.cargo-home.outputs.path }}/registry/index
            ${{ steps.cargo-home.outputs.path }}/registry/cache
            ${{ steps.cargo-home.outputs.path }}/git/db
          key: cargo-sbom-${{ runner.os }}-${{ hashFiles(format('{0}/Cargo.lock', inputs['working-directory'])) }}
          restore-keys: |
            cargo-sbom-${{ runner.os }}-
      - name: Generate Build SBOM
        id: sbom
        if: ${{ inputs['enable-build-sbom'] }}
        working-directory: ${{ inputs['working-directory'] }}
        # Runs cargo-cyclonedx from the runtime image with host/default-feature
        # scope. `--all` includes transitive dependencies; `--override-filename bom`
        # normalises output names. This does not observe the Containerfile build.
        run: forge-ci sbom build --project-type cargo
      - name: Upload Cargo SBOM
        if: steps.sbom.outcome == 'success'
        # When called from release-build-stage.yml's per-artefact matrix,
        # artifact-name is set to the cargo artefact's user-chosen name
        # (e.g. "worker") so each upload is unique. Direct callers
        # who don't pass artifact-name fall back to the bare default,
        # which is fine for single-cargo-artefact projects.
        # Enabled Build SBOMs are mandatory release deliverables.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs['artifact-name'] != '' && format('{0}-cargo-build-sbom', inputs['artifact-name']) || 'cargo-build-sbom' }}
          path: |
            ${{ inputs['working-directory'] }}/bom.json
            ${{ inputs['working-directory'] }}/**/bom.json
          retention-days: "7"
          if-no-files-found: error
      - name: Write SBOM status to step summary
        if: always()
        env:
          SBOM_KIND: cargo
          SBOM_OUTCOME: ${{ steps.sbom.outcome }}
          WORKING_DIRECTORY: ${{ inputs['working-directory'] }}
        run: forge-ci report status sbom-count
