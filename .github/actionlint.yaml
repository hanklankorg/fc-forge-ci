# actionlint reads its configuration from this path only, also for the
# workflows under .forgejo/workflows. It does not model Forgejo's `forgejo`
# context, which those workflows use; the ignore is scoped to them so a
# misspelled context in a GitHub workflow is still reported.
paths:
  .forgejo/workflows/**/*.yml:
    ignore:
      - 'undefined variable "forgejo"'
