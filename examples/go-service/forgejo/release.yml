#
# Pin the exact commit of an authenticated forge-ci release. Serve that commit
# and its checksum-bound engine package on your Forgejo instance before use.
#
# Isolated release flow for a Go service: its binaries, and one multi-arch
# container image built from ../Containerfile.example. It is the Go CLI
# release (examples/go-cli/forgejo/) with the image steps added to the build
# job and publish-container-images set.
# Copy to your repo as .forgejo/workflows/release.yml, then replace the
# placeholders. Every one is a literal in the file, so `git grep` finds them:
#
#   FORGE_HOST                    host of your Forgejo instance (with :port if
#                                 it has one), in the action URLs and the
#                                 signer image coordinate
#   OWNER                         organization or user that hosts forge-ci
#                                 on that instance; workflows are called from
#                                 the same instance as OWNER/forge-ci, and
#                                 fetch their own files from the repository
#                                 the forge-ci-repository input names
#   PIN_FORGE_CI_SHA           ONE forge-ci commit SHA, everywhere:
#                                   sed 's/PIN_FORGE_CI_SHA/<sha>/g' .forgejo/workflows/release.yml \
#                                     > .forgejo/workflows/release.yml.new &&
#                                   mv .forgejo/workflows/release.yml.new .forgejo/workflows/release.yml
#                                 (check-l3-isolation fails on mixed pins, and on
#                                 a forge-ci-sha input that is not this commit
#                                 written out)
#   PIN_SIGNER_IMAGE_DIGEST       sha256 digest of the signer image your
#                                 organization built from forge-ci's
#                                 containers/signer/Containerfile
#   PIN_COSIGN_PUBLIC_KEY_SHA256  output of `sha256sum cosign.pub` for your
#                                 organization's Cosign public key
#
# Then:
#
#   1. Fill in each FIXME: the bot identity, the name of your binary and
#      the title of your image.
#   2. Configure the variables CI_RUNNER_LABEL, RELEASE_GIT_URL,
#      RELEASE_GIT_HOST_KEY_FINGERPRINT and COSIGN_PUBLIC_KEY, and the
#      secrets used below. RELEASE_REGISTRY_TOKEN is required here: it may
#      write packages of the repository's owner, and the build job pushes the
#      image with it before the signer signs and promotes it.
#
# Requires Forgejo v16+ (reusable-workflow job expansion, forgejo#8780).
# The shape is three blocks: two reusable-workflow calls around YOUR build
# job — your code never runs in a trust-boundary job, and signing keys never
# enter your job. Enforced at PR time by check-l3-isolation (see
# pullrequest.yml beside this file).
#
#   prepare (forge-ci)  ->  build (yours)  ->  sign-and-publish (forge-ci)
#
# The build job is a Go build with forge-ci's build-go action; build-cargo
# is its Cargo sibling, and any other build works as long as it ends with the
# same hand-off. Something of your own that must pass before a release (a
# token check with verify-forgejo-token, a full test run) is a job of yours
# that prepare `needs:`; the prepare job itself is the reusable workflow.
#
# The image: setup-buildah and registry-login prepare the build job, and
# build-release-image builds every platform into one manifest list, pushes it,
# scans each pushed platform and records it in dist/release-images.json, the
# ledger the signer signs and promotes. docs/forgejo.md#builds has the steps.
name: Release

on:
  push:
    tags:
      # Human-pushed request tags are the immutable release triggers. Forgejo
      # tag filters are globs; prepare's guard-release-tag validates strictly.
      - release-request/v[0-9]*.[0-9]*.[0-9]*

# permissions: is a GitHub field Forgejo ignores (warning per run) --
# kept for Scorecard Token-Permissions and GitHub portability. Real
# restriction is Forgejo's repo-scoped read-default token.
permissions:
  contents: read

jobs:
  # ===========================================================================
  # JOB: prepare — guard the request, fail-fast on enabled pipeline secrets,
  # changelog + final tag. Everything here is forge-ci's pinned code.
  # ===========================================================================
  prepare:
    name: Prepare
    if: success() && startsWith(forgejo.ref, 'refs/tags/')
    uses: OWNER/forge-ci/.forgejo/workflows/prepare-release.yml@PIN_FORGE_CI_SHA
    with:
      runner-label: ${{ vars.CI_RUNNER_LABEL }}
      # The repository and the commit of the uses: line above, written out:
      # the workflow fetches its own files from there.
      forge-ci-repository: OWNER/forge-ci
      forge-ci-sha: PIN_FORGE_CI_SHA
      signer-image: FORGE_HOST/OWNER/forge-ci-signer@sha256:PIN_SIGNER_IMAGE_DIGEST
      bot-name: FIXME Release Bot
      bot-email: FIXME-release-bot@example.com
      # Pin both values from your trusted Forgejo operator. The SSH route may
      # use a different host or port than the Forgejo HTTPS URL.
      release-git-url: ${{ vars.RELEASE_GIT_URL }}
      release-git-host-key-fingerprint: ${{ vars.RELEASE_GIT_HOST_KEY_FINGERPRINT }}
      # Set true after committing and reviewing the configured allowed-signers
      # file. The reusable workflow fails closed on any other boolean spelling.
      verify-release-request-signature: 'false'
      release-request-allowed-signers: .forgejo/release-allowed-signers
      # No distro packages; one container image, so prepare requires the
      # registry token before it pushes anything.
      sign-distro-packages: 'false'
      publish-container-images: 'true'
    secrets:
      # Hand every contract secret over, configured or not. The workflow
      # checks by name, before any checkout, the ones the enabled features
      # need: RELEASE_SSH_SIGNING_KEY, RELEASE_TOKEN and the two RELEASE_COSIGN_*
      # always, the three RELEASE_GPG_* with
      # sign-distro-packages: 'true', RELEASE_REGISTRY_TOKEN with
      # publish-container-images: 'true'. An unconfigured one arrives empty
      # and is named if it is needed.
      RELEASE_SSH_SIGNING_KEY: ${{ secrets.RELEASE_SSH_SIGNING_KEY }}
      RELEASE_COSIGN_PRIVATE_KEY: ${{ secrets.RELEASE_COSIGN_PRIVATE_KEY }}
      RELEASE_COSIGN_PASSPHRASE: ${{ secrets.RELEASE_COSIGN_PASSPHRASE }}
      RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
      RELEASE_GPG_FINGERPRINT: ${{ secrets.RELEASE_GPG_FINGERPRINT }}
      RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      RELEASE_REGISTRY_TOKEN: ${{ secrets.RELEASE_REGISTRY_TOKEN }}

  # ===========================================================================
  # JOB: build — YOURS. Everything into dist/. Zero signing-key references,
  # ever; upload-dist emits the tamper-evidence digest the signer verifies.
  # ===========================================================================
  build:
    name: "Build: release files"
    needs: prepare
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # FIXME: the name of your binary. It also names the Build SBOM.
      ARTIFACT_NAME: FIXME-service
    outputs:
      dist-digest: ${{ steps.dist.outputs.digest }}
    steps:
      - name: Set up forge-ci
        uses: https://FORGE_HOST/OWNER/forge-ci/.forgejo/actions/setup-forge-ci@PIN_FORGE_CI_SHA

      # Engine checkout: sha256-aware and container-friendly (the JS checkout
      # action only recognizes 40-hex commit SHAs, so it cannot check out a
      # prepared release SHA on a sha256 repository). Object format is
      # auto-resolved from the forge.
      - name: Checkout prepared release
        env:
          CHECKOUT_REF: ${{ needs.prepare.outputs.release-sha }}
        run: |
          set -euo pipefail
          forge-ci platform checkout

      # Go and the tools of your mise config; Go from go.mod when the mise
      # config declares none. The build below needs cyclonedx-gomod among the
      # tools for the Build SBOM, and trivy for the image scans.
      - name: Set up toolchain
        uses: https://FORGE_HOST/OWNER/forge-ci/.forgejo/actions/setup-toolchain@PIN_FORGE_CI_SHA
        with:
          cache-key-suffix: release-build
          install-dev-tools: false
          # Release isolation: no cache in token-bearing release jobs.
          cache: 'false'

      # Tests, Build SBOM and one binary per platform, as
      # dist/<os>-<arch>/<name>-<os>-<arch>. The version and the commit are the
      # prepared release's: the runner's own ref and commit are the request's.
      - name: Build
        uses: https://FORGE_HOST/OWNER/forge-ci/.forgejo/actions/build-go@PIN_FORGE_CI_SHA
        with:
          version: ${{ needs.prepare.outputs.release-tag }}
          commit: ${{ needs.prepare.outputs.release-sha }}
          artifact-name: ${{ env.ARTIFACT_NAME }}
          platforms: linux/amd64,linux/arm64

      - name: Set up Buildah
        uses: https://FORGE_HOST/OWNER/forge-ci/.forgejo/actions/setup-buildah@PIN_FORGE_CI_SHA

      # A fresh, job-private credentials file for the pushes below.
      - name: Log in to the container registry
        id: registry-login
        uses: https://FORGE_HOST/OWNER/forge-ci/.forgejo/actions/registry-login@PIN_FORGE_CI_SHA
        with:
          username: ${{ forgejo.repository_owner }}
          token: ${{ secrets.RELEASE_REGISTRY_TOKEN }}

      # One native build per platform from the Containerfile, which compiles
      # the service itself (Pattern B), pushed as one manifest list to
      # <host>/<repository> under the release tag, every platform scanned
      # from the pushed digest, and the image recorded in the ledger.
      - name: Build, scan and record the container image
        uses: https://FORGE_HOST/OWNER/forge-ci/.forgejo/actions/build-release-image@PIN_FORGE_CI_SHA
        with:
          role: runtime
          tag: ${{ needs.prepare.outputs.release-tag }}
          release-tag: ${{ needs.prepare.outputs.release-tag }}
          containerfile: Containerfile
          auth-file: ${{ steps.registry-login.outputs.auth-file }}
          builds: >-
            [{"platform":"linux/amd64","build-args":["VERSION=${{ needs.prepare.outputs.release-tag }}","COMMIT=${{ needs.prepare.outputs.release-sha }}"]},
             {"platform":"linux/arm64","build-args":["VERSION=${{ needs.prepare.outputs.release-tag }}","COMMIT=${{ needs.prepare.outputs.release-sha }}"]}]
          scan-output: dist/trivy-results-runtime-{arch}.json
          # FIXME: the title of your image.
          title: FIXME-service

      # The hand-off the signer takes: the public files, exactly one checksums
      # file covering them, release-notes.md for the release body, and
      # dist/release-files.json, the manifest that declares the public files.
      # `release files declare` writes the checksums file and the manifest
      # from the files named here; the signer runs
      #   forge-ci release files validate --unsigned
      # first, and signs and publishes what the manifest names. The hand-off
      # is unsigned: dist/ holds no <file>.sig or <file>.bundle and no
      # slsa-provenance.intoto.json, because the signer writes those.
      # A release-notes.md you render before this step becomes the release
      # body; without one the body is a stub naming the tag. Render it in the
      # checkout root and list it in .gitignore: GoReleaser refuses a checkout
      # with an untracked file that is not ignored ("git is in a dirty state").
      # A GoReleaser build ends with `release files import-goreleaser`
      # instead, and leaves GoReleaser `signs:` out.
      - name: Declare the release files
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release-sha }}
        run: |
          set -euo pipefail
          cp -- ".forge-ci/go-build-sbom/${ARTIFACT_NAME}/bom.json" "dist/${ARTIFACT_NAME}.cdx.json"
          forge-ci release notes \
            --source-file release-notes.md \
            --target-file dist/release-notes.md \
            --release-version "${RELEASE_TAG}" \
            --release-commit "${RELEASE_SHA}"
          forge-ci release files declare \
            --asset 'dist/*/*' \
            --sbom "dist/${ARTIFACT_NAME}.cdx.json"

      - name: Upload dist/ with hand-off digest
        id: dist
        uses: https://FORGE_HOST/OWNER/forge-ci/.forgejo/actions/upload-dist@PIN_FORGE_CI_SHA
        with:
          artifact-name: build-dist
          path: dist/

  # ===========================================================================
  # JOB: sign-and-publish, the signing secret boundary. The secrets block is
  # the complete, enumerated signing hand-off (never `secrets: inherit`).
  # ===========================================================================
  sign-and-publish:
    name: Sign and publish
    needs: [prepare, build]
    # job-graph-guard: allow reason="reads needs.prepare.outputs but is gated on needs.build.result=='success'; build needs prepare, so build can only succeed if prepare succeeded, making prepare.outputs always present"
    if: ${{ always() && needs.build.result == 'success' }}
    uses: OWNER/forge-ci/.forgejo/workflows/sign-and-publish-release.yml@PIN_FORGE_CI_SHA
    with:
      runner-label: ${{ vars.CI_RUNNER_LABEL }}
      release-tag: ${{ needs.prepare.outputs.release-tag }}
      release-sha: ${{ needs.prepare.outputs.release-sha }}
      # The commit the request tag pushed, from the event context. The signer
      # binds the release commit to it, so do not route this through a job
      # output: a value that travels with the release is not evidence about it.
      release-request-sha: ${{ forgejo.sha }}
      dist-digest: ${{ needs.build.outputs.dist-digest }}
      artifact-name: build-dist
      artifact-path: dist/
      release-images-path: dist/release-images.json
      caller-workflow: release.yml
      forge-ci-repository: OWNER/forge-ci
      forge-ci-sha: PIN_FORGE_CI_SHA
      sign-distro-packages: 'false'
      # Your organization's signer image, by digest. forge-ci ships the
      # Containerfile and publishes no image.
      signer-image: FORGE_HOST/OWNER/forge-ci-signer@sha256:PIN_SIGNER_IMAGE_DIGEST
      # Your organization's Cosign trust root; forge-ci ships no key. A
      # public key is not a secret, so it may come from a variable. Keep the
      # digest a literal here: it is what binds a key read from a variable to
      # this reviewed file.
      cosign-public-key: ${{ vars.COSIGN_PUBLIC_KEY }}
      cosign-public-key-sha256: PIN_COSIGN_PUBLIC_KEY_SHA256
      # Signatures are verified against your key alone and nothing is written
      # to the public Sigstore transparency log. `transparency-log: public`
      # here writes every signature to it, permanently; see docs/forgejo.md.
    secrets:
      # The same complete hand-off; the signer uses the GPG and registry
      # secrets only for distro packages and images.
      RELEASE_COSIGN_PRIVATE_KEY: ${{ secrets.RELEASE_COSIGN_PRIVATE_KEY }}
      RELEASE_COSIGN_PASSPHRASE: ${{ secrets.RELEASE_COSIGN_PASSPHRASE }}
      RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
      RELEASE_GPG_FINGERPRINT: ${{ secrets.RELEASE_GPG_FINGERPRINT }}
      RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      RELEASE_REGISTRY_TOKEN: ${{ secrets.RELEASE_REGISTRY_TOKEN }}

  # ===========================================================================
  # JOB: summary — the release overview; Forgejo 17 shows it above the logs,
  # older Forgejo prints it in this job's log.
  # ===========================================================================
  summary:
    name: Summary
    if: ${{ always() && startsWith(forgejo.ref, 'refs/tags/') }}
    needs: [prepare, build, sign-and-publish]
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    timeout-minutes: 5
    steps:
      - name: Set up forge-ci
        uses: https://FORGE_HOST/OWNER/forge-ci/.forgejo/actions/setup-forge-ci@PIN_FORGE_CI_SHA

      - name: Write the release summary
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release-tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.release-sha }}
          RELEASE_ACTOR: ${{ forgejo.actor }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.sign-and-publish.result }}
        run: |
          forge-ci report release \
            --job "Prepare=${PREPARE_RESULT}" \
            --job "Build: release files=${BUILD_RESULT}" \
            --job "Sign and publish=${PUBLISH_RESULT}"
