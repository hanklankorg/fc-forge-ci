# Copy to .forge-ci/images.yml. Unlike artifacts.yml (container-first
# builds with extraction), Forgejo builds the binaries before the image jobs.
containers:
  - name: my-service
    container-file: Containerfile.forgejo
    context: .
    platforms: linux/amd64,linux/arm64
