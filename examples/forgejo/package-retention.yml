# Copy into a consumer repository after setting PACKAGE_RETENTION_MATRIX to
# {"include":[{"package":"runtime","digest":"sha256:<consumer digest>"}]}.
# Replace FORGE_CI_COMMIT with a published immutable engine revision.
# Schedules only preview; an operator applies the reviewed policy separately.
name: Preview package retention
on:
  schedule:
    - cron: '19 4 * * 1'
  workflow_dispatch:
concurrency:
  group: package-retention
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABEL) }}
    container: ${{ vars.CI_JOB_IMAGE }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      # Reviewed supported-consumer pins, maintained alongside consumer pins.
      # Recent-count alone must never evict an older image still in use.
      matrix: ${{ fromJSON(vars.PACKAGE_RETENTION_MATRIX) }}
    steps:
      - name: Set up the published checkout engine
        uses: https://forge.example/owner/forge-ci/.forgejo/actions/setup-forge-ci@FORGE_CI_COMMIT
      - name: Preview the reviewed policy
        env:
          IMAGE_PACKAGE: ${{ matrix.package }}
          KEEP_DIGEST: ${{ matrix.digest }}
          GH_TOKEN: ${{ secrets.RELEASE_REGISTRY_TOKEN }}
          REGISTRY_USER: ${{ vars.RELEASE_REGISTRY_USER }}
          RUNTIME_IMAGE_NAMESPACE: ${{ vars.RUNTIME_IMAGE_NAMESPACE }}
        run: |
          set -euo pipefail
          forge-ci container package-retention \
            --repository "${RUNTIME_IMAGE_NAMESPACE:?}/${IMAGE_PACKAGE:?}" --keep-digest "${KEEP_DIGEST:?}" \
            --recent-count 10 --max-delete 100 \
            --registry-username "${REGISTRY_USER:?set RELEASE_REGISTRY_USER}" --dry-run=true
