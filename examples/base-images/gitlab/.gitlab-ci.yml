#
# Example: the merge-request gate of a project whose product is a graph of
# base images, on GitLab CI/CD, from the components under templates/
# (https://gitlab.example.com/team/ci/forge-ci/-/blob/PIN_FORGE_CI_SHA/docs/gitlab.md).
# Copy to the project's
# .gitlab-ci.yml and replace the placeholders, all literal so that
# `git grep` finds them:
#
#   gitlab.example.com                        your instance
#   team/ci/forge-ci (forge-ci-repository)    the project on it that serves
#                                             forge-ci, including subgroups
#   PIN_FORGE_CI_SHA                          the engine commit you authenticated:
#                                             `check` is checksum-bound and must be
#                                             included by full commit SHA
#   PIN_DIGEST, PIN_IMAGE_DIGEST              digests of the reviewed images
#
# The pipeline status is the gate: GitLab fails the pipeline, and the merge
# request, when any job fails. Require successful pipelines and refuse merging
# on skipped ones in the project settings.
#
# Releases do not run from this file. The native release runs from a separate,
# pinned policy project that includes the `release` component and names the
# graph as `base-stages` and the planner as `base-plan`; see
# https://gitlab.example.com/team/ci/forge-ci/-/blob/PIN_FORGE_CI_SHA/docs/gitlab.md#base-images.
# Once that policy is the
# project's CI configuration path, GitLab runs it instead of this file, so the
# policy includes this gate for merge requests; see
# https://gitlab.example.com/team/ci/forge-ci/-/blob/PIN_FORGE_CI_SHA/docs/gitlab.md#the-merge-request-gate-under-a-policy.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - test

include:
  # The lint gate: the project's nanolinter.toml plan in the core flavour,
  # with the secrets floor, and its findings as a SAST report.
  - component: gitlab.example.com/team/ci/forge-ci/nanolinter@0.90.0
    inputs:
      forge-ci-repository: team/ci/forge-ci
      server-url: https://gitlab.example.com
      nanolinter-image: "ghcr.io/itiquette/nanolinter:core@sha256:PIN_DIGEST"

  # The planner's own check at the pipeline commit, in an image that carries
  # Bash, Git, curl and sha256sum. It builds no image: the base stage of the
  # release policy does.
  # check is checksum-bound: include it by the engine commit, never a version;
  # see Checksum-bound engine bootstrap in
  # https://gitlab.example.com/team/ci/forge-ci/-/blob/PIN_FORGE_CI_SHA/docs/gitlab.md.
  - component: gitlab.example.com/team/ci/forge-ci/check@PIN_FORGE_CI_SHA
    inputs:
      forge-ci-repository: team/ci/forge-ci
      server-url: https://gitlab.example.com
      job-image: registry.example.com/team/check-tools@sha256:PIN_IMAGE_DIGEST
      commands:
        - bash .gitlab/check-release.sh
