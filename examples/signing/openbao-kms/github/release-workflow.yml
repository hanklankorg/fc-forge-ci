name: Release Workflow
on:
  push:
    tags:
      - "release-request/v*"
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    uses: diggsweden/forge-ci/.github/workflows/release-orchestrator.yml@v0.90.0
    permissions:
      contents: write
      packages: write
      # id-token: write lets an organization-owned wrapper mint a GitHub OIDC
      # JWT and send it to the private OpenBao auth endpoint in exchange for a
      # short-lived VAULT_TOKEN. The JWT crosses the network to OpenBao; the
      # OpenBao signing key never leaves the server.
      id-token: write
      actions: read
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      # GPG signs the release commit and tag and the Maven Central upload.
      RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
      RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
      RELEASE_GPG_PUBLIC_KEY: ${{ secrets.RELEASE_GPG_PUBLIC_KEY }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
    with:
      branch: main
      forge-ci-binary-ref: v0.90.0
      artifacts-config: .forge-ci/artifacts.yml
      changelog-creator: git-cliff
      release-publisher: github-cli
      release.attachartifacts: target/*.jar
    # This generic orchestrator does not perform the OpenBao JWT exchange and a
    # `uses:` job cannot receive `env:` from this caller. Before adopting this
    # example, use an organization-owned wrapper/fork that authenticates to
    # OpenBao and exposes VAULT_ADDR + the short-lived VAULT_TOKEN to every
    # cosign signing/attestation step. Do not use a long-lived Vault token.
