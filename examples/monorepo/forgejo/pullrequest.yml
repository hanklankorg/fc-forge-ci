#
# PRE-RELEASE: do not copy or pin this template from a mutable branch. No
# tagged forge-ci release carries the Forgejo layer yet. Use it only from a
# release you have authenticated, and pin that exact commit.
#
# Minimal PR workflow for a monorepo consumer of forge-ci's Forgejo layer: the
# lint gate over the whole tree, and each project's own checks in the image
# of its toolchain, as the GitLab gate beside this directory runs them. Copy
# to your repo as .forgejo/workflows/pullrequest.yml and replace the
# placeholders with the SAME values as in release.yml: FORGE_HOST (host of
# your Forgejo instance), OWNER (who hosts forge-ci there) and
# PIN_FORGE_CI_SHA:
#
#   sed 's/PIN_FORGE_CI_SHA/<sha>/g' .forgejo/workflows/pullrequest.yml \
#     > .forgejo/workflows/pullrequest.yml.new &&
#   mv .forgejo/workflows/pullrequest.yml.new .forgejo/workflows/pullrequest.yml
#
# Four jobs, none of which receives a secret:
#
#   lint            the repository's nanolinter plan, with a floor of checks
#                   its nanolinter.toml cannot switch off
#   trust-boundary  the release-isolation gate: it statically verifies
#                   release.yml's secret boundaries on every PR (the hand-off
#                   job holds no signing keys, the signer call site enumerates
#                   its secrets, and every forge-ci ref carries one identical
#                   pin)
#   check-backend   the Maven service's tests and package
#   check-frontend  the npm service's locked install and tests
#
# lint and check-backend run in the image named by the variable CI_JOB_IMAGE:
# a nanolinter image of the java flavour (nanolinter, its check tools, a JDK
# and Maven), pinned by digest. check-frontend runs in CI_JOB_IMAGE_NODE, one
# of the javascript-typescript flavour (Node and npm). PR jobs use the runner
# selected by CI_RUNNER_LABEL and the tools of those images: never pass
# secrets or rate-limit tokens, or execute a shipped-product black-box test
# here.
name: Pull Request

on:
  pull_request:
    branches: [main]

env:
  # Trust the checked-out tree whoever owns the job container's workspace
  # mount: the images run as their own user.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: '*'

jobs:
  lint:
    name: "Check: lint"
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABEL) }}
    container:
      image: ${{ vars.CI_JOB_IMAGE }}
    timeout-minutes: 15
    steps:
      # Checkout without Node, which the image does not have. fetch-base
      # brings the pull request's base branch for the commit-range and diff checks.
      - name: Checkout repository
        uses: https://FORGE_HOST/OWNER/forge-ci/.forgejo/actions/checkout-consumer@PIN_FORGE_CI_SHA
        with:
          fetch-base: ${{ forgejo.base_ref }}

      # The default floor is secrets,sast. Forgejo ingests no SARIF, so the
      # findings are in this step's log.
      - name: Lint
        uses: https://FORGE_HOST/OWNER/forge-ci/.forgejo/actions/lint-nanolinter@PIN_FORGE_CI_SHA

  trust-boundary:
    name: "Check: release isolation"
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABEL) }}
    timeout-minutes: 10
    steps:
      - name: Set up forge-ci
        uses: https://FORGE_HOST/OWNER/forge-ci/.forgejo/actions/setup-forge-ci@PIN_FORGE_CI_SHA

      # Engine checkout: sha256-aware, node-free, never persists credentials.
      - name: Checkout repository
        run: |
          set -euo pipefail
          forge-ci platform checkout --depth 1

      - name: Verify release isolation boundaries
        uses: https://FORGE_HOST/OWNER/forge-ci/.forgejo/actions/check-l3-isolation@PIN_FORGE_CI_SHA
        with:
          # The hand-off joins both projects' release files and the image
          # ledger; its upload-dist digest is the signer's only artifact input.
          build-job: handoff
          dist-digest-output: dist_digest

  check-backend:
    name: "Check: backend"
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABEL) }}
    container:
      image: ${{ vars.CI_JOB_IMAGE }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: https://FORGE_HOST/OWNER/forge-ci/.forgejo/actions/checkout-consumer@PIN_FORGE_CI_SHA

      - name: Build and test
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress --file services/backend/pom.xml verify

  check-frontend:
    name: "Check: frontend"
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABEL) }}
    container:
      image: ${{ vars.CI_JOB_IMAGE_NODE }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: https://FORGE_HOST/OWNER/forge-ci/.forgejo/actions/checkout-consumer@PIN_FORGE_CI_SHA

      - name: Install and test
        run: |
          set -euo pipefail
          npm --prefix packages/frontend ci --no-audit --no-fund
          npm --prefix packages/frontend test

  # ===========================================================================
  # JOB: summary — the pull request overview; Forgejo 17 shows it above the
  # logs, older Forgejo prints it in this job's log.
  # ===========================================================================
  summary:
    name: Summary
    if: ${{ always() }}
    needs: [lint, trust-boundary, check-backend, check-frontend]
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABEL) }}
    timeout-minutes: 5
    steps:
      - name: Set up forge-ci
        uses: https://FORGE_HOST/OWNER/forge-ci/.forgejo/actions/setup-forge-ci@PIN_FORGE_CI_SHA

      - name: Write the pull request summary
        env:
          CI_RUN_URL: ${{ forgejo.server_url }}/${{ forgejo.repository }}/actions/runs/${{ forgejo.run_number }}
          PROJECT_TYPE: monorepo
          CI_BRANCH: ${{ forgejo.head_ref }}
          LINT_RESULT: ${{ needs.lint.result }}
          ISOLATION_RESULT: ${{ needs.trust-boundary.result }}
          BACKEND_RESULT: ${{ needs.check-backend.result }}
          FRONTEND_RESULT: ${{ needs.check-frontend.result }}
        run: |
          forge-ci report pr \
            --job "Check: lint=${LINT_RESULT}" \
            --job "Check: release isolation=${ISOLATION_RESULT}" \
            --job "Check: backend=${BACKEND_RESULT}" \
            --job "Check: frontend=${FRONTEND_RESULT}"
