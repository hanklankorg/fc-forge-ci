#
# Example: a monorepo's merge-request gate and plan-driven build fan-out on
# GitLab CI/CD, from the components under templates/ (docs/gitlab.md). Copy
# to the project's .gitlab-ci.yml and replace the placeholders, all literal
# so that `git grep` finds them:
#
#   gitlab.example.com                   your instance
#   team/ci/forge-ci (engine-project)    the project on it that serves
#                                        forge-ci, including subgroups
#   PIN_FORGE_CI_SHA                     the engine commit you authenticated:
#                                        `check` is checksum-bound and must be
#                                        included by full commit SHA
#   PIN_DIGEST, PIN_IMAGE_DIGEST         digests of the reviewed images
#
# GitHub expands the per-artifact build matrix natively, with a matrix over
# the plan. GitLab cannot expand a matrix from a value computed at run time,
# so the fan-out is materialised: a prepare job generates a child pipeline
# from the same plan JSON, one include of a build-<ecosystem> component per
# artifact of .forge-ci/artifacts.yml, and a trigger job runs it. The
# generator refuses a plan that names a component that does not exist, so no
# planned build is silently left out.
#
# Releases run from a separate, pinned policy project that includes the
# `release` component; see docs/gitlab.md#native-release-policy-under-acceptance.
#
# Once the release policy is the project's CI configuration path, GitLab runs
# it instead of this file, so the policy includes this gate for merge
# requests; see docs/gitlab.md#the-merge-request-gate-under-a-policy.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - test
  - prepare
  - build

include:
  # The lint gate: the project's nanolinter.toml plan, with the secrets,sast
  # floor. The core flavour carries only the ecosystem-neutral checks; pick
  # the java or javascript-typescript flavour for the stack you lint most.
  - component: gitlab.example.com/team/ci/forge-ci/nanolinter@0.90.0
    inputs:
      engine-project: team/ci/forge-ci
      nanolinter-image: "ghcr.io/itiquette/nanolinter:core@sha256:PIN_DIGEST"

  # The consumer's own checks at the pipeline commit, in an image that carries
  # Bash, Git, curl, sha256sum, a JDK with Maven, and Node.
  # check is checksum-bound: include it by the engine commit, never a version;
  # see Checksum-bound engine bootstrap in docs/gitlab.md.
  - component: gitlab.example.com/team/ci/forge-ci/check@PIN_FORGE_CI_SHA
    inputs:
      engine-project: team/ci/forge-ci
      job-image: registry.example.com/team/check-tools@sha256:PIN_IMAGE_DIGEST
      commands:
        - mvn --batch-mode --no-transfer-progress --file services/backend/pom.xml verify
        - npm --prefix packages/frontend ci
        - npm --prefix packages/frontend test

# Compute the build-stage plan from .forge-ci/artifacts.yml, then write the
# child pipeline: one build-<ecosystem> include per artifact, with its
# job-name, working-directory, build-type and version.
generate-build-pipeline:
  stage: prepare
  image: "ghcr.io/diggsweden/forge-ci-runtime-base:v0.90.0"
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    CI_OUTPUT: plan.env
  script:
    - forge-ci config parse-artifacts
    - forge-ci plan release --tag "$CI_COMMIT_TAG"
    - |
      forge-ci plan gitlab-build-pipeline \
        --component-base "gitlab.example.com/team/ci/forge-ci" \
        --component-ref 0.90.0 \
        --version "$CI_COMMIT_TAG" \
        --output build-pipeline.yml
  artifacts:
    reports:
      dotenv: plan.env
    paths:
      - build-pipeline.yml

# Run the generated child pipeline: the per-artifact builds.
build:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - generate-build-pipeline
  trigger:
    include:
      - artifact: build-pipeline.yml
        job: generate-build-pipeline
    strategy: mirror
