# nanolinter verify plan: the forge-ci lint gate runs `nanolinter verify` against
# it, with `secrets,sast` as the floor. `nanolinter explain --all` lists more checks.

[detect]
auto = true

[verify]
checks = [
  "secrets",
  "sast",
  "commits",
  "yaml",
  "markdown",
  "shell",
  "node-eslint",
  "node-format",
]

[policy]
block = [
  "secrets",
  "sast",
  "commits",
  "yaml",
  "markdown",
  "shell",
  "node-eslint",
  "node-format",
]
