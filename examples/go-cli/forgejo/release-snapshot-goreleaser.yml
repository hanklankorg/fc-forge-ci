# Alternative to release-snapshot-workflow.yml, beside release-goreleaser.yml:
# copy this file AS .forgejo/workflows/release-snapshot-workflow.yml. It is a
# dry run of that release: the same .goreleaser.yml, tools and import, on the
# pushed commit under forge-ci's snapshot version, and it signs and publishes
# nothing. The unsigned files stay a run artifact for 7 days. Replace the same
# reviewed pin as the release, after publication.
name: Release Snapshot
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
concurrency:
  group: snapshot-${{ forgejo.repository }}-${{ forgejo.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABEL) }}
    timeout-minutes: 45
    steps:
      - uses: https://FORGE_HOST/OWNER/forge-ci/.forgejo/actions/setup-forge-ci@PIN_FORGE_CI_SHA
      # As the release checks out: the tags give the snapshot its base
      # version and GoReleaser its previous tag.
      - name: Checkout pushed commit
        env:
          CHECKOUT_REF: ${{ forgejo.sha }}
        run: forge-ci platform checkout --fetch-all-refs
      - uses: https://FORGE_HOST/OWNER/forge-ci/.forgejo/actions/setup-toolchain@PIN_FORGE_CI_SHA
        with:
          cache-key-suffix: snapshot-build
          cache: "false"
          mise-locked: "true"
          install-dev-tools: false
          tools: go aqua:goreleaser/goreleaser aqua:anchore/syft
      - name: Test the source
        run: forge-ci policy tests --protocol go-json -- go test -json ./...
      - uses: https://FORGE_HOST/OWNER/forge-ci/.forgejo/actions/build-goreleaser@PIN_FORGE_CI_SHA
        with:
          snapshot: "true"
      - uses: https://FORGE_HOST/OWNER/forge-ci/.forgejo/actions/upload-dist@PIN_FORGE_CI_SHA
        with:
          artifact-name: snapshot-files
          prune-dirs: "true"
          retention-days: "7"
