#
# forge-ci's OWN GitLab pipeline (the GitLab analog of .github/workflows/
# self-*.yml), distinct from the consumable components under templates/. It:
#   1. self-tests the nanolinter component from this project at $CI_COMMIT_SHA,
#      included as a component so it renders as consumers get it, without a
#      release;
#   2. publishes the components to the CI/CD Catalog on a semver tag, using the
#      `release` keyword (required by GitLab — not the Releases API).
#
# Prerequisite for publication: mark the project as a CI/CD Catalog project
# (Settings > CI/CD > Catalog) and give it a description. Provider acceptance
# requirements are documented in docs/providers.md and docs/testing.md.
stages:
  - test
  - release

include:
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/nanolinter@$CI_COMMIT_SHA
    inputs:
      job-name: selftest-nanolinter
      forge-ci-repository: $CI_PROJECT_PATH
      # forge-ci is a Go + just project; use the Go flavour to self-test.
      nanolinter-image: "ghcr.io/itiquette/nanolinter:go"
      # Keep the self-test hermetic: the SAST step needs this commit's engine
      # binary in the project's generic packages, which an unpublished commit
      # does not have. The conversion itself is covered by
      # the Go unit tests (internal/domain/security/sast_test.go); consumers get
      # it on by default. This only exercises the component render + lint gate.
      enable-gitlab-sast: false

# Publish to the CI/CD Catalog when a semver tag is pushed.
create-release:
  stage: release
  # GitLab's release keyword uses glab; release-cli is deprecated.
  image: registry.gitlab.com/gitlab-org/cli:v1.122.0@sha256:ca113f949a17d119984884b8937ae7aeff7b471ecaafc6ade015cc9c23707fc9
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
  script:
    - echo "Releasing $CI_COMMIT_TAG to the CI/CD Catalog"
  release:
    tag_name: $CI_COMMIT_TAG
    description: "forge-ci GitLab CI/CD Catalog components — $CI_COMMIT_TAG"
