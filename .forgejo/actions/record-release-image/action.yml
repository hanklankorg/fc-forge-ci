name: Record release image
description: >-
  Append one validated entry to the release image ledger (dist/release-images.json) consumed by sign-and-publish-release.yml. Call once per image you pushed. The signer re-validates and remains the sole authority.
inputs:
  role:
    description: Image role recorded in the ledger and SLSA predicate, e.g. distroless, alpine, base.
    required: true
  image:
    description: Registry path without tag or digest, e.g. forge.example/owner/repo.
    required: true
  digest:
    description: "Image digest from your push, sha256:<64 hex>."
    required: true
  tag:
    description: Final tag this image carries at release (the tag portion, e.g. v1.2.3 or v1.2.3-alpine). Must be scoped to the release tag.
    required: true
  release-tag:
    description: Stable release tag that scopes immutable image tags, e.g. v1.2.3.
    required: false
    default: ''
  sbom:
    description: "Path of the image's CycloneDX SBOM, which must exist, directly in dist/ and named as image SBOMs are on every forge: <flavor|role>-<version>-<sha>-analyzed-container-<os>-<arch>-sbom.cyclonedx.json for a single-platform image or <flavor|role>-<version>-<sha>-analyzed-container-index-sbom.cyclonedx.json for an index, the version being release-tag without its v and the sha the first seven characters of the release commit. The engine writes the single-platform name when it assembles the image SBOM in container mode with the flavor or role as its repository. Defaults to that name for platform and the checked-out commit. It is recorded with its SHA-256 and goes into the release's SBOM bundle; the signer attests exactly that file."
    required: false
    default: ''
  platform:
    description: Platform the default sbom name carries, os/arch.
    required: false
    default: linux/amd64
  candidate-tag:
    description: Optional staging tag portion (e.g. staging-v1.2.3) for promotion flows; empty for direct-push.
    required: false
    default: ''
  candidate:
    description: Derive candidate-tag as staging-<tag>. Mutually exclusive with candidate-tag; useful when the build step only needs to signal that it pushed a candidate.
    required: false
    default: 'false'
  moving-tag:
    description: Optional moving tag portion (e.g. latest); empty if unused.
    required: false
    default: ''
  flavor:
    description: Optional base-image flavour; empty for single-image releases.
    required: false
    default: ''
  base-ref:
    description: Optional digest-pinned base image this was built from, for SLSA lineage.
    required: false
    default: ''
  base-input-id:
    description: Optional base-image input identifier, for SLSA lineage.
    required: false
    default: ''
  ledger:
    description: Ledger path under dist/.
    required: false
    default: dist/release-images.json

runs:
  using: composite
  steps:
    - name: Record release image in ledger
      shell: bash
      env:
        INPUT_ROLE: ${{ inputs.role }}
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_DIGEST: ${{ inputs.digest }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_RELEASE_TAG: ${{ inputs['release-tag'] }}
        INPUT_SBOM: ${{ inputs.sbom }}
        INPUT_PLATFORM: ${{ inputs.platform }}
        INPUT_CANDIDATE_TAG: ${{ inputs['candidate-tag'] }}
        INPUT_CANDIDATE: ${{ inputs.candidate }}
        INPUT_MOVING_TAG: ${{ inputs['moving-tag'] }}
        INPUT_FLAVOR: ${{ inputs.flavor }}
        INPUT_BASE_REF: ${{ inputs['base-ref'] }}
        INPUT_BASE_INPUT_ID: ${{ inputs['base-input-id'] }}
        INPUT_LEDGER: ${{ inputs.ledger }}
      run: |
        set -euo pipefail
        # shellcheck source=.engine/bin/lib-forge-ci.sh
        source "${GITHUB_ACTION_PATH}/../../../.engine/bin/lib-forge-ci.sh"
        # Every released image's SBOM is in the release's SBOM bundle, which
        # is final before the signer runs, so the ledger pins the build's file.
        sbom=${INPUT_SBOM:-}
        if [ -z "${sbom}" ]; then
          name=${INPUT_FLAVOR:-${INPUT_ROLE:?role is required}}
          version=${INPUT_RELEASE_TAG:?release-tag is required for the default sbom name}
          platform=${INPUT_PLATFORM:-linux/amd64}
          sha=$(git rev-parse HEAD)
          sbom="dist/${name}-${version#v}-${sha:0:7}-analyzed-container-${platform//\//-}-sbom.cyclonedx.json"
        fi
        if [ ! -f "${sbom}" ] || [ -L "${sbom}" ]; then
          echo "ERROR: no SBOM at ${sbom}: write the image's CycloneDX SBOM there before recording the image" >&2
          exit 1
        fi
        sbom_sha256=$(sha256sum -- "${sbom}")
        LEDGER_DERIVE_CANDIDATE_TAG="${INPUT_CANDIDATE:-false}" run_forge_ci container ledger add \
          --ledger "${INPUT_LEDGER:-dist/release-images.json}" \
          --role "${INPUT_ROLE:?role is required}" \
          --image-name "${INPUT_IMAGE:?image is required}" \
          --digest "${INPUT_DIGEST:?digest is required}" \
          --final-tag-name "${INPUT_TAG:?tag is required}" \
          --sbom "${sbom}" \
          --sbom-sha256 "${sbom_sha256%% *}" \
          --tag "${INPUT_RELEASE_TAG}" \
          --flavor "${INPUT_FLAVOR}" \
          --candidate-tag-name "${INPUT_CANDIDATE_TAG}" \
          --moving-tag-name "${INPUT_MOVING_TAG}" \
          --base-ref "${INPUT_BASE_REF}" \
          --base-input-id "${INPUT_BASE_INPUT_ID}"
