name: 'Release tag guard'
description: >-
  Fail fast unless the final release tag is stable semver (vMAJOR.MINOR.PATCH). Forgejo matches tag triggers with globs, which can only approximate semver, so every release consumer needs a regex gate before any signing/build work runs — and it must reject pre-releases / build-metadata tags. The input may be the final tag or an immutable release-request/vMAJOR.MINOR.PATCH tag.
inputs:
  tag:
    description: Final tag or release-request tag to validate. Defaults to the triggering ref name.
    required: false
    default: ${{ github.ref_name }}
  pattern:
    description: >-
      Extended regex the tag must fully match. Default accepts only stable vMAJOR.MINOR.PATCH (no pre-release suffix, no build metadata).
    required: false
    default: '^v[0-9]+[.][0-9]+[.][0-9]+$'

outputs:
  release-tag:
    description: Final release tag that matched the pattern.
    value: ${{ steps.guard.outputs.release-tag }}
  release-request:
    description: Request tag when the input was release-request/vMAJOR.MINOR.PATCH, otherwise empty.
    value: ${{ steps.guard.outputs.release-request }}

runs:
  using: composite
  steps:
    - name: Reject non-stable release tag
      id: guard
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.tag }}
        RELEASE_TAG_PATTERN: ${{ inputs.pattern }}
      run: |
        set -euo pipefail
        # shellcheck source=.forgejo/bin/lib-forge-ci.sh
        source "${GITHUB_ACTION_PATH}/../../bin/lib-forge-ci.sh"
        FORGE_CI_PROVIDER=forgejo run_forge_ci validate tag release-guard \
          --tag "${RELEASE_TAG:?}" \
          --pattern "${RELEASE_TAG_PATTERN:?}"
