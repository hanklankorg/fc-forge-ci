name: 'Release tag guard'
description: >-
  Validate the final tag against RELEASE_POLICY (stable by default). The input may be a final tag or a signed release-request tag; build metadata is rejected.
inputs:
  tag:
    description: Final tag or release-request tag to validate. Defaults to the triggering ref name.
    required: false
    default: ${{ github.ref_name }}
  pattern:
    description: >-
      Optional additional anchored regex restriction; it cannot widen the release policy.
    required: false
    default: ''

outputs:
  release-tag:
    description: Final release tag that matched the pattern.
    value: ${{ steps.guard.outputs.release-tag }}
  release-request:
    description: Request tag when the input was release-request/vMAJOR.MINOR.PATCH, otherwise empty.
    value: ${{ steps.guard.outputs.release-request }}

runs:
  using: composite
  steps:
    - name: Validate release tag
      id: guard
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.tag }}
        RELEASE_TAG_PATTERN: ${{ inputs.pattern }}
      run: |
        set -euo pipefail
        # shellcheck source=.engine/bin/lib-forge-ci.sh
        source "${GITHUB_ACTION_PATH}/../../../.engine/bin/lib-forge-ci.sh"
        FORGE_CI_PROVIDER=forgejo run_forge_ci validate tag release-guard \
          --tag "${RELEASE_TAG:?}" \
          --pattern "${RELEASE_TAG_PATTERN:-}"
