name: 'Lint with nanolinter'
description: >-
  The pull-request lint gate: run the repository's nanolinter plan with a mandated floor of checks that its nanolinter.toml cannot switch off. The step runs the nanolinter the job already has, so run the job in a nanolinter image, or on a runner that provides the pinned nanolinter and its tools. It needs no secret. The admin policy is applied by the forge-ci engine this action pins: it is downloaded from the forge's package registry and checksum-verified, unless the job already holds that verified build or FORGE_CI_BIN names one (checksum-verified too). A blocking finding fails the step.
inputs:
  required-lints:
    description: >-
      Mandated lint floor: comma-separated check ids passed to `nanolinter verify --require`. These checks run and block whatever the repository's nanolinter.toml says, and disable-checks cannot remove them. Empty disables the floor.
    required: false
    default: secrets,sast
  disable-checks:
    description: >-
      Comma-separated check ids to leave out of this run, for example the network-backed scans a separate job owns.
    required: false
    default: ''
  offline:
    description: >-
      'true' passes --offline: checks that need the network are skipped and tools use their caches. For a runner or job image without network access, which must then also provide the pinned forge-ci engine through FORGE_CI_BIN.
    required: false
    default: 'false'
  enforce-lint:
    description: >-
      Enforcement setting, true or false: false reports lint findings without failing the step; the checks still run. Set it only in the administrator's entry point, since whoever writes this call can pass it; it is the administrator's only where that file is. See docs/admin-policy.md.
    required: false
    default: 'false'
  enforce-vulnerabilities:
    description: >-
      Enforcement setting, true or false: false reports vulnerability findings without failing the step; the scans still run. Set it only in the administrator's entry point, since whoever writes this call can pass it; it is the administrator's only where that file is. See docs/admin-policy.md.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Run nanolinter verify
      shell: bash
      env:
        LINT_REQUIRED_LINTS: ${{ inputs.required-lints }}
        LINT_DISABLE_CHECKS: ${{ inputs.disable-checks }}
        LINT_OFFLINE: ${{ inputs.offline }}
        LINT_ADMIN_LINT: ${{ inputs.enforce-lint }}
        LINT_ADMIN_VULNERABILITIES: ${{ inputs.enforce-vulnerabilities }}
      run: |
        set -euo pipefail
        if ! command -v nanolinter >/dev/null 2>&1; then
          echo "ERROR: nanolinter is not on PATH: run this job in a nanolinter image, or on a runner that provides it" >&2
          exit 69
        fi
        # Read repository files consistently, including Unicode ignore files.
        # The action's own immutable engine owns policy. A consumer PATH or
        # FORGE_CI_BIN replacement cannot select a more permissive engine.
        # shellcheck source=.engine/bin/lib-forge-ci.sh
        source "${GITHUB_ACTION_PATH}/../../../.engine/bin/lib-forge-ci.sh"
        if [ -z "${FORGE_CI_BIN:-}" ] && ! fetch_forge_ci; then
          if [ "${LINT_OFFLINE}" = true ]; then
            echo "  offline: true cannot download the engine either: set FORGE_CI_BIN to the pinned forge-ci build (its checksum is verified)" >&2
          fi
          exit 69
        fi
        SIGNER_STRICT=1 verify_forge_ci
        LANG=C.UTF-8 LC_ALL=C.UTF-8 run_forge_ci policy nanolinter \
          --enforce-lint="${LINT_ADMIN_LINT:?enforce-lint is required}" \
          --enforce-vulnerabilities="${LINT_ADMIN_VULNERABILITIES:?enforce-vulnerabilities is required}" \
          --required-lints "${LINT_REQUIRED_LINTS}" \
          --disable-checks "${LINT_DISABLE_CHECKS}" \
          --offline "${LINT_OFFLINE}"
