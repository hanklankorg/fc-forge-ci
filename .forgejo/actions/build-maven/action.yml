name: 'Build Maven'
description: >-
  The build step of a consumer's own job for a Maven project: one `forge-ci build maven run`, the same sequence GitHub's build-maven workflow and GitLab's build-maven component run: install, the app or library lifecycle with its tests, and the CycloneDX Build SBOM. JARs, WARs and POMs land in <working-directory>/target/ (and each module's target/), and the SBOM as target/bom.json. The job copies what it releases into dist/ and declares it with `forge-ci release files declare`. A library build (build-type: lib) also uploads the build hand-off GitHub's workflow uploads, the POMs and the built JARs as the run artifact maven-build-artifacts, which publish-forge-packages publishes with from-build; an application build uploads nothing. The job brings the toolchain: a JDK and Maven (see setup-toolchain, or a job image). The step holds no secret.
inputs:
  version:
    description: >-
      Release version the project must already declare, with or without a leading v, also exposed to the build as FORGE_CI_VERSION; any other declared version fails the build before it packages. In a release it is the prepare job's release-tag, which the release commit carries when prepare-release.yml runs with version-bump: maven. Empty, for a pull request, checks nothing.
    required: false
    default: ''
  commit:
    description: >-
      Commit exposed to the build as FORGE_CI_COMMIT, for a POM that records it. Required: in a release it is the prepare job's release-sha, which the event commit is not.
    required: true
  build-type:
    description: "Lifecycle: 'app' (clean package) or 'lib' (compile/test/package with an optional profile; the POM owns attached sources and javadoc)."
    required: true
  working-directory:
    description: Directory containing pom.xml, relative to the workspace.
    required: false
    default: '.'
  profile:
    description: Maven profile to activate (library builds).
    required: false
    default: ''
  private-dependencies:
    description: "'true' uses the caller's read-scoped DEPENDENCY_TOKEN in trusted builds; never supply it to an untrusted PR."
    required: false
    default: 'false'
  settings-path:
    description: Consumer-owned settings.xml relative to working-directory; required with private-dependencies.
    required: false
    default: ''
  skip-tests:
    description: "Legacy input; true is refused. Admin policy controls findings, and tests still run."
    required: false
    default: 'false'
  enforce-application-tests:
    description: "Enforcement setting, true or false: false reports recognized test assertion failures without failing; the tests still run. Set it only in the administrator's entry point, since whoever writes this call can pass it; it is the administrator's only where that file is. See docs/admin-policy.md."
    required: false
    default: 'false'
  enable-build-sbom:
    description: "'false' skips the Build SBOM, and with it the cyclonedx-maven-plugin."
    required: false
    default: 'true'
  artifact-name:
    description: "Logical name of a library build's hand-off artifact: <artifact-name>-build-artifacts, or maven-build-artifacts when empty. Name it where one run builds several libraries."
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Build Maven project
      shell: bash
      env:
        BUILD_MAVEN_VERSION: ${{ inputs.version }}
        BUILD_MAVEN_COMMIT: ${{ inputs.commit }}
        BUILD_MAVEN_BUILD_TYPE: ${{ inputs.build-type }}
        BUILD_MAVEN_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        BUILD_MAVEN_PROFILE: ${{ inputs.profile }}
        BUILD_MAVEN_PRIVATE_DEPENDENCIES: ${{ inputs.private-dependencies }}
        BUILD_MAVEN_SETTINGS_PATH: ${{ inputs.settings-path }}
        BUILD_MAVEN_SKIP_TESTS: ${{ inputs.skip-tests }}
        BUILD_MAVEN_ADMIN_APPLICATION_TESTS: ${{ inputs.enforce-application-tests }}
        BUILD_MAVEN_BUILD_SBOM: ${{ inputs.enable-build-sbom }}
        BUILD_MAVEN_ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: |
        set -euo pipefail
        # shellcheck source=.engine/bin/lib-forge-ci.sh
        source "${GITHUB_ACTION_PATH}/../../../.engine/bin/lib-forge-ci.sh"
        if [ -z "${FORGE_CI_BIN:-}" ]; then fetch_forge_ci; fi
        SIGNER_STRICT=1 verify_forge_ci
        version=${BUILD_MAVEN_VERSION#v}
        if [ -n "${version}" ]; then
          export FORGE_CI_VERSION=${version}
        fi
        export FORGE_CI_COMMIT=${BUILD_MAVEN_COMMIT:?commit is required}
        build_type=${BUILD_MAVEN_BUILD_TYPE:?build-type is required}
        skip_tests=${BUILD_MAVEN_SKIP_TESTS:?skip-tests is required}
        build_sbom=${BUILD_MAVEN_BUILD_SBOM:?enable-build-sbom is required}
        directory=${BUILD_MAVEN_WORKING_DIRECTORY:?working-directory is required}
        # GitHub's and GitLab's Maven options and SBOM plugin pin, so the
        # three forges run the same build.
        # shellcheck source=.forgejo/actions/build-maven/versions.env
        source "${GITHUB_ACTION_PATH}/versions.env"
        cli_opts='--batch-mode --no-transfer-progress --errors --fail-at-end -Dstyle.color=always'
        # The Go owner admits the project and binds every Maven subprocess to it.
        run_forge_ci build maven run \
          --enforce-application-tests="${BUILD_MAVEN_ADMIN_APPLICATION_TESTS:?enforce-application-tests is required}" \
          --working-dir "${directory}" \
          --build-type "${build_type}" \
          --profile "${BUILD_MAVEN_PROFILE}" \
          --maven-cli-opts "${cli_opts}" \
          --skip-tests="${skip_tests}" \
          --build-sbom="${build_sbom}" \
          --sbom-tool-version "${CYCLONEDX_MAVEN_VERSION:?}" \
          --private-dependencies="${BUILD_MAVEN_PRIVATE_DEPENDENCIES:?private-dependencies is required}" \
          --settings-path "${BUILD_MAVEN_SETTINGS_PATH}" \
          --expect-version "${version}"
        if [ "${build_type}" = lib ]; then
          # The library hand-off of GitHub's build-maven workflow, under its
          # name and with its paths: every POM and built JAR, rooted at the
          # project directory, so the artifact holds pom.xml and target/ as
          # the from-build publisher reads them.
          artifact=${BUILD_MAVEN_ARTIFACT_NAME:+${BUILD_MAVEN_ARTIFACT_NAME}-build-artifacts}
          FORGE_CI_PROVIDER=forgejo run_forge_ci artifact upload \
            --name "${artifact:-maven-build-artifacts}" \
            --path "${directory}/pom.xml" \
            --path "${directory}/**/pom.xml" \
            --path "${directory}/target/*.jar" \
            --path "${directory}/target/*.war" \
            --path "${directory}/target/*.pom" \
            --path "${directory}/**/target/*.jar" \
            --path "${directory}/**/target/*.war" \
            --path "${directory}/**/target/*.pom" \
            --path "!${directory}/target/original-*.jar" \
            --path "!${directory}/**/target/original-*.jar" \
            --retention-days 7 \
            --if-no-files error
        fi
