name: 'Build, scan and record a release image'
description: >-
  Build every platform with Buildah, export one OCI layout, scan every platform with Trivy, and publish that same layout only after all scans pass. Record the verified digest in the release image ledger. Failed builds or scans perform no registry publication. Assumes Buildah, Trivy and registry login are in place; this action never handles a token. Releases with staging tags, base-image lineage or flavours may compose the underlying commands themselves.
inputs:
  tag:
    description: Image tag to build, push and record as the final tag (e.g. v1.2.3 or v1.2.3-alpine).
    required: true
  containerfile:
    description: Path to the Containerfile/Dockerfile.
    required: true
  builds:
    description: >-
      JSON array of per-platform builds, each {"platform": "linux/amd64", "build-args": ["KEY=VALUE", ...]}. Every entry is built into the same manifest list and scanned.
    required: true
  role:
    description: Image role recorded in the ledger and SLSA predicate, e.g. distroless, alpine.
    required: true
  scan-output:
    description: >-
      Path template of the Trivy JSON result of each platform; it must contain {arch} or {platform}, e.g. dist/trivy-results-distroless-{arch}.json. Required, so two images of one release cannot share a default and overwrite each other.
    required: true
  title:
    description: org.opencontainers.image.title.
    required: true
  release-tag:
    description: Stable release tag that scopes the image tag, e.g. v1.2.3. Empty derives it from tag.
    required: false
    default: ''
  sbom:
    description: SBOM path recorded in the ledger. Empty takes dist/image-sbom-<role>.cyclonedx.json; the signer generates it if absent.
    required: false
    default: ''
  image:
    description: >-
      Image base (registry/owner/name). Defaults to <host of the forge>/<lowercased repository>.
    required: false
    default: ''
  context:
    description: Build context directory.
    required: false
    default: '.'
  description:
    description: org.opencontainers.image.description.
    required: false
    default: ''
  licenses:
    description: org.opencontainers.image.licenses (SPDX expression).
    required: false
    default: ''
  vendor:
    description: org.opencontainers.image.vendor.
    required: false
    default: ''
  authors:
    description: org.opencontainers.image.authors.
    required: false
    default: ''
  documentation:
    description: org.opencontainers.image.documentation. Defaults to <source url>#readme.
    required: false
    default: ''
  ref-name:
    description: org.opencontainers.image.ref.name. Defaults to the tag.
    required: false
    default: ''
  version:
    description: >-
      org.opencontainers.image.version. Defaults to the tag. Set it when the release version differs from the tag (e.g. tag v1.2.3-alpine, version v1.2.3).
    required: false
    default: ''
  revision:
    description: >-
      org.opencontainers.image.revision. Defaults to `git rev-parse HEAD` of the checkout, which is the prepared release commit and not the event commit.
    required: false
    default: ''
  auth-file:
    description: >-
      Registry credentials file for base-image pulls, local export and OCI publication, e.g. registry-login's auth-file output. Scans read the exported layout. Empty uses the client's default auth location.
    required: false
    default: ''

outputs:
  image:
    description: The image base that was pushed (registry/owner/name).
    value: ${{ steps.build.outputs.image }}
  digest:
    description: The pushed manifest-list digest (sha256:...).
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Build, scan and publish image
      id: build
      shell: bash
      env:
        IMAGE_TAG: ${{ inputs.tag }}
        CONTAINER_FILE: ${{ inputs.containerfile }}
        BUILDS_JSON: ${{ inputs.builds }}
        IMAGE_NAME: ${{ inputs.image }}
        BUILD_CONTEXT: ${{ inputs.context }}
        OCI_LABEL_TITLE: ${{ inputs.title }}
        OCI_LABEL_DESCRIPTION: ${{ inputs.description }}
        OCI_LABEL_LICENSES: ${{ inputs.licenses }}
        OCI_LABEL_VENDOR: ${{ inputs.vendor }}
        OCI_LABEL_AUTHORS: ${{ inputs.authors }}
        OCI_LABEL_DOCUMENTATION: ${{ inputs.documentation }}
        OCI_LABEL_REF_NAME: ${{ inputs.ref-name }}
        OCI_LABEL_VERSION: ${{ inputs.version }}
        OCI_LABEL_REVISION: ${{ inputs.revision }}
        FORGE_CI_REGISTRY_AUTH_FILE: ${{ inputs.auth-file }}
        SERVER_URL: ${{ github.server_url }}
        REPOSITORY: ${{ github.repository }}
        SCAN_OUTPUT: ${{ inputs.scan-output }}
      run: |
        set -euo pipefail
        # shellcheck source=.forgejo/bin/lib-forge-ci.sh
        source "${GITHUB_ACTION_PATH}/../../bin/lib-forge-ci.sh"
        FORGE_CI_PROVIDER=forgejo run_forge_ci container build-push-oci-image \
          --tag "${IMAGE_TAG}" \
          --containerfile "${CONTAINER_FILE}" \
          --builds-json "${BUILDS_JSON}" \
          --image "${IMAGE_NAME}" \
          --context "${BUILD_CONTEXT}" \
          --title "${OCI_LABEL_TITLE}" \
          --description "${OCI_LABEL_DESCRIPTION}" \
          --licenses "${OCI_LABEL_LICENSES}" \
          --vendor "${OCI_LABEL_VENDOR}" \
          --authors "${OCI_LABEL_AUTHORS}" \
          --documentation "${OCI_LABEL_DOCUMENTATION}" \
          --ref-name "${OCI_LABEL_REF_NAME}" \
          --version "${OCI_LABEL_VERSION}" \
          --revision "${OCI_LABEL_REVISION}" \
          --auth-file "${FORGE_CI_REGISTRY_AUTH_FILE:-${REGISTRY_AUTH_FILE:-}}" \
          --server-url "${SERVER_URL}" \
          --repository "${REPOSITORY}" \
          --scan-output-template "${SCAN_OUTPUT:?scan-output is required}"

    - name: Record release image in ledger
      shell: bash
      env:
        RECORD_ROLE: ${{ inputs.role }}
        RECORD_IMAGE: ${{ steps.build.outputs.image }}
        RECORD_DIGEST: ${{ steps.build.outputs.digest }}
        RECORD_TAG: ${{ inputs.tag }}
        RECORD_RELEASE_TAG: ${{ inputs.release-tag }}
        RECORD_SBOM: ${{ inputs.sbom }}
      run: |
        set -euo pipefail
        # shellcheck source=.forgejo/bin/lib-forge-ci.sh
        source "${GITHUB_ACTION_PATH}/../../bin/lib-forge-ci.sh"
        run_forge_ci container ledger add \
          --role "${RECORD_ROLE:?role is required}" \
          --image-name "${RECORD_IMAGE:?the build step emitted no image}" \
          --digest "${RECORD_DIGEST:?the build step emitted no digest}" \
          --final-tag-name "${RECORD_TAG:?tag is required}" \
          --sbom "${RECORD_SBOM}" \
          --default-sbom \
          --tag "${RECORD_RELEASE_TAG}"
