# workflow-call-secrets-contract: SNAPSHOT_REGISTRY_PASSWORD
name: Snapshot images (reusable)
on:
  workflow_call:
    inputs:
      branch:
        description: Logical source branch, including for manually dispatched callers. Resolved once.
        type: string
        required: true
      publish-containers:
        type: boolean
        default: true
      publish-files:
        description: Keep the built files of every declared artifact its ecosystem builds outside an image (go, cargo, maven, gradle, npm) as unsigned run artifacts, named <artifact>-<snapshot version> and kept for 7 days. See docs/workflows.md, Snapshot files.
        type: boolean
        default: false
      artifacts-config:
        type: string
        default: .forge-ci/artifacts.yml
      image-repository:
        description: Trusted full base OCI repository. Empty for a project that publishes no snapshot image; a plan with an image is then refused.
        type: string
        default: ''
      registry-user:
        description: Registry account of the image publication. Empty for a project that publishes no snapshot image; a plan with an image is then refused before anything builds.
        type: string
        default: ''
      forge-ci-repository:
        description: Layer repository, owner/repository on this forge or full HTTPS clone URL.
        type: string
        required: false
        default: ''
      forge-ci-sha:
        description: Exact layer SHA, matching the caller's workflow pin.
        type: string
        required: true
      runs-on:
        description: JSON array of trusted runner labels. The jobs that build no image run there.
        type: string
        required: true
      build-runs-on-linux-amd64:
        description: JSON array of runner labels for the linux/amd64 image builds. Required when an image builds linux/amd64; no other input stands in for it.
        type: string
        default: ''
      build-runs-on-linux-arm64:
        description: JSON array of runner labels for the native linux/arm64 image builds. Required when an image builds linux/arm64; no other input stands in for it.
        type: string
        default: ''
      artifact-job-image-go:
        description: Trusted digest-pinned Go toolchain image. Empty uses existing amd64 host tools.
        type: string
        default: ''
      artifact-job-image-java:
        description: Trusted digest-pinned Maven/Gradle JVM toolchain image. Empty uses existing amd64 host tools.
        type: string
        default: ''
      artifact-job-image-node:
        description: Trusted digest-pinned npm toolchain image. Empty uses existing amd64 host tools.
        type: string
        default: ''
      artifact-job-image-rust:
        description: Trusted digest-pinned Cargo toolchain image. Empty uses existing amd64 host tools.
        type: string
        default: ''
      context-artifact:
        description: Advanced same-run prepared-context override; empty automatically builds and gathers all required artifact-first dependencies.
        type: string
        default: ''
      artifact-name:
        description: Unique namespace when calling this workflow more than once in a run.
        type: string
        default: snapshot-images
      enforce-application-tests:
        description: Enforcement setting; false lets the artifact builds report recognized test assertion failures without failing. Tests still run. Set it only in the administrator's entry point, since whoever writes this call can pass it; it is the administrator's only where that file is. See docs/admin-policy.md.
        type: boolean
        default: false
      enforce-vulnerabilities:
        description: Enforcement setting; false lets publication report image vulnerability findings without failing. Every image is still scanned. Set it only in the administrator's entry point, since whoever writes this call can pass it; it is the administrator's only where that file is. See docs/admin-policy.md.
        type: boolean
        default: false
    outputs:
      source-sha:
        value: ${{ jobs.plan.outputs.source-sha }}
      container-images-json:
        value: ${{ jobs.collect.outputs.container-images-json }}
env:
  FORGE_CI_PROVIDER: forgejo
  SNAPSHOT_SERVER: ${{ forgejo.server_url }}
  SNAPSHOT_REPOSITORY: ${{ forgejo.repository }}
  SNAPSHOT_ENGINE_SHA: ${{ inputs['forge-ci-sha'] }}
  SNAPSHOT_NAMESPACE: ${{ inputs['artifact-name'] }}
jobs:
  coordinates:
    name: "Check: layer and builder coordinates"
    runs-on: ${{ fromJSON(inputs['runs-on']) }}
    outputs:
      helpers_repository: ${{ steps.validate.outputs.helpers_repository }}
      builder: ${{ steps.validate.outputs.builder }}
      builder_job_image: ${{ steps.validate.outputs.builder_job_image }}
      artifact_job_image_go: ${{ steps.validate.outputs.artifact_job_image_go }}
      artifact_job_image_java: ${{ steps.validate.outputs.artifact_job_image_java }}
      artifact_job_image_node: ${{ steps.validate.outputs.artifact_job_image_node }}
      artifact_job_image_rust: ${{ steps.validate.outputs.artifact_job_image_rust }}
    steps:
      - name: Validate layer and native builder coordinates
        id: validate
        env:
          HELPERS_REPOSITORY_INPUT: ${{ inputs['forge-ci-repository'] || vars.FORGE_CI_REPOSITORY }}
          SERVER_URL: ${{ forgejo.server_url }}
          BUILDER_INPUT: ${{ vars.CI_IMAGE_BUILDER }}
          BUILDER_JOB_IMAGE_INPUT: ${{ vars.CI_IMAGE_BUILDER_JOB_IMAGE }}
          ARTIFACT_JOB_IMAGE_GO_INPUT: ${{ inputs['artifact-job-image-go'] || vars.SNAPSHOT_ARTIFACT_JOB_IMAGE_GO }}
          ARTIFACT_JOB_IMAGE_JAVA_INPUT: ${{ inputs['artifact-job-image-java'] || vars.SNAPSHOT_ARTIFACT_JOB_IMAGE_JAVA }}
          ARTIFACT_JOB_IMAGE_NODE_INPUT: ${{ inputs['artifact-job-image-node'] || vars.SNAPSHOT_ARTIFACT_JOB_IMAGE_NODE }}
          ARTIFACT_JOB_IMAGE_RUST_INPUT: ${{ inputs['artifact-job-image-rust'] || vars.SNAPSHOT_ARTIFACT_JOB_IMAGE_RUST }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          repository=${HELPERS_REPOSITORY_INPUT:-}
          if [ -z "${repository}" ]; then
            echo 'ERROR: name the forge-ci-repository input or FORGE_CI_REPOSITORY variable' >&2
            exit 1
          fi
          if [[ "${repository}" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]; then
            repository="${SERVER_URL:?}/${repository}.git"
          fi
          rest=${repository#https://}
          authority=${rest%%/*}
          path=${rest#*/}
          slug=${path%.git}
          if [[ "${repository}" != https://* || "${repository}" == *'?'* || "${repository}" == *'#'* ||
            "${rest}" != */* || "${authority}" == *@* || "${path}" == *\\* ||
            ! "${repository}" =~ ^[[:graph:]]+$ ||
            ! "${slug}" =~ ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+$ ||
            "/${slug}/" == *'/./'* || "/${slug}/" == *'/../'* ||
            ! "${authority}" =~ ^([A-Za-z0-9][A-Za-z0-9.-]*|\[[0-9A-Fa-f:.]+\])(:[0-9]{1,5})?$ ]]; then
            echo 'ERROR: forge-ci-repository must be owner/repository or a credential-free HTTPS clone URL' >&2
            exit 1
          fi
          if [[ "${authority}" =~ :([0-9]{1,5})$ ]]; then
            port=${BASH_REMATCH[1]}
            ((10#${port} > 0 && 10#${port} < 65536))
          fi
          builder=${BUILDER_INPUT:-buildah}
          builder_job_image=
          case "${builder}" in
            buildah) ;;
            kaniko)
              builder_job_image=${BUILDER_JOB_IMAGE_INPUT:-}
              [[ "${builder_job_image}" =~ ^[a-z0-9]+([.-][a-z0-9]+)*(:[0-9]+)?/([a-z0-9]+(([._]|__|-+)[a-z0-9]+)*/)*[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*(:[A-Za-z0-9_][A-Za-z0-9._-]{0,127})?@sha256:[0-9a-f]{64}$ ]]
              ;;
            *) echo 'ERROR: CI_IMAGE_BUILDER must be buildah or kaniko' >&2; exit 1 ;;
          esac
          for image in "${ARTIFACT_JOB_IMAGE_GO_INPUT:-}" "${ARTIFACT_JOB_IMAGE_JAVA_INPUT:-}" "${ARTIFACT_JOB_IMAGE_NODE_INPUT:-}" "${ARTIFACT_JOB_IMAGE_RUST_INPUT:-}"; do
            if [ -n "${image}" ] && [[ ! "${image}" =~ ^[a-z0-9]+([.-][a-z0-9]+)*(:[0-9]+)?/([a-z0-9]+(([._]|__|-+)[a-z0-9]+)*/)*[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*(:[A-Za-z0-9_][A-Za-z0-9._-]{0,127})?@sha256:[0-9a-f]{64}$ ]]; then
              echo 'ERROR: snapshot artifact job images must be full digest-pinned OCI references' >&2
              exit 1
            fi
          done
          {
            printf 'helpers_repository=%s\n' "${repository}"
            printf 'builder=%s\n' "${builder}"
            printf 'builder_job_image=%s\n' "${builder_job_image}"
            if [ -n "${ARTIFACT_JOB_IMAGE_GO_INPUT:-}" ]; then printf 'artifact_job_image_go=%s\n' "${ARTIFACT_JOB_IMAGE_GO_INPUT}"; fi
            if [ -n "${ARTIFACT_JOB_IMAGE_JAVA_INPUT:-}" ]; then printf 'artifact_job_image_java=%s\n' "${ARTIFACT_JOB_IMAGE_JAVA_INPUT}"; fi
            if [ -n "${ARTIFACT_JOB_IMAGE_NODE_INPUT:-}" ]; then printf 'artifact_job_image_node=%s\n' "${ARTIFACT_JOB_IMAGE_NODE_INPUT}"; fi
            if [ -n "${ARTIFACT_JOB_IMAGE_RUST_INPUT:-}" ]; then printf 'artifact_job_image_rust=%s\n' "${ARTIFACT_JOB_IMAGE_RUST_INPUT}"; fi
          } >> "${FORGEJO_OUTPUT}"
  plan:
    name: "Check: plan"
    needs: coordinates
    if: ${{ needs.coordinates.result == 'success' }}
    runs-on: ${{ fromJSON(inputs['runs-on']) }}
    env:
      FORGE_CI_REPOSITORY_URL: ${{ needs.coordinates.outputs.helpers_repository }}
    outputs:
      source-sha: ${{ steps.plan.outputs.source-sha }}
      builds: ${{ steps.plan.outputs.builds }}
      images: ${{ steps.plan.outputs.images }}
      artifacts: ${{ steps.plan.outputs.artifacts }}
      has-artifacts: ${{ steps.plan.outputs.has-artifacts }}
      files: ${{ steps.plan.outputs.files }}
      has-files: ${{ steps.plan.outputs.has-files }}
      enabled: ${{ steps.plan.outputs.enabled }}
    steps:
      - name: Bootstrap pinned native snapshot layer
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SNAPSHOT_ENGINE_SHA}" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
          [[ "${SNAPSHOT_NAMESPACE}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          helpers="${GITHUB_WORKSPACE:?}/snapshot-engine"
          git init --quiet "${helpers}"
          git -C "${helpers}" remote add origin "${FORGE_CI_REPOSITORY_URL:?}"
          if ! GIT_TERMINAL_PROMPT=0 git -C "${helpers}" fetch --quiet --depth=1 --no-tags origin "${SNAPSHOT_ENGINE_SHA}"; then
            GIT_TERMINAL_PROMPT=0 git -C "${helpers}" fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          fi
          git -C "${helpers}" checkout --quiet --detach "${SNAPSHOT_ENGINE_SHA}"
          test "$(git -C "${helpers}" rev-parse HEAD)" = "${SNAPSHOT_ENGINE_SHA}"
          source "${helpers}/.engine/bin/lib-forge-ci.sh"
          fetch_forge_ci
          {
            printf 'SNAPSHOT_HELPERS=%s\n' "${helpers}"
          } >> "${FORGEJO_ENV:?}"
      - name: Resolve selected branch and freeze plan
        id: plan
        shell: bash
        env:
          # The settings snapshot_engine passes to every engine call.
          SNAPSHOT_ADMIN_APPLICATION_TESTS: ${{ inputs['enforce-application-tests'] }}
          SNAPSHOT_ADMIN_VULNERABILITIES: ${{ inputs['enforce-vulnerabilities'] }}
          FORGEJO_TOKEN: ${{ forgejo.token }}
          SNAPSHOT_BRANCH: ${{ inputs.branch }}
          SNAPSHOT_CONFIG: ${{ inputs['artifacts-config'] }}
          SNAPSHOT_PUBLISH: ${{ inputs['publish-containers'] }}
          SNAPSHOT_PUBLISH_FILES: ${{ inputs['publish-files'] }}
          SNAPSHOT_IMAGE_REPOSITORY: ${{ inputs['image-repository'] }}
          SNAPSHOT_REGISTRY_USER: ${{ inputs['registry-user'] }}
          # Presence, not value: the plan job never holds the password.
          SECRET_SNAPSHOT_REGISTRY_PASSWORD: ${{ secrets.SNAPSHOT_REGISTRY_PASSWORD != '' }}
          RUNS_ON: ${{ inputs['runs-on'] }}
          BUILD_RUNS_ON_LINUX_AMD64: ${{ inputs['build-runs-on-linux-amd64'] }}
          BUILD_RUNS_ON_LINUX_ARM64: ${{ inputs['build-runs-on-linux-arm64'] }}
          CONTEXT_ARTIFACT: ${{ inputs['context-artifact'] }}
        run: |
          set -euo pipefail
          source "${SNAPSHOT_HELPERS}/.engine/bin/lib-forge-ci.sh"
          source "${SNAPSHOT_HELPERS}/.forgejo/bin/snapshot-images.sh"
          # A planned build whose runner input is empty is refused here.
          runner_inputs=(
            --runner-input "runs-on=${RUNS_ON}"
            --runner-input "build-runs-on-linux-amd64=${BUILD_RUNS_ON_LINUX_AMD64}"
            --runner-input "build-runs-on-linux-arm64=${BUILD_RUNS_ON_LINUX_ARM64}"
          )
          if [ -n "${CONTEXT_ARTIFACT}" ] && [ "${SNAPSHOT_PUBLISH}" != false ]; then
            run_forge_ci validate event-context
            run_forge_ci artifact download --name "${CONTEXT_ARTIFACT}" --dir snapshot-context
            snapshot_plan snapshot-context/snapshot-plan.json "${runner_inputs[@]}"
            snapshot_apply_context snapshot-context snapshot-plan.json
          else
            snapshot_plan "" "${runner_inputs[@]}"
          fi
          snapshot_require_publisher
          run_forge_ci artifact upload --name "${SNAPSHOT_NAMESPACE}-plan" --file snapshot-plan.json --if-no-files error
  produce:
    name: "Build: ${{ matrix.artifact.name }}"
    needs: [coordinates, plan]
    if: ${{ needs.coordinates.result == 'success' && needs.plan.result == 'success' && needs.plan.outputs.enabled == 'true' && inputs['context-artifact'] == '' }}
    runs-on: ${{ fromJSON(inputs['runs-on']) }}
    # Select a validated coordinate by key, never a logical expression's value.
    # format preserves an empty container (the runner default) for the no-op row.
    container: ${{ format('{0}', needs.coordinates.outputs[fromJSON('{"go":"artifact_job_image_go","maven":"artifact_job_image_java","gradle":"artifact_job_image_java","npm":"artifact_job_image_node","cargo":"artifact_job_image_rust"}')[matrix.artifact.project_type]]) }}
    env:
      FORGE_CI_REPOSITORY_URL: ${{ needs.coordinates.outputs.helpers_repository }}
    strategy:
      fail-fast: false
      matrix:
        # Complete a no-op job when there are no producers. An empty matrix
        # blocks downstream jobs on Forgejo (forgejo/forgejo#12191).
        artifact: ${{ fromJSON(needs.plan.outputs.has-artifacts == 'true' && needs.plan.outputs.artifacts || '[{}]') }}
    steps:
      - name: No artifact producer required
        if: ${{ !matrix.artifact.name }}
        run: echo 'Container-first snapshot has no artifact producer'
      - name: Bootstrap pinned native snapshot layer
        if: ${{ matrix.artifact.name != '' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SNAPSHOT_ENGINE_SHA}" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
          helpers="${GITHUB_WORKSPACE:?}/snapshot-engine"
          git init --quiet "${helpers}"
          git -C "${helpers}" remote add origin "${FORGE_CI_REPOSITORY_URL:?}"
          if ! GIT_TERMINAL_PROMPT=0 git -C "${helpers}" fetch --quiet --depth=1 --no-tags origin "${SNAPSHOT_ENGINE_SHA}"; then
            GIT_TERMINAL_PROMPT=0 git -C "${helpers}" fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          fi
          git -C "${helpers}" checkout --quiet --detach "${SNAPSHOT_ENGINE_SHA}"
          test "$(git -C "${helpers}" rev-parse HEAD)" = "${SNAPSHOT_ENGINE_SHA}"
          source "${helpers}/.engine/bin/lib-forge-ci.sh"
          fetch_forge_ci
          printf 'SNAPSHOT_HELPERS=%s\n' "${helpers}" >> "${FORGEJO_ENV:?}"
      - name: Fetch exact artifact source and frozen settings
        if: ${{ matrix.artifact.name != '' }}
        shell: bash
        env:
          # The settings snapshot_engine passes to every engine call.
          SNAPSHOT_ADMIN_APPLICATION_TESTS: ${{ inputs['enforce-application-tests'] }}
          SNAPSHOT_ADMIN_VULNERABILITIES: ${{ inputs['enforce-vulnerabilities'] }}
          FORGEJO_TOKEN: ${{ forgejo.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.source-sha }}
        run: |
          set -euo pipefail
          source "${SNAPSHOT_HELPERS}/.engine/bin/lib-forge-ci.sh"
          source "${SNAPSHOT_HELPERS}/.forgejo/bin/snapshot-images.sh"
          run_forge_ci artifact download --name "${SNAPSHOT_NAMESPACE}-plan" --dir .
          snapshot_checkout "${SOURCE_SHA}"
      - name: Build required artifact using the shared ecosystem runner
        if: ${{ matrix.artifact.name != '' }}
        shell: bash
        env:
          # The settings snapshot_engine passes to every engine call.
          SNAPSHOT_ADMIN_APPLICATION_TESTS: ${{ inputs['enforce-application-tests'] }}
          SNAPSHOT_ADMIN_VULNERABILITIES: ${{ inputs['enforce-vulnerabilities'] }}
          ARTIFACT_NAME: ${{ matrix.artifact.name }}
          ARTIFACT_PROJECT_TYPE: ${{ matrix.artifact.project_type }}
        run: |
          set -euo pipefail
          source "${SNAPSHOT_HELPERS}/.engine/bin/lib-forge-ci.sh"
          source "${SNAPSHOT_HELPERS}/.forgejo/bin/snapshot-images.sh"
          _forge_ci_arch
          test "${HELPERS_ENGINE_ARCH}" = amd64
          # The installers keep their download in the job's own directory,
          # as build-go does: rows of one host share /tmp.
          export CI_TEMP_DIR="${RUNNER_TEMP:?}"
          snapshot_build_sbom_tool "${ARTIFACT_NAME}" "${ARTIFACT_PROJECT_TYPE}"
          snapshot_build_artifact "${ARTIFACT_NAME}"
      - name: Retain bound artifact producer output
        if: ${{ matrix.artifact.name != '' }}
        shell: bash
        env:
          ARTIFACT_NAME: ${{ matrix.artifact.name }}
        run: |
          set -euo pipefail
          source "${SNAPSHOT_HELPERS}/.engine/bin/lib-forge-ci.sh"
          run_forge_ci artifact upload --name "${SNAPSHOT_NAMESPACE}-producer-${ARTIFACT_NAME}" \
            --dir "snapshot-source/_snapshot-artifacts/${ARTIFACT_NAME}" --include-hidden --if-no-files error --retention-days 1
  # A file output is built on its own and kept as a run artifact of this
  # run. The job holds the run's own token, for the checkout and the artifact
  # store, and no registry, release or signing secret; the build itself gets
  # none of them. Nothing is published outside the run.
  files:
    name: "Build: ${{ matrix.file.name }} files"
    needs: [coordinates, plan]
    if: ${{ needs.coordinates.result == 'success' && needs.plan.result == 'success' && needs.plan.outputs.has-files == 'true' }}
    runs-on: ${{ fromJSON(inputs['runs-on']) }}
    # Select a validated coordinate by key, never a logical expression's value.
    container: ${{ format('{0}', needs.coordinates.outputs[fromJSON('{"go":"artifact_job_image_go","maven":"artifact_job_image_java","gradle":"artifact_job_image_java","npm":"artifact_job_image_node","cargo":"artifact_job_image_rust"}')[matrix.file.project_type]]) }}
    env:
      FORGE_CI_REPOSITORY_URL: ${{ needs.coordinates.outputs.helpers_repository }}
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.plan.outputs.has-files == 'true' && needs.plan.outputs.files || '[{}]') }}
    steps:
      - name: Bootstrap pinned native snapshot layer
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SNAPSHOT_ENGINE_SHA}" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
          helpers="${GITHUB_WORKSPACE:?}/snapshot-engine"
          git init --quiet "${helpers}"
          git -C "${helpers}" remote add origin "${FORGE_CI_REPOSITORY_URL:?}"
          if ! GIT_TERMINAL_PROMPT=0 git -C "${helpers}" fetch --quiet --depth=1 --no-tags origin "${SNAPSHOT_ENGINE_SHA}"; then
            GIT_TERMINAL_PROMPT=0 git -C "${helpers}" fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          fi
          git -C "${helpers}" checkout --quiet --detach "${SNAPSHOT_ENGINE_SHA}"
          test "$(git -C "${helpers}" rev-parse HEAD)" = "${SNAPSHOT_ENGINE_SHA}"
          source "${helpers}/.engine/bin/lib-forge-ci.sh"
          fetch_forge_ci
          printf 'SNAPSHOT_HELPERS=%s\n' "${helpers}" >> "${FORGEJO_ENV:?}"
      - name: Fetch exact source and frozen plan
        shell: bash
        env:
          # The settings snapshot_engine passes to every engine call.
          SNAPSHOT_ADMIN_APPLICATION_TESTS: ${{ inputs['enforce-application-tests'] }}
          SNAPSHOT_ADMIN_VULNERABILITIES: ${{ inputs['enforce-vulnerabilities'] }}
          FORGEJO_TOKEN: ${{ forgejo.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.source-sha }}
        run: |
          set -euo pipefail
          source "${SNAPSHOT_HELPERS}/.engine/bin/lib-forge-ci.sh"
          source "${SNAPSHOT_HELPERS}/.forgejo/bin/snapshot-images.sh"
          run_forge_ci artifact download --name "${SNAPSHOT_NAMESPACE}-plan" --dir .
          snapshot_checkout "${SOURCE_SHA}"
      - name: Build the file output without publication credentials
        shell: bash
        env:
          # The settings snapshot_engine passes to every engine call.
          SNAPSHOT_ADMIN_APPLICATION_TESTS: ${{ inputs['enforce-application-tests'] }}
          SNAPSHOT_ADMIN_VULNERABILITIES: ${{ inputs['enforce-vulnerabilities'] }}
          FILE_NAME: ${{ matrix.file.name }}
          FILE_PROJECT_TYPE: ${{ matrix.file.project_type }}
        run: |
          set -euo pipefail
          source "${SNAPSHOT_HELPERS}/.engine/bin/lib-forge-ci.sh"
          source "${SNAPSHOT_HELPERS}/.forgejo/bin/snapshot-images.sh"
          _forge_ci_arch
          test "${HELPERS_ENGINE_ARCH}" = amd64
          # The installers keep their download in the job's own directory,
          # as build-go does: rows of one host share /tmp.
          export CI_TEMP_DIR="${RUNNER_TEMP:?}"
          snapshot_build_sbom_tool "${FILE_NAME}" "${FILE_PROJECT_TYPE}"
          snapshot_build_files "${FILE_NAME}"
      - name: Keep the unsigned file output as a run artifact
        shell: bash
        env:
          FILE_NAME: ${{ matrix.file.name }}
          FILES_ARTIFACT_NAME: ${{ matrix.file.artifact_name }}
        run: |
          set -euo pipefail
          source "${SNAPSHOT_HELPERS}/.engine/bin/lib-forge-ci.sh"
          # The plan's name carries the snapshot version: <artifact>-<version>-snapshot-<branch>-<commit>.
          [[ "${FILES_ARTIFACT_NAME}" == "${FILE_NAME}"-*-snapshot-* ]]
          # Under the run's namespace, as every artifact of this workflow is.
          run_forge_ci artifact upload --name "${SNAPSHOT_NAMESPACE}-files-${FILES_ARTIFACT_NAME}" \
            --dir "snapshot-source/snapshot-files/${FILE_NAME}" --include-hidden --if-no-files error --retention-days 7
  context:
    name: "Prepare: image inputs"
    needs: [coordinates, plan, produce]
    if: ${{ needs.coordinates.result == 'success' && needs.plan.result == 'success' && needs.produce.result == 'success' && needs.plan.outputs.enabled == 'true' && inputs['context-artifact'] == '' }}
    runs-on: ${{ fromJSON(inputs['runs-on']) }}
    env:
      FORGE_CI_REPOSITORY_URL: ${{ needs.coordinates.outputs.helpers_repository }}
    steps:
      - name: Bootstrap pinned native snapshot layer
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SNAPSHOT_ENGINE_SHA}" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
          helpers="${GITHUB_WORKSPACE:?}/snapshot-engine"
          git init --quiet "${helpers}"
          git -C "${helpers}" remote add origin "${FORGE_CI_REPOSITORY_URL:?}"
          if ! GIT_TERMINAL_PROMPT=0 git -C "${helpers}" fetch --quiet --depth=1 --no-tags origin "${SNAPSHOT_ENGINE_SHA}"; then
            GIT_TERMINAL_PROMPT=0 git -C "${helpers}" fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          fi
          git -C "${helpers}" checkout --quiet --detach "${SNAPSHOT_ENGINE_SHA}"
          test "$(git -C "${helpers}" rev-parse HEAD)" = "${SNAPSHOT_ENGINE_SHA}"
          source "${helpers}/.engine/bin/lib-forge-ci.sh"
          fetch_forge_ci
          printf 'SNAPSHOT_HELPERS=%s\n' "${helpers}" >> "${FORGEJO_ENV:?}"
      - name: Gather the complete same-run producer set without source execution
        shell: bash
        env:
          # The settings snapshot_engine passes to every engine call.
          SNAPSHOT_ADMIN_APPLICATION_TESTS: ${{ inputs['enforce-application-tests'] }}
          SNAPSHOT_ADMIN_VULNERABILITIES: ${{ inputs['enforce-vulnerabilities'] }}
          FORGEJO_TOKEN: ${{ forgejo.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.source-sha }}
        run: |
          set -euo pipefail
          source "${SNAPSHOT_HELPERS}/.engine/bin/lib-forge-ci.sh"
          source "${SNAPSHOT_HELPERS}/.forgejo/bin/snapshot-images.sh"
          run_forge_ci artifact download --name "${SNAPSHOT_NAMESPACE}-plan" --dir .
          snapshot_checkout "${SOURCE_SHA}"
          names=$(run_forge_ci container snapshot-images read-plan --plan snapshot-plan.json --field artifact-names)
          while IFS= read -r name; do
            [ -n "${name}" ] || continue
            run_forge_ci artifact download --name "${SNAPSHOT_NAMESPACE}-producer-${name}" \
              --dir "snapshot-source/_snapshot-artifacts/${name}"
          done <<< "${names}"
          snapshot_gather_context
          run_forge_ci artifact upload --name "${SNAPSHOT_NAMESPACE}-context" \
            --dir snapshot-source/snapshot-context --include-hidden --if-no-files error --retention-days 1
  build:
    name: "Build: ${{ matrix.build.name }} (${{ matrix.build.arch }})"
    needs: [coordinates, plan, context]
    if: ${{ !cancelled() && needs.coordinates.result == 'success' && needs.plan.result == 'success' && needs.plan.outputs.enabled == 'true' && (needs.context.result == 'success' || (needs.context.result == 'skipped' && inputs['context-artifact'] != '')) }}
    # The build input of the row's own architecture, selected by key. The
    # no-op row of a plan without an image has no architecture and never
    # runs; it names the plain runner input so its labels still evaluate.
    runs-on: ${{ fromJSON(inputs[matrix.build.arch && format('build-runs-on-linux-{0}', matrix.build.arch) || 'runs-on']) }}
    container: ${{ needs.coordinates.outputs.builder_job_image }}
    env:
      FORGE_CI_REPOSITORY_URL: ${{ needs.coordinates.outputs.helpers_repository }}
    strategy:
      fail-fast: false
      matrix:
        # A plan without an image (files alone, or publish-containers false)
        # has no build. One no-op row, skipped by the job's condition, lets
        # Forgejo settle the jobs that need this one (forgejo/forgejo#12191).
        build: ${{ fromJSON(needs.plan.outputs.enabled == 'true' && needs.plan.outputs.builds || '[{}]') }}
    steps:
      - name: Bootstrap pinned native snapshot layer
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SNAPSHOT_ENGINE_SHA}" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
          helpers="${GITHUB_WORKSPACE:?}/snapshot-engine"
          git init --quiet "${helpers}"
          git -C "${helpers}" remote add origin "${FORGE_CI_REPOSITORY_URL:?}"
          if ! GIT_TERMINAL_PROMPT=0 git -C "${helpers}" fetch --quiet --depth=1 --no-tags origin "${SNAPSHOT_ENGINE_SHA}"; then
            GIT_TERMINAL_PROMPT=0 git -C "${helpers}" fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          fi
          git -C "${helpers}" checkout --quiet --detach "${SNAPSHOT_ENGINE_SHA}"
          test "$(git -C "${helpers}" rev-parse HEAD)" = "${SNAPSHOT_ENGINE_SHA}"
          source "${helpers}/.engine/bin/lib-forge-ci.sh"
          fetch_forge_ci
          printf 'SNAPSHOT_HELPERS=%s\n' "${helpers}" >> "${FORGEJO_ENV:?}"
      - name: Fetch frozen source and same-run inputs
        shell: bash
        env:
          # The settings snapshot_engine passes to every engine call.
          SNAPSHOT_ADMIN_APPLICATION_TESTS: ${{ inputs['enforce-application-tests'] }}
          SNAPSHOT_ADMIN_VULNERABILITIES: ${{ inputs['enforce-vulnerabilities'] }}
          FORGEJO_TOKEN: ${{ forgejo.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.source-sha }}
          CONTEXT_ARTIFACT: ${{ inputs['context-artifact'] }}
        run: |
          set -euo pipefail
          source "${SNAPSHOT_HELPERS}/.engine/bin/lib-forge-ci.sh"
          source "${SNAPSHOT_HELPERS}/.forgejo/bin/snapshot-images.sh"
          run_forge_ci artifact download --name "${SNAPSHOT_NAMESPACE}-plan" --dir .
          snapshot_checkout "${SOURCE_SHA}"
          if [ -n "${CONTEXT_ARTIFACT}" ]; then
            run_forge_ci artifact download --name "${CONTEXT_ARTIFACT}" --dir snapshot-context
            snapshot_apply_context snapshot-context snapshot-plan.json
          else
            run_forge_ci artifact download --name "${SNAPSHOT_NAMESPACE}-context" --dir snapshot-context
            snapshot_apply_context snapshot-context snapshot-plan.json
          fi
      - name: Stage native image without publication credentials
        shell: bash
        env:
          # The settings snapshot_engine passes to every engine call.
          SNAPSHOT_ADMIN_APPLICATION_TESTS: ${{ inputs['enforce-application-tests'] }}
          SNAPSHOT_ADMIN_VULNERABILITIES: ${{ inputs['enforce-vulnerabilities'] }}
          IMAGE_NAME: ${{ matrix.build.name }}
          IMAGE_ARCH: ${{ matrix.build.arch }}
          CI_IMAGE_BUILDER: ${{ needs.coordinates.outputs.builder }}
          CI_IMAGE_BUILDER_JOB_IMAGE: ${{ needs.coordinates.outputs.builder_job_image }}
        run: |
          set -euo pipefail
          source "${SNAPSHOT_HELPERS}/.engine/bin/lib-forge-ci.sh"
          source "${SNAPSHOT_HELPERS}/.forgejo/bin/snapshot-images.sh"
          snapshot_build "${IMAGE_NAME}" "${IMAGE_ARCH}"
      - name: Transfer staged architecture
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.build.name }}
          IMAGE_ARCH: ${{ matrix.build.arch }}
        run: |
          set -euo pipefail
          source "${SNAPSHOT_HELPERS}/.engine/bin/lib-forge-ci.sh"
          # Each layout blob is stored once per run under its digest.
          run_forge_ci artifact upload --name "${SNAPSHOT_NAMESPACE}-layout-${IMAGE_NAME}-${IMAGE_ARCH}" \
            --dir "snapshot-source/snapshot-layouts/${IMAGE_NAME}-arch-${IMAGE_ARCH}" --blob-store "${SNAPSHOT_NAMESPACE}-blob" \
            --include-hidden --if-no-files error --retention-days 1
  publish:
    name: "Publish: ${{ matrix.image.name }}"
    needs: [coordinates, plan, build]
    if: ${{ needs.coordinates.result == 'success' && needs.plan.result == 'success' && needs.plan.outputs.enabled == 'true' && needs.build.result == 'success' }}
    runs-on: ${{ fromJSON(inputs['runs-on']) }}
    env:
      FORGE_CI_REPOSITORY_URL: ${{ needs.coordinates.outputs.helpers_repository }}
    strategy:
      fail-fast: false
      matrix:
        # As for the build matrix: one skipped no-op row without an image.
        image: ${{ fromJSON(needs.plan.outputs.enabled == 'true' && needs.plan.outputs.images || '[{}]') }}
    steps:
      - name: Bootstrap pinned native snapshot layer
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SNAPSHOT_ENGINE_SHA}" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
          helpers="${GITHUB_WORKSPACE:?}/snapshot-engine"
          git init --quiet "${helpers}"
          git -C "${helpers}" remote add origin "${FORGE_CI_REPOSITORY_URL:?}"
          if ! GIT_TERMINAL_PROMPT=0 git -C "${helpers}" fetch --quiet --depth=1 --no-tags origin "${SNAPSHOT_ENGINE_SHA}"; then
            GIT_TERMINAL_PROMPT=0 git -C "${helpers}" fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          fi
          git -C "${helpers}" checkout --quiet --detach "${SNAPSHOT_ENGINE_SHA}"
          test "$(git -C "${helpers}" rev-parse HEAD)" = "${SNAPSHOT_ENGINE_SHA}"
          source "${helpers}/.engine/bin/lib-forge-ci.sh"
          fetch_forge_ci
          printf 'SNAPSHOT_HELPERS=%s\n' "${helpers}" >> "${FORGEJO_ENV:?}"
      - name: Fetch exact source policy and complete layout set
        shell: bash
        env:
          # The settings snapshot_engine passes to every engine call.
          SNAPSHOT_ADMIN_APPLICATION_TESTS: ${{ inputs['enforce-application-tests'] }}
          SNAPSHOT_ADMIN_VULNERABILITIES: ${{ inputs['enforce-vulnerabilities'] }}
          FORGEJO_TOKEN: ${{ forgejo.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.source-sha }}
          IMAGE_NAME: ${{ matrix.image.name }}
        run: |
          set -euo pipefail
          source "${SNAPSHOT_HELPERS}/.engine/bin/lib-forge-ci.sh"
          source "${SNAPSHOT_HELPERS}/.forgejo/bin/snapshot-images.sh"
          run_forge_ci artifact download --name "${SNAPSHOT_NAMESPACE}-plan" --dir .
          snapshot_checkout "${SOURCE_SHA}"
          archs=$(run_forge_ci container snapshot-images read-plan --plan snapshot-plan.json --name "${IMAGE_NAME}" --field archs)
          while IFS= read -r arch; do
            run_forge_ci artifact download --name "${SNAPSHOT_NAMESPACE}-layout-${IMAGE_NAME}-${arch}" \
              --dir "snapshot-layouts/${IMAGE_NAME}-arch-${arch}" --blob-store "${SNAPSHOT_NAMESPACE}-blob"
          done <<< "${archs}"
          # The scanner reads only the selected commit's ignore policy.
          if [ -f snapshot-source/.trivyignore.yaml ]; then cp snapshot-source/.trivyignore.yaml .; fi
          # The installers keep their download in the job's own directory,
          # as build-go does: rows of one host share /tmp.
          export CI_TEMP_DIR="${RUNNER_TEMP:?}"
          snapshot_evidence_tools "${IMAGE_NAME}"
      - name: Publish verified snapshot and receipt
        shell: bash
        env:
          # The settings snapshot_engine passes to every engine call.
          SNAPSHOT_ADMIN_APPLICATION_TESTS: ${{ inputs['enforce-application-tests'] }}
          SNAPSHOT_ADMIN_VULNERABILITIES: ${{ inputs['enforce-vulnerabilities'] }}
          IMAGE_NAME: ${{ matrix.image.name }}
          SNAPSHOT_REGISTRY_USER: ${{ inputs['registry-user'] }}
          SNAPSHOT_REGISTRY_PASSWORD: ${{ secrets.SNAPSHOT_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          source "${SNAPSHOT_HELPERS}/.engine/bin/lib-forge-ci.sh"
          source "${SNAPSHOT_HELPERS}/.forgejo/bin/snapshot-images.sh"
          snapshot_publish "${IMAGE_NAME}" snapshot-layouts
      - name: Retain receipt and evidence
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image.name }}
        run: |
          set -euo pipefail
          source "${SNAPSHOT_HELPERS}/.engine/bin/lib-forge-ci.sh"
          run_forge_ci artifact upload --name "${SNAPSHOT_NAMESPACE}-receipt-${IMAGE_NAME}" --file "snapshot-receipts/${IMAGE_NAME}.json" --if-no-files error
          run_forge_ci artifact upload --name "${SNAPSHOT_NAMESPACE}-evidence-${IMAGE_NAME}" --dir "snapshot-evidence/${IMAGE_NAME}" --if-no-files ignore
  collect:
    name: Summary
    needs: [coordinates, plan, build, publish]
    if: ${{ !cancelled() && needs.coordinates.result == 'success' && needs.plan.result == 'success' && ((needs.build.result == 'success' && needs.publish.result == 'success') || (needs.plan.outputs.enabled != 'true' && needs.build.result == 'skipped' && needs.publish.result == 'skipped')) }}
    runs-on: ${{ fromJSON(inputs['runs-on']) }}
    env:
      FORGE_CI_REPOSITORY_URL: ${{ needs.coordinates.outputs.helpers_repository }}
    outputs:
      container-images-json: ${{ steps.collect.outputs.container-images-json }}
    steps:
      - name: Bootstrap pinned native snapshot layer
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SNAPSHOT_ENGINE_SHA}" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
          helpers="${GITHUB_WORKSPACE:?}/snapshot-engine"
          git init --quiet "${helpers}"
          git -C "${helpers}" remote add origin "${FORGE_CI_REPOSITORY_URL:?}"
          if ! GIT_TERMINAL_PROMPT=0 git -C "${helpers}" fetch --quiet --depth=1 --no-tags origin "${SNAPSHOT_ENGINE_SHA}"; then
            GIT_TERMINAL_PROMPT=0 git -C "${helpers}" fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          fi
          git -C "${helpers}" checkout --quiet --detach "${SNAPSHOT_ENGINE_SHA}"
          test "$(git -C "${helpers}" rev-parse HEAD)" = "${SNAPSHOT_ENGINE_SHA}"
          source "${helpers}/.engine/bin/lib-forge-ci.sh"
          fetch_forge_ci
          printf 'SNAPSHOT_HELPERS=%s\n' "${helpers}" >> "${FORGEJO_ENV:?}"
      - name: Require every expected image receipt
        id: collect
        shell: bash
        env:
          # The settings snapshot_engine passes to every engine call.
          SNAPSHOT_ADMIN_APPLICATION_TESTS: ${{ inputs['enforce-application-tests'] }}
          SNAPSHOT_ADMIN_VULNERABILITIES: ${{ inputs['enforce-vulnerabilities'] }}
        run: |
          set -euo pipefail
          source "${SNAPSHOT_HELPERS}/.engine/bin/lib-forge-ci.sh"
          source "${SNAPSHOT_HELPERS}/.forgejo/bin/snapshot-images.sh"
          run_forge_ci artifact download --name "${SNAPSHOT_NAMESPACE}-plan" --dir .
          mkdir -p snapshot-receipts
          names=$(run_forge_ci container snapshot-images read-plan --plan snapshot-plan.json --field image-names)
          while IFS= read -r name; do
            [ -n "${name}" ] || continue
            run_forge_ci artifact download --name "${SNAPSHOT_NAMESPACE}-receipt-${name}" --dir snapshot-receipts
          done <<< "${names}"
          snapshot_collect
          run_forge_ci artifact upload --name "${SNAPSHOT_NAMESPACE}" --file container-images.json --if-no-files error
