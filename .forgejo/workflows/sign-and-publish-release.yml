            run_forge_ci release sign \
              --method kms \
              --key env://COSIGN_KEY \
              --no-checksums-file \
              --no-release-artifacts-dir \
              --manifest "${RELEASE_FILES_MANIFEST:?}" \
              --dist-dir "${DIST_DIR:?}" \
              --manifest-section evidence
