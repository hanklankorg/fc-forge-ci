          set -euo pipefail
          cd "${CONSUMER_WORKSPACE:?}"
          # shellcheck source=.forgejo/bin/lib-forge-ci.sh
          source "${HELPERS_DIR:?}/.forgejo/bin/lib-forge-ci.sh"
          FORGE_CI_PROVIDER=forgejo run_forge_ci artifact download \
            --name "${SIGNED_DIST_ARTIFACT}" \
            --dir "${ARTIFACT_PATH}"

      - name: Export sign-and-publish context
        env:
          RELEASE_SHA: ${{ inputs['release-sha'] }}
          RELEASE_TAG: ${{ inputs['release-tag'] }}
          ARTIFACT_PATH: ${{ inputs['artifact-path'] }}
        run: |
          set -euo pipefail
          cd "${CONSUMER_WORKSPACE:?}"
          # shellcheck source=.forgejo/bin/lib-forge-ci.sh
          source "${HELPERS_DIR:?}/.forgejo/bin/lib-forge-ci.sh"
          run_forge_ci release sign-publish-context \
            --release-sha "${RELEASE_SHA}" \
            --tag "${RELEASE_TAG}" \
            --artifact-path "${ARTIFACT_PATH}"

      - name: Verify signed dist hand-off digest
        env:
          EXPECTED_SIGNED_DIGEST: ${{ needs.sign.outputs['signed-dist-digest'] }}
          ARTIFACT_PATH: ${{ inputs['artifact-path'] }}
        run: |
          set -euo pipefail
          cd "${CONSUMER_WORKSPACE:?}"
          # shellcheck source=.forgejo/bin/lib-forge-ci.sh
          source "${HELPERS_DIR:?}/.forgejo/bin/lib-forge-ci.sh"
          run_forge_ci release validate-dist \
            --dist-dir "${ARTIFACT_PATH%/}" \
            --expected-digest "${EXPECTED_SIGNED_DIGEST}"
          echo "signed dist/ hand-off verified: ${EXPECTED_SIGNED_DIGEST}"

      - name: Verify release tag before publish
        env:
          RELEASE_SHA: ${{ inputs['release-sha'] }}
          RELEASE_REQUEST_SHA: ${{ inputs['release-request-sha'] }}
        run: |
          set -euo pipefail
          cd "${CONSUMER_WORKSPACE:?}"
          # shellcheck source=.forgejo/bin/lib-forge-ci.sh
          source "${HELPERS_DIR:?}/.forgejo/bin/lib-forge-ci.sh"
          run_forge_ci release validate-tag \
            --release-sha "${RELEASE_SHA:?}" \
            --tag "${RELEASE_TAG:?}" \
            --expected-parent "${RELEASE_REQUEST_SHA:?}" \
            --repo-url "${FORGEJO_SERVER:?}/${FORGEJO_REPO:?}.git"

      - name: Publish release assets and signatures
        env:
          PUBLISH_RELEASE_TOKEN_INPUT: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_DRAFT: ${{ inputs['release-draft'] }}
        run: |
          set -euo pipefail
          cd "${CONSUMER_WORKSPACE:?}"
          forgejo_token="${PUBLISH_RELEASE_TOKEN_INPUT:?}"
          unset COSIGN_KEY COSIGN_PASSWORD FORGEJO_TOKEN GPG_SIGNING_FINGERPRINT GPG_SIGNING_KEY \
            GITEA_TOKEN GITHUB_TOKEN GPG_SIGNING_PASSWORD MISE_FORGEJO_TOKEN MISE_GITHUB_TOKEN \
            PUBLISH_RELEASE_TOKEN_INPUT REGISTRY_TOKEN REGISTRY_USER RELEASE_TOKEN
          # shellcheck source=.forgejo/bin/lib-forge-ci.sh
          source "${HELPERS_DIR:?}/.forgejo/bin/lib-forge-ci.sh"
          FORGEJO_TOKEN="${forgejo_token}" \
            FORGEJO_SERVER_URL="${FORGEJO_SERVER:?}" \
            FORGEJO_REPOSITORY="${FORGEJO_REPO:?}" \
            FORGE_CI_PROVIDER=forgejo \
            run_forge_ci release publish \
              --tag "${RELEASE_TAG:?}" \
              --repository "${FORGEJO_REPO:?}" \
              --release-name-from-repository \
              --release-notes-file "${DIST_DIR:?}/release-notes.md" \
              --draft="${RELEASE_DRAFT:-true}" \
              --manifest "${RELEASE_FILES_MANIFEST:?}" \
              --dist-dir "${DIST_DIR:?}"

      - name: Trim older releases to their checksums and signatures
        if: ${{ inputs['release-asset-retention'] != '' }}
        env:
          PUBLISH_RELEASE_TOKEN_INPUT: ${{ secrets.RELEASE_TOKEN }}
          KEEP_RELEASES: ${{ inputs['release-asset-retention'] }}
        run: |
          set -euo pipefail
          cd "${CONSUMER_WORKSPACE:?}"
          forgejo_token="${PUBLISH_RELEASE_TOKEN_INPUT:?}"
          unset COSIGN_KEY COSIGN_PASSWORD FORGEJO_TOKEN GPG_SIGNING_FINGERPRINT GPG_SIGNING_KEY \
            GITEA_TOKEN GITHUB_TOKEN GPG_SIGNING_PASSWORD MISE_FORGEJO_TOKEN MISE_GITHUB_TOKEN \
            PUBLISH_RELEASE_TOKEN_INPUT REGISTRY_TOKEN REGISTRY_USER RELEASE_TOKEN
          # shellcheck source=.forgejo/bin/lib-forge-ci.sh
          source "${HELPERS_DIR:?}/.forgejo/bin/lib-forge-ci.sh"
          FORGEJO_TOKEN="${forgejo_token}" \
            FORGEJO_SERVER_URL="${FORGEJO_SERVER:?}" \
            FORGEJO_REPOSITORY="${FORGEJO_REPO:?}" \
            FORGE_CI_PROVIDER=forgejo \
            run_forge_ci release asset-retention \
              --repository "${FORGEJO_REPO:?}" \
              --keep "${KEEP_RELEASES:?}" \
              --dry-run=false

      - name: Cleanup signer workspace
        if: always()
        run: |
          set -uo pipefail
          status=0
          for owned_dir in "${SIGN_AND_PUBLISH_STATE_DIR:-}" "${SIGNER_WORKSPACE:-}"; do
            [ -z "${owned_dir}" ] || rm -rf "${owned_dir}" || status=1
          done
          exit "${status}"
