          forge_ci_mark_external_registry "${LEDGER_EXPECTED_IMAGE_REPOSITORY:-}" "${FORGEJO_SERVER:-}"
          COSIGN_KEY="${cosign_key}" \
            COSIGN_PASSWORD="${cosign_password}" \
            REGISTRY_TOKEN="${registry_token}" \
            REGISTRY_USER="${registry_user}" \
            FORGE_CI_PROVIDER=forgejo \
            run_forge_ci container release-images sign \
              --allow-missing-ledger \
              --expected-base-repository "${BASE_IMAGE_REPOSITORY}" \
              --method kms \
              --key env://COSIGN_KEY

