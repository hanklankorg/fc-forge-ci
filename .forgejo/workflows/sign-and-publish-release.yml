          forge_ci_mark_external_registry "${LEDGER_EXPECTED_IMAGE_REPOSITORY:-}" "${FORGEJO_SERVER:-}"
          REGISTRY_TOKEN="${registry_token}" \
            REGISTRY_USER="${registry_user}" \
            FORGE_CI_PROVIDER=forgejo \
            run_forge_ci container release-images promote --allow-missing-ledger

      - name: Cleanup signer workspace
