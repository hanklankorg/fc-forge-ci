# golangci-lint v2 config. See https://golangci-lint.run/usage/configuration/.
version: "2"

run:
  timeout: 5m
  # Include the live conformance tier in static analysis; default build
  # constraints otherwise exclude every //go:build live file.
  build-tags:
    - live

output:
  formats:
    text:
      path: stdout
      print-issued-lines: true
      print-linter-name: true
      colors: true
  path-prefix: ""

issues:
  uniq-by-line: true

linters:
  default: none
  exclusions:
    paths:
      - generated
    rules:
      # Tests use fixture strings, short loop / mock vars, and
      # naturally branching table-driven cases. The corresponding
      # production-code findings still surface; this only quiets the
      # patterns that are by-design in test code.
      - path: "_test\\.go$"
        linters:
          - cyclop # table-driven tests have many subcases
          - dupl # parallel happy/sad-path blocks mirror each other
          - goconst # repeated fixture strings, often one-off
          - varnamelen # short locals / loop vars / mock receivers
          - ireturn # mocks return interfaces
      # paralleltest, scoped rather than blanket. A test that mutates process
      # state cannot be parallel: t.Setenv and t.Chdir panic under it, and a
      # swapped os.Stdin or working directory is shared by every goroutine.
      # This is the list of packages that do -- directly, or through a testutil
      # helper that does it on their behalf (ghaenv, glabenv, gpgkey,
      # isolatedenv, mockbinary's OnPath, testenv, testfs).
      # Regenerate this list from the tree rather than appending to it by hand:
      # a helper that starts calling t.Setenv adds its callers to this set.
      - path: "^(cmd/forge-ci/|scripts/bootstrap/|internal/adapters/buildah/|internal/adapters/cargo/|internal/adapters/changelog/|internal/adapters/cosign/|internal/adapters/ghaoutput/|internal/adapters/git/|internal/adapters/gitlaboutput/|internal/adapters/gotool/|internal/adapters/gpg/|internal/adapters/gradle/|internal/adapters/httpretry/|internal/adapters/manifest/|internal/adapters/maven/|internal/adapters/mise/|internal/adapters/npm/|internal/adapters/openpgp/|internal/adapters/osfs/|internal/adapters/platform/|internal/adapters/stepsummary/|internal/adapters/syft/|internal/app/build/|internal/app/config/|internal/app/container/|internal/app/platform/|internal/app/publish/|internal/app/release/|internal/app/sbom/|internal/app/security/|internal/app/summary/|internal/app/toolchain/|internal/app/validate/|internal/app/version/|internal/archive/|internal/cli/|internal/cli/cienv/|internal/cli/clitoken/|internal/cli/commands/build/|internal/cli/commands/container/|internal/cli/commands/plan/|internal/cli/commands/release/|internal/cli/commands/report/|internal/cli/commands/sbom/|internal/cli/commands/validate/|internal/cli/commands/version/|internal/cli/deps/|internal/cli/planfile/|internal/cli/secret/|internal/cliio/|internal/livetest/|internal/safeexec/|internal/testutil/ghaenv/|internal/testutil/glabenv/|internal/testutil/golden/|internal/testutil/gpgkey/|internal/testutil/isolatedenv/|internal/testutil/isolatedgit/|internal/testutil/mockbinary/|internal/testutil/testenv/|internal/testutil/testfs/|internal/testutil/toolrecorder/)"
        linters:
          - paralleltest
      # redact_test.go's whole point is to assert that PEM markers
      # get redacted from subprocess output. The literal PEM blocks
      # in the fixtures are the test contract.
      - path: "internal/safeexec/redact_test\\.go$"
        linters:
          - gosec
      # The GPG import-via-stdin test ships a throwaway PGP private
      # key fixture so it can exercise the real `gpg --import` path
      # end-to-end. The key is generated for that test and not used
      # anywhere else.
      - path: "internal/adapters/gpg/import_stdin_test\\.go$"
        linters:
          - gosec
      # Test-only directory perms (0755 fixtures via os.MkdirAll) are
      # acceptable for ephemeral t.TempDir() roots.
      - path: "_test\\.go$"
        text: "G301"
        linters:
          - gosec
      # Test files read fixture paths from t.TempDir() and friends;
      # the G304 "file inclusion via variable" pattern is unavoidable.
      - path: "_test\\.go$"
        text: "G304"
        linters:
          - gosec
      # The live-target contract module is consumed from a sibling checkout
      # until its v0.1.0 is published; then drop the replace in go.mod and
      # this allowance together. Scoped to that one module so any other local
      # replacement is still reported.
      - path: "^go\\.mod$"
        text: "local replacement are not allowed: codefloe.com/itiquette/forge-lab-contract"
        linters:
          - gomoddirectives
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - dogsled
    - dupl
    - durationcheck
    - errcheck
    - err113
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forcetypeassert
    - funcorder
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - godox
    - goheader
    - gomoddirectives
    - goprintffuncname
    - gosec
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - nlreturn
    - noctx
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - staticcheck
    - tagalign
    - testableexamples
    - testifylint
    - thelper
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - depguard
    - varnamelen
    - wastedassign
    # Whitespace rules run here rather than as the standalone wsl tool, whose
    # analysis library cannot read Go 1.27 packages; nanolinter then drops
    # its separate go-wsl check as covered.
    - wsl_v5
    - zerologlint

  settings:
    depguard:
      rules:
        # ADR 0004: every import arrow points inward at domain,
        #
        #   cli  -->  app  -->  domain  <--  adapters
        #
        # stated as the outward edges that must not exist. Each layer is the
        # package itself or anything under it, hence a "$" (exact) and a "/"
        # (subtree) entry per denied layer, so internal/clicolor is not cli.
        # Test files are composition roots and exempt: app tests may wire the
        # real git adapter. internal/testutil and internal/livetest are test
        # infrastructure and bound by none of these (testutil may import
        # adapters/git, livetest may import cli). Every other internal package
        # is a utility, stated with negated globs so a new package is covered
        # without being listed. Pure OpenPGP verification lives in internal/pgp,
        # a utility, which is why app/validate may import it while
        # adapters/openpgp stays out of reach.
        layer-domain:
          files:
            - "**/internal/domain/**"
            - "!$test"
          deny:
            - pkg: "github.com/diggsweden/forge-ci/internal/app$"
              desc: domain holds rules, not sequencing; move the orchestration into internal/app and leave the rule behind
            - pkg: github.com/diggsweden/forge-ci/internal/app/
              desc: domain holds rules, not sequencing; move the orchestration into internal/app and leave the rule behind
            - pkg: "github.com/diggsweden/forge-ci/internal/adapters$"
              desc: domain must not know a concrete tool; declare a small interface (a port) in domain and let the adapter satisfy it
            - pkg: github.com/diggsweden/forge-ci/internal/adapters/
              desc: domain must not know a concrete tool; declare a small interface (a port) in domain and let the adapter satisfy it
            - pkg: "github.com/diggsweden/forge-ci/internal/cli$"
              desc: domain must not know it is driven by a CLI; pass the value in as a parameter instead
            - pkg: github.com/diggsweden/forge-ci/internal/cli/
              desc: domain must not know it is driven by a CLI; pass the value in as a parameter instead
        layer-adapters:
          files:
            - "**/internal/adapters/**"
            - "!$test"
          deny:
            - pkg: "github.com/diggsweden/forge-ci/internal/app$"
              desc: an adapter is driven by a use case, never the reverse; invert the call, or move the shared logic into domain
            - pkg: github.com/diggsweden/forge-ci/internal/app/
              desc: an adapter is driven by a use case, never the reverse; invert the call, or move the shared logic into domain
            - pkg: "github.com/diggsweden/forge-ci/internal/cli$"
              desc: an adapter must not read flags; take the value as a struct field or parameter and let cmd/ wire it
            - pkg: github.com/diggsweden/forge-ci/internal/cli/
              desc: an adapter must not read flags; take the value as a struct field or parameter and let cmd/ wire it
        layer-app:
          files:
            - "**/internal/app/**"
            - "!$test"
          deny:
            - pkg: "github.com/diggsweden/forge-ci/internal/adapters$"
              desc: a use case depends on a port, not a concrete tool; declare the interface it needs (see gitOps in app/validate/tags.go) and construct the adapter in internal/cli
            - pkg: github.com/diggsweden/forge-ci/internal/adapters/
              desc: a use case depends on a port, not a concrete tool; declare the interface it needs (see gitOps in app/validate/tags.go) and construct the adapter in internal/cli
            - pkg: "github.com/diggsweden/forge-ci/internal/cli$"
              desc: a use case must not parse flags or own stdout; accept an io.Writer and plain inputs and wire it in internal/cli
            - pkg: github.com/diggsweden/forge-ci/internal/cli/
              desc: a use case must not parse flags or own stdout; accept an io.Writer and plain inputs and wire it in internal/cli
        layer-utility:
          files:
            - "**/internal/**"
            - "!**/internal/domain/**"
            - "!**/internal/adapters/**"
            - "!**/internal/app/**"
            - "!**/internal/cli/**"
            - "!**/internal/testutil/**"
            - "!**/internal/livetest/**"
            - "!$test"
          deny:
            - pkg: "github.com/diggsweden/forge-ci/internal/app$"
              desc: a shared utility must not orchestrate use cases; move orchestration into app or cli
            - pkg: github.com/diggsweden/forge-ci/internal/app/
              desc: a shared utility must not orchestrate use cases; move orchestration into app or cli
            - pkg: "github.com/diggsweden/forge-ci/internal/adapters$"
              desc: a shared utility must not construct concrete adapters; accept a narrow interface or move composition into cli
            - pkg: github.com/diggsweden/forge-ci/internal/adapters/
              desc: a shared utility must not construct concrete adapters; accept a narrow interface or move composition into cli
            - pkg: "github.com/diggsweden/forge-ci/internal/cli$"
              desc: a shared utility receives values, not CLI flags or composition code
            - pkg: github.com/diggsweden/forge-ci/internal/cli/
              desc: a shared utility receives values, not CLI flags or composition code
        # The live tier's oracle only means anything if it shares no code with
        # what it observes. An adapter that mis-parsed its own writes would
        # otherwise agree with itself and the scenario would pass while the
        # forge held something else. Keeping the import out makes that
        # independence a build failure rather than a habit.
        rawref-stays-independent:
          files:
            - "**/internal/livetest/rawref/**"
          deny:
            - pkg: github.com/diggsweden/forge-ci/internal/adapters
              desc: the raw oracle must not use the adapters it is the oracle for
            - pkg: github.com/diggsweden/forge-ci/internal/domain
              desc: keep the oracle on wire types, so a domain change cannot reshape what the forge is said to hold
    exhaustive:
      default-signifies-exhaustive: true
    govet:
      enable:
        - shadow
    varnamelen:
      min-name-length: 2
    paralleltest:
      ignore-missing: false
      ignore-missing-subtests: true
    revive:
      severity: warning
      confidence: 0.8
      rules:
        - name: exported
          disabled: false
          exclude: ["Name"]
        # Flag a superfluous `else` after an if-branch that already
        # returns (or breaks/continues) — keeps the happy path on the
        # left edge (100 Go Mistakes #2).
        - name: indent-error-flow
          disabled: false
        - name: superfluous-else
          disabled: false
