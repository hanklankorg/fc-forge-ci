# Live-tier fixture of TestForgejoLayer_MinimalBinaryRelease. A template: the
# test renders it into a scratch repository on the lab beside a one-file Go
# module, sets the release secrets there and pushes the request tag. That tag
# is the trigger, as it is for a consumer.
name: Forgejo layer minimal signed binary release

on:
  push:
    tags:
      - 'release-request/v*'

# permissions: is a GitHub field Forgejo ignores (warning per run) --
# kept for Scorecard Token-Permissions and GitHub portability. Real
# restriction is Forgejo's repo-scoped read-default token.
permissions:
  contents: read

jobs:
  prepare:
    uses: OWNER/forge-ci/.forgejo/workflows/prepare-release.yml@PIN_FORGE_CI_SHA
    with:
      runner-label: ${{ vars.CI_RUNNER_LABEL }}
      forge-ci-repository: RENDER_FORGE_CI_REPOSITORY
      forge-ci-sha: PIN_FORGE_CI_SHA
      signer-image: RENDER_SIGNER_IMAGE
      bot-name: Layer acceptance
      bot-email: layer-acceptance@invalid.example
      # The fixtures render with git-chglog from .chglog/, as the layer did
      # before git-cliff became the default; the three inputs keep that.
      changelog-creator: git-chglog
      changelog-config: .chglog/config-keepachangelog.yml
      commit-body-config: .chglog/config-minimal.yml
      release-git-url: RENDER_RELEASE_GIT_URL
      release-git-host-key-fingerprint: RENDER_RELEASE_GIT_HOST_KEY_FINGERPRINT
      sign-distro-packages: 'false'
      publish-container-images: 'false'
    secrets:
      RELEASE_SSH_SIGNING_KEY: ${{ secrets.RELEASE_SSH_SIGNING_KEY }}
      RELEASE_COSIGN_PRIVATE_KEY: ${{ secrets.RELEASE_COSIGN_PRIVATE_KEY }}
      RELEASE_COSIGN_PASSPHRASE: ${{ secrets.RELEASE_COSIGN_PASSPHRASE }}
      RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
      RELEASE_GPG_FINGERPRINT: ${{ secrets.RELEASE_GPG_FINGERPRINT }}
      RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      RELEASE_REGISTRY_TOKEN: ${{ secrets.RELEASE_REGISTRY_TOKEN }}

  build:
    name: Build minimal binary release
    needs: prepare
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    # The build brings its own Go rather than trusting the runner label's
    # image to have one: the label is the lab's generic one, whose image is
    # Node. Same Go as go.mod, by digest so the canary cannot change under
    # the scenario.
    container:
      image: docker.io/library/golang:1.27.2-trixie@sha256:e58d6f83b3416618d8bcac2b3dde1b7f7e3c4a77d25e88637f8bbae81536c48d
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      dist-digest: ${{ steps.dist.outputs.digest }}
    steps:
      - name: Set up forge-ci
        uses: https://FORGE_HOST/OWNER/forge-ci/.forgejo/actions/setup-forge-ci@PIN_FORGE_CI_SHA
        with:
          expected-sha256: RENDER_FORGE_CI_SHA256

      - name: Checkout prepared release
        env:
          CHECKOUT_REF: ${{ needs.prepare.outputs.release-sha }}
        run: |
          set -euo pipefail
          forge-ci platform checkout --fetch-all-refs

      - name: Validate the prepared changelog-only commit
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release-sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}
          REQUEST_SHA: ${{ forgejo.sha }}
        run: |
          set -euo pipefail
          forge-ci release validate-tag --release-sha "${RELEASE_SHA}" \
            --tag "${RELEASE_TAG}" --expected-parent "${REQUEST_SHA}" \
            --changelog-only

      # The layer's Go build, stamped with the prepared release and not with
      # the request the runner checked out for. The Go image carries no
      # cyclonedx-gomod, so no Build SBOM: the SBOM below is the fixture's.
      - name: Build canary binary
        uses: https://FORGE_HOST/OWNER/forge-ci/.forgejo/actions/build-go@PIN_FORGE_CI_SHA
        with:
          version: ${{ needs.prepare.outputs.release-tag }}
          commit: ${{ needs.prepare.outputs.release-sha }}
          main-package: ./cmd/layer-release-canary
          build-sbom: 'false'

      - name: Pack canary archive and declare the release files
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          test "${version}" = 0.0.1
          archive="layer-release-canary_${version}_linux_amd64.tar.gz"
          sbom="${archive}.sbom.json"
          checksums="layer-release-canary_${version}_checksums.txt"
          built=dist/linux-amd64/layer-release-canary-linux-amd64
          test "$("${built}")" = "layer-release-canary ${version}"
          stage=$(mktemp -d)
          trap 'rm -rf -- "${stage}"' EXIT
          mkdir -p "${stage}/layer-release-canary_${version}_linux_amd64"
          # The release ships the archive alone: the binary moves into it
          # under the product's name, and its platform directory goes.
          mv -- "${built}" "${stage}/layer-release-canary_${version}_linux_amd64/layer-release-canary"
          rmdir dist/linux-amd64
          tar --format=ustar --sort=name --mtime='@946684800' --owner=0 --group=0 \
            --numeric-owner -C "${stage}" \
            -cf - "layer-release-canary_${version}_linux_amd64" | gzip -n >"dist/${archive}"
          # The Go image carries no jq; the document is fixed apart from the
          # version checked above.
          printf '{"bomFormat":"CycloneDX","components":[],"metadata":{"component":{"name":"layer-release-canary","type":"application","version":"%s"}},"specVersion":"1.5","version":1}\n' \
            "${version}" >"dist/${sbom}"
          forge-ci release notes --changelog-file CHANGELOG.md \
            --release-version "${RELEASE_TAG}" --target-file dist/release-notes.md
          # The producer's hand-off: the checksums file over the archive and
          # the SBOM, and the manifest that declares the three. release-notes.md
          # is the release body, not a public file, so it is not declared.
          forge-ci release files declare \
            --asset "dist/${archive}" \
            --sbom "dist/${sbom}" \
            --checksums-file "dist/${checksums}"

      - name: Upload unsigned dist hand-off
        id: dist
        uses: https://FORGE_HOST/OWNER/forge-ci/.forgejo/actions/upload-dist@PIN_FORGE_CI_SHA
        with:
          artifact-name: build-dist
          path: dist/

  sign-and-publish:
    name: Sign and publish minimal binary release
    needs: [prepare, build]
    if: ${{ always() && needs.build.result == 'success' }}
    uses: OWNER/forge-ci/.forgejo/workflows/sign-and-publish-release.yml@PIN_FORGE_CI_SHA
    with:
      runner-label: ${{ vars.CI_RUNNER_LABEL }}
      forge-ci-repository: RENDER_FORGE_CI_REPOSITORY
      forge-ci-sha: PIN_FORGE_CI_SHA
      signer-image: RENDER_SIGNER_IMAGE
      # A literal block: the key reaches the called workflow as a multi-line
      # input, as a consumer's does when it comes from a variable.
      cosign-public-key: |
        RENDER_COSIGN_PUBLIC_KEY
      cosign-public-key-sha256: RENDER_COSIGN_PUBLIC_KEY_SHA256
      release-tag: ${{ needs.prepare.outputs.release-tag }}
      release-sha: ${{ needs.prepare.outputs.release-sha }}
      release-request-sha: ${{ forgejo.sha }}
      dist-digest: ${{ needs.build.outputs.dist-digest }}
      artifact-name: build-dist
      artifact-path: dist/
      caller-workflow: layer-minimal-release.yml
      sign-distro-packages: 'false'
    secrets:
      RELEASE_COSIGN_PRIVATE_KEY: ${{ secrets.RELEASE_COSIGN_PRIVATE_KEY }}
      RELEASE_COSIGN_PASSPHRASE: ${{ secrets.RELEASE_COSIGN_PASSPHRASE }}
      RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
      RELEASE_GPG_FINGERPRINT: ${{ secrets.RELEASE_GPG_FINGERPRINT }}
      RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      RELEASE_REGISTRY_TOKEN: ${{ secrets.RELEASE_REGISTRY_TOKEN }}
