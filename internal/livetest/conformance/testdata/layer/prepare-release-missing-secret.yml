# Live-tier fixture of TestForgejoLayer_PrepareReleaseStopsOnAMissingSecret. A
# template, rendered and committed to a scratch repository on the lab as the
# artifact round trip's is. It calls prepare-release.yml with every secret
# present but one, and none of them a credential: the run is expected to
# fail in the secret check, before the layer fetches or pushes anything.
name: Forgejo layer prepare missing-secret fail-fast

on:
  push:
    branches: [main]

jobs:
  prepare-release-missing-secret:
    uses: OWNER/forge-ci/.forgejo/workflows/prepare-release.yml@PIN_FORGE_CI_SHA
    with:
      runner-label: ${{ vars.CI_RUNNER_LABEL }}
      forge-ci-repository: RENDER_FORGE_CI_REPOSITORY
      forge-ci-sha: PIN_FORGE_CI_SHA
      signer-image: acceptance.invalid/signer@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      bot-name: Layer acceptance
      bot-email: layer-acceptance@invalid.example
      release-git-url: ssh://git@acceptance.invalid:2222/acceptance/not-used.git
      release-git-host-key-fingerprint: SHA256:acceptance-not-used-before-secret-check
    secrets:
      RELEASE_SSH_SIGNING_KEY: acceptance-present-not-a-credential
      RELEASE_COSIGN_PRIVATE_KEY: acceptance-present-not-a-credential
      RELEASE_COSIGN_PASSPHRASE: acceptance-present-not-a-credential
      RELEASE_GPG_PRIVATE_KEY: acceptance-present-not-a-credential
      RELEASE_GPG_FINGERPRINT: acceptance-present-not-a-credential
      RELEASE_GPG_PASSPHRASE: acceptance-present-not-a-credential
      RELEASE_TOKEN: acceptance-present-not-a-credential
      # RELEASE_REGISTRY_TOKEN is intentionally absent.
